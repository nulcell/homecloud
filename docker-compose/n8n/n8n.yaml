name: n8n
# Generate `.env` file from `.env.example` using 1password
# - `op inject -i .env.example -o .env --force`
# Create n8n namespace if it doesn't exist
# - `kubectl create namespace n8n --dry-run=client -o yaml | kubectl apply -f -`
# Generate kubernetes manifest with Kompose from Docker Compose file
# - `kompose convert --namespace n8n --file n8n.yaml --service-group-mode label --with-kompose-annotation=false --out - | kubectl apply -f -`
# To delete:
# - `kompose convert --namespace n8n --file n8n.yaml --service-group-mode label --with-kompose-annotation=false --out - | kubectl delete -f -`
services:
  traefik:
    profiles: ["ignore"]
    image: "traefik"
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.0.2
    restart: always
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
    # depends_on:
    #   init-service:
    #     condition: service_completed_successfully
    ports:
      - "127.0.0.1:5678:5678"
      - "127.0.0.1:5679:5679"
    labels:
      - kompose.image-pull-policy=IfNotPresent
      - kompose.security-context.fsgroup=1000
      - kompose.volume.size=1Gi
      - kompose.volume.storage-class-name=cloudstack-custom-disk-offering
      - kompose.volume.type=persistentVolumeClaim
      - kompose.service.group=n8n
      - kompose.service.type=clusterip
      - kompose.service.expose=${SUBDOMAIN}.${DOMAIN_NAME}
      - kompose.service.expose.ingress-class-name=traefik
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=le
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
      - traefik.ingress.kubernetes.io/router.tls.certresolver=le
    cap_add:
      - ALL
    cap_drop:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      - N8N_LOG_LEVEL=info
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_RUNNERS_ENABLED=true
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - DB_TYPE=sqlite
      - N8N_PROXY_HOPS=1
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNER_SECRET:-your-secret-here}
      - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_RUNNERS_STDLIB_ALLOW=*
      - N8N_RUNNERS_EXTERNAL_ALLOW=*
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/files

  n8n-task-runner:
    image: n8nio/runners:2.0.2
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    labels:
      - kompose.image-pull-policy=IfNotPresent
      - kompose.service.group=n8n-task-runner
    cap_add:
      - ALL
    cap_drop:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      - N8N_RUNNERS_LAUNCHER_LOG_LEVEL=debug
      - N8N_RUNNERS_TASK_BROKER_URI=http://${N8N_BROKER_URI:-n8n.n8n.svc.cluster.local}:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNER_SECRET:-your-secret-here}
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=15
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_RUNNERS_STDLIB_ALLOW=*
      - N8N_RUNNERS_EXTERNAL_ALLOW=*
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
    depends_on:
      - n8n

  init-service:
    profiles: ["ignore"]
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - n8n_data:/data
    labels:
      - kompose.service.group=n8n
    restart: "no"

volumes:
  traefik_data:
  n8n_data:
  n8n_files:
