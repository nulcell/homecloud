# Neutron ML2 with OVN — single-node, two physnets:
#   physnet1 → flat external network on br-ex (NIC2)
# kolla wires br-ex to neutron_external_interface automatically.

[ml2]
type_drivers = flat,vlan,geneve
tenant_network_types = geneve
mechanism_drivers = ovn
extension_drivers = port_security,qos

[ml2_type_flat]
flat_networks = physnet1

[ml2_type_geneve]
vni_ranges = 1:65535
max_header_size = 38

[ml2_type_vlan]
network_vlan_ranges = physnet1:100:4000

[ovn]
ovn_emit_need_to_frag = True
ovn_metadata_enabled = True
enable_distributed_floating_ip = True
