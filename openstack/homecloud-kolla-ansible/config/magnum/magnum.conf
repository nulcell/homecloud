# Magnum overrides — bias toward the cluster_api_driver / k8s defaults.
# Magnum's legacy Heat templates are deprecated; new templates configured
# in configure.sh use the cluster_api_driver via Magnum.

[DEFAULT]
trustee_keystone_interface = internal

[trust]
cluster_user_trust = True

[cluster_template]
kubernetes_allowed_network_drivers = calico,cilium,flannel
kubernetes_default_network_driver = calico

[cinder]
default_docker_volume_type = lvm-1

[octavia]
# Use the kolla-managed Octavia for k8s LoadBalancer services.
default_lb_provider_name = amphora
