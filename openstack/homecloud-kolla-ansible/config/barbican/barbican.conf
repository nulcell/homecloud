# Barbican overrides — make the simple_crypto plugin explicit.
# The KEK (kek_secret) lives in /etc/kolla/passwords.yml as
# `barbican_simple_crypto_kek` and is auto-generated by kolla-genpwd.
#
# When you outgrow simple_crypto, swap in the PKCS#11 plugin and point at an
# HSM / SoftHSM here. Octavia/Magnum/Trust workflows all consume this store.

[secretstore]
namespace = barbican.secretstore.plugin
enabled_secretstore_plugins = store_crypto

[crypto]
namespace = barbican.crypto.plugin
enabled_crypto_plugins = simple_crypto

[simple_crypto_plugin]
plugin_name = Software Only Crypto

# Lower the default ACL caching TTL — fine for single-node, easier to debug.
[keystone_authtoken]
service_token_roles_required = true
