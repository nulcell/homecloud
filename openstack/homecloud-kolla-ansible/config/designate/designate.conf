# Designate overrides
# Backend is bind9 (set in globals.yml). These tweaks make the DNS service
# usable as a recursive resolver for tenants and integrate it with Neutron
# so port-create events auto-publish A/PTR records.

[service:central]
managed_resource_email = managed@homecloud.local

[service:api]
enable_api_admin = True
enabled_extensions_admin = quotas,reports,counts,tenants

[service:worker]
notification_topic = designate

[network_api:neutron]
endpoints = regionOne|http://{{ kolla_internal_fqdn }}:9696
