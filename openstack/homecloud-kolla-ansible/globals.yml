---
# Kolla-Ansible globals for homecloud single-node OpenStack
# Reference: https://docs.openstack.org/kolla-ansible/latest/admin/production-architecture-guide.html
#
# Anything that depends on the host environment (IPs, interfaces, VIP) is
# defined here. Per-service overrides live under config/<service>/.

###############################################################################
# Release + base
###############################################################################
kolla_base_distro: "ubuntu"
openstack_release: "2025.1"
kolla_install_type: "source"

# Container engine
kolla_container_engine: "docker"

###############################################################################
# Networking — single-node, two NIC layout
#   network_interface             = NIC1 (mgmt/API, has the static IP)
#   neutron_external_interface    = NIC2 (no IP, plugged into OVN br-ex)
#   kolla_internal_vip_address    = a *free* IP on NIC1's subnet (HAProxy VIP)
###############################################################################
network_interface: "eth0"
neutron_external_interface: "eth1"

# VIP — must be free on the mgmt L2 segment. Validated by install.sh.
kolla_internal_vip_address: "10.10.17.6"

# We co-locate external + internal endpoints on the same VIP for simplicity.
# Set kolla_external_vip_address separately if you want a dedicated public VIP.
kolla_external_vip_address: "{{ kolla_internal_vip_address }}"

###############################################################################
# TLS — disabled in v1. Enable later by setting these to "yes" and dropping
# certs into /etc/kolla/certificates/.
###############################################################################
kolla_enable_tls_internal: "no"
kolla_enable_tls_external: "no"

###############################################################################
# HA — single-node still benefits from HAProxy + keepalived for the VIP.
###############################################################################
enable_haproxy: "yes"
enable_keepalived: "yes"

###############################################################################
# Services — Core
###############################################################################
enable_keystone: "yes"
enable_glance: "yes"
enable_placement: "yes"
enable_nova: "yes"
enable_neutron: "yes"
enable_horizon: "yes"
enable_mariadb: "yes"
enable_rabbitmq: "yes"
enable_memcached: "yes"
enable_openvswitch: "no"          # OVN doesn't need OVS agent

# Nova / KVM
nova_compute_virt_type: "kvm"
nova_console: "novnc"

# Neutron with OVN (the kolla default for 2025.1)
neutron_plugin_agent: "ovn"
enable_ovn: "yes"
neutron_ovn_distributed_fip: "yes"

###############################################################################
# Services — Block + File storage
###############################################################################
enable_cinder: "yes"
enable_cinder_backend_lvm: "yes"
cinder_volume_group: "cinder-volumes"

enable_manila: "yes"
enable_manila_backend_generic: "no"
enable_manila_backend_lvm: "yes"
manila_lvm_share_volume_group: "manila-volumes"
# NFS-Ganesha exposes the LVM-backed shares
enable_manila_backend_cephfs_native: "no"

###############################################################################
# Services — Magnum stack (managed Kubernetes)
###############################################################################
enable_magnum: "yes"
enable_heat: "yes"
enable_octavia: "yes"
enable_barbican: "yes"

# Octavia — let kolla manage the LB management network + amphora image.
# Defaults from kolla-ansible roles/octavia/defaults/main.yml are correct for
# OVN (geneve overlay, /24 LB mgmt CIDR). Override `octavia_amp_network_cidr`
# only if 10.1.0.0/24 collides with something on your home LAN.
octavia_auto_configure: "yes"

###############################################################################
# Services — DNS
###############################################################################
enable_designate: "yes"
designate_backend: "bind9"
# NS records published in every zone. Update if you have real upstream NS.
designate_ns_record:
  - "ns1.homecloud.local"
# Tenants can resolve via Designate's bind9 (single-node listens on the
# kolla_internal_vip_address:53 — exposed by HAProxy).
neutron_dns_integration: "yes"
neutron_dns_domain: "homecloud.local."

###############################################################################
# Misc tuning
###############################################################################
openstack_logging_debug: "False"

###############################################################################
# Object storage
# kolla-ansible 2025.1 removed its Swift role. Swift runs as host-native apt
# packages registered with Keystone — see openstack/extras/swift/install-swift.sh.
###############################################################################
enable_swift: "no"

###############################################################################
# Services — Managed Databases (Trove)
# Trove needs a guest image built with disk-image-create + the trove element.
# install.sh enables the service; configure.sh registers datastore versions.
###############################################################################
enable_trove: "yes"
# Single-tenant mode keeps the trove guest VMs on the trove service tenant
# instead of injecting them into user tenants — simpler for a homelab.
enable_trove_singletenant: "yes"

# Disable services we don't run
enable_ironic: "no"
enable_aodh: "no"
enable_ceilometer: "no"
enable_gnocchi: "no"
enable_skyline: "no"
