# Argo CD 9.5.14 values.
global:
  domain: argocd.nulcell.com

configs:
  params:
    server.insecure: true # TLS is terminated at the Gateway
  cm:
    timeout.reconciliation: 60s
    kustomize.buildOptions: "--enable-helm"
  cmp:
    create: true
    plugins:
      kustomize-sops:
        generate:
          command: [sh, -c]
          # The sidecar runs as uid 999 with no $HOME, so point helm's caches
          # at /tmp. Then for every local chart that declares dependencies,
          # register each `repository:` URL with helm (a one-time `helm repo
          # add`) before running `helm dependency update` to vendor the .tgz —
          # vendored deps + Chart.lock are gitignored and fetched at render
          # time. Finally, `kustomize build` with --load-restrictor=
          # LoadRestrictionsNone so kustomizations can reference files above
          # their own directory (helmGlobals.chartHome: ../../../charts).
          args:
            - |
              set -e
              export HOME=/tmp HELM_CACHE_HOME=/tmp/helm/cache HELM_CONFIG_HOME=/tmp/helm/config HELM_DATA_HOME=/tmp/helm/data
              mkdir -p "$HELM_CACHE_HOME" "$HELM_CONFIG_HOME" "$HELM_DATA_HOME"
              for d in ../../../charts/*/; do
                [ -f "${d}Chart.yaml" ] || continue
                grep -q '^dependencies:' "${d}Chart.yaml" || continue
                awk '/^[[:space:]]*repository:[[:space:]]*https?:/{print $2}' "${d}Chart.yaml" | sort -u | while read -r url; do
                  helm repo add "$(printf '%s' "$url" | sed 's|[^A-Za-z0-9]|-|g')" "$url" --force-update >/dev/null
                done
                helm dependency update "$d" >/dev/null
              done
              kustomize build --enable-alpha-plugins --enable-exec --load-restrictor=LoadRestrictionsNone .

server:
  service:
    type: LoadBalancer # Cilium L2 pool issues the IP
  ingress:
    enabled: false # HTTPRoute lives in gitops/
    ingressClassName: cilium
    hostname: argocd.nulcell.com
    paths:
      - /
    pathType: Prefix
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
    serviceMonitor:
      enabled: true

redis-ha:
  enabled: false # single-node; HA Redis is wasteful here

redis:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Bundled redis-exporter sidecar on :9121/metrics.
  exporter:
    enabled: true

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2048Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

notifications:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

dex:
  enabled: false # add later if you want SSO

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m # High ceiling for rapid manifest generation
      memory: 2048Mi # Extra space for massive Git checkouts
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  # SOPS decryption: mount the age key as a Secret named argocd-sops-age.
  # Create it once during bootstrap:
  #   kubectl -n argocd create secret generic argocd-sops-age \
  #     --from-file=key.txt=$HOME/.config/sops/age/keys.txt
  volumes:
    - name: sops-age
      secret:
        secretName: argocd-sops-age
    - name: cmp-tmp
      emptyDir: {}
    - name: kustomize-sops-config
      configMap:
        name: argocd-cmp-cm
        items:
          - key: kustomize-sops.yaml
            path: plugin.yaml
    # Populated by the download-tools initContainer below; mounted into the
    # kustomize-sops sidecar so `kustomize build` can shell out to `helm` when
    # rendering `helmCharts:` blocks (external-dns, kube-prometheus-stack, etc.).
    - name: custom-tools
      emptyDir: {}
  volumeMounts:
    - name: sops-age
      mountPath: /sops
      readOnly: true
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops/key.txt
  # Downloads helm into the shared custom-tools volume. Bump HELM_VERSION
  # alongside any cluster-wide helm-rendered manifest changes.
  initContainers:
    - name: download-tools
      image: alpine:3.20
      command: [sh, -c]
      args:
        - |
          set -eux
          HELM_VERSION=v3.16.4
          wget -qO- "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xzO linux-amd64/helm > /custom-tools/helm
          chmod +x /custom-tools/helm
      volumeMounts:
        - name: custom-tools
          mountPath: /custom-tools
  extraContainers:
    - name: kustomize-sops
      image: viaductoss/ksops:v4.3.3
      command: [/var/run/argocd/argocd-cmp-server]
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      env:
        - name: SOPS_AGE_KEY_FILE
          value: /sops/key.txt
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: cmp-tmp
          mountPath: /tmp
        - name: sops-age
          mountPath: /sops
          readOnly: true
        - name: kustomize-sops-config
          mountPath: /home/argocd/cmp-server/config
        # Drop the helm binary directly onto PATH inside this sidecar.
        - name: custom-tools
          mountPath: /usr/local/bin/helm
          subPath: helm
