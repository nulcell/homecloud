# Argo CD 10.3.0 values (chart version pinned in install.sh).
global:
  domain: argocd.nulcell.com

configs:
  params:
    server.insecure: true # TLS is terminated at the Gateway
  cm:
    timeout.reconciliation: 60s
    # --load-restrictor=LoadRestrictionsNone lets kustomizations reference files
    # outside their own directory - needed by helmGlobals.chartHome paths like
    # ../../../charts (e.g. gitops/apps/n8n -> charts/n8n).
    kustomize.buildOptions: "--enable-helm --load-restrictor=LoadRestrictionsNone"

server:
  replicas: 1
  ## Argo CD server Horizontal Pod Autoscaler
  autoscaling:
    # -- Enable Horizontal Pod Autoscaler ([HPA]) for the Argo CD server
    enabled: true
    # -- Minimum number of replicas for the Argo CD server [HPA]
    minReplicas: 1
    # -- Maximum number of replicas for the Argo CD server [HPA]
    maxReplicas: 3
    # -- Average CPU utilization percentage for the Argo CD server [HPA]
    targetCPUUtilizationPercentage: 75
    # -- Average memory utilization percentage for the Argo CD server [HPA]
    targetMemoryUtilizationPercentage: 75
  service:
    type: LoadBalancer # Cilium L2 pool issues the IP
  ingress:
    enabled: false # HTTPRoute lives in gitops/
    ingressClassName: cilium
    hostname: argocd.nulcell.com
    paths:
      - /
    pathType: Prefix
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
    serviceMonitor:
      enabled: true

redis-ha:
  enabled: false # single-node; HA Redis is wasteful here

redis:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Bundled redis-exporter sidecar on :9121/metrics.
  exporter:
    enabled: true

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2048Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

notifications:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

dex:
  enabled: false # add later if you want SSO

repoServer:
  replicas: 1
  ## Repo server Horizontal Pod Autoscaler
  autoscaling:
    # -- Enable Horizontal Pod Autoscaler ([HPA]) for the repo server
    enabled: true
    # -- Minimum number of replicas for the repo server [HPA]
    minReplicas: 1
    # -- Maximum number of replicas for the repo server [HPA]
    maxReplicas: 3
    # -- Average CPU utilization percentage for the repo server [HPA]
    targetCPUUtilizationPercentage: 75
    # -- Average memory utilization percentage for the repo server [HPA]
    targetMemoryUtilizationPercentage: 75
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m # High ceiling for rapid manifest generation
      memory: 2048Mi # Extra space for massive Git checkouts
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
