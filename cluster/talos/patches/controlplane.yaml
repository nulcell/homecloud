# Control plane only, applied after common.yaml.
machine:
  certSANs: # Talos API cert
    - k8s.nulcell.com # the VIP's DNS name
    - 10.10.25.25 # the VIP
    - 10.10.17.5 # node #1
cluster:
  etcd:
    advertisedSubnets:
      - 10.10.16.0/20
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381 # kube-prometheus-stack; pins metrics off 2383
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - k8s.nulcell.com
  - 10.10.25.25
  - 10.10.17.5
extraArgs:
  enable-aggregator-routing: "true"
---
# Bind to all addresses so kube-prometheus-stack can scrape them.
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# Hyperconverged: workloads run on the control plane until there are 3.
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false # Cilium replaces kube-proxy
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete # Cilium is the CNI
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.10.25.25
link: apiservervip0
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: apiservervip%d
selector:
  match: true
