# Set talosconfig: export TALOSCONFIG=$(pwd)/generated/talosconfig
#
# Patch merged onto the output of:
#   talosctl gen config homecloud https://k8s.nulcell.com:6443
#
# Apply patch with:
#   talosctl machineconfig patch generated/worker.yaml \
#     --patch @patches/worker.yaml \
#     --output worker-final.yaml
#
# Apply the final config to the node with:
#   talosctl apply -f worker-final.yaml --nodes <node-ip>
#
# Confirm the NIC name on the running node with `talosctl get links` before applying.
machine:
  network:
    nameservers:
      - 10.10.31.254 # home DNS
      - 1.1.1.1
  install:
    disk: /dev/nvme0n1
    image: factory.talos.dev/metal-installer/d78c7cda9fda387e6420896d82d50d5cc97d004feeece7812703c5e1582b82f7:v1.13.2
    wipe: true
  time:
    servers:
      - pool.ntp.org
  certSANs: # API server cert must cover every address clients hit
    - k8s.nulcell.com # the VIP's DNS name
    - 10.10.25.25 # the VIP
    - 10.10.17.5 # node #1
  kubelet:
    extraArgs:
      rotate-server-certificates: "true"
    extraMounts:
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options:
          - bind
          - rshared
          - rw
    nodeIP:
      validSubnets:
        - 10.10.16.0/20
  sysctls:
    vm.nr_hugepages: "1024"
  kernel:
    modules:
      - name: iscsi_tcp
      - name: nvme_tcp
      - name: vfio_pci
      - name: uio_pci_generic
# ---
# apiVersion: v1alpha1
# kind: HostnameConfig
# auto: "off"
# hostname: talos-worker-1 # A static hostname to set for the machine.
