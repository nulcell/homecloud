apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level namespace: — each HTTPRoute lives in its backend's namespace so
# we don't need ReferenceGrants for cross-namespace service references.
resources:
  - argocd.yaml
  - longhorn.yaml
  - grafana.yaml
  - kubevirt-manager.yaml
