# Rancher 2.14.1 values for a homelab cluster, following the official install
# guide for an in-cluster Ingress with cert-manager-issued TLS:
# https://ranchermanager.docs.rancher.com/getting-started/installation-and-upgrade/install-upgrade-on-a-kubernetes-cluster

hostname: rancher.nulcell.com

# Single replica — Rancher's "local" cluster (this one) is a single point of
# failure anyway in a homelab. Bump to 3 when you have a 3-node HA control plane.
replicas: 1

# Let the chart create its own Ingress. Cilium's ingressController.default is
# true, so the Cilium Ingress controller picks it up and provisions a dedicated
# LoadBalancer Service from the L2 pool.
ingress:
  enabled: true
  ingressClassName: cilium
  tls:
    # `secret` = the Ingress declares spec.tls and expects a Secret named
    # `tls-rancher-ingress` in cattle-system. cert-manager's ingress-shim sees
    # the annotation below and mints that Secret from our existing DNS-01
    # ClusterIssuer — no chart-internal Let's Encrypt machinery needed.
    source: secret
  extraAnnotations:
    cert-manager.io/cluster-issuer: letsencrypt-nulcell-com

# Top-level `tls: ingress` (the default) tells Rancher itself to expect TLS to
# be terminated at the Ingress. privateCA stays false — Let's Encrypt's chain
# is trusted natively, so downstream cluster agents won't need a custom CA.
privateCA: false

# Resource budget — Rancher idles around 600Mi–1Gi and spikes on cluster
# imports. Generous limit so OOMKills don't blow up the management plane.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

# Keep the local-cluster registration so Rancher manages itself.
addLocal: "true"

# Pin a known bootstrap password so the admin login is recoverable even if
# rancher-webhook is mid-bootstrap. Encrypt with SOPS once the cluster is stable.
bootstrapPassword: "homecloud-bootstrap"
