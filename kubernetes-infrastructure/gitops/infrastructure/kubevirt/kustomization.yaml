apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The upstream operator manifest already creates the `kubevirt` namespace with
# `pod-security.kubernetes.io/enforce: privileged`, so we don't declare it
# separately. The `KubeVirt` CR tells the operator what to actually install.
namespace: kubevirt

resources:
  # Vendor-free pin to the v1.8.2 release. ArgoCD's repo-server fetches this
  # at render time; bump the version in lockstep with the upstream changelog.
  - https://github.com/kubevirt/kubevirt/releases/download/v1.8.2/kubevirt-operator.yaml
  - kubevirt.yaml
