apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The KubeVirt operator + CR are pulled directly from upstream releases.
# Bump the version here when you want to upgrade.
resources:
  - namespace.yaml
  - https://github.com/kubevirt/kubevirt/releases/download/v1.4.0/kubevirt-operator.yaml
  - kubevirt-cr.yaml
