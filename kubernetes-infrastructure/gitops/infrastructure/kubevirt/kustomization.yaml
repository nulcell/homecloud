apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level `namespace:` — KubeVirt resources stay in `kubevirt`, CDI in
# `cdi`. Each upstream operator manifest already creates and namespaces its
# own resources. Both operators ship with `pod-security.kubernetes.io/enforce:
# privileged` on their namespaces, so no namespace patching is needed.
#
# ArgoCD's repo-server fetches both operator manifests at render time. Keep
# the two versions paired with a known-good KubeVirt/CDI combination —
# https://github.com/kubevirt/kubevirt/blob/main/docs/compatibility.md

resources:
  - https://github.com/kubevirt/kubevirt/releases/download/v1.8.2/kubevirt-operator.yaml
  - https://github.com/kubevirt/containerized-data-importer/releases/download/v1.65.0/cdi-operator.yaml
  - kubevirt.yaml
  - cdi.yaml
