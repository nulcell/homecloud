apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
  annotations:
    argocd.argoproj.io/sync-wave: "5"   # after operator CRDs/deployment land
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates:
        - LiveMigration
        - HotplugVolumes
        - GPU
    # Bare-metal node — emulation is fine for arch tests, but real VMs use KVM.
    # Set to true to allow nodes without /dev/kvm; leave false on hardware.
    # permittedHostDevices: {}
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
