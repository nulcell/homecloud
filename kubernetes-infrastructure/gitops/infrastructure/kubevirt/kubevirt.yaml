# KubeVirt operator config. The operator reconciles this CR to install /
# upgrade the actual KubeVirt components (virt-api, virt-controller, virt-handler,
# virt-operator). Sync wave 5 keeps it ordered after the CRD lands in wave 0.
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  configuration:
    developerConfiguration:
      featureGates:
        - LiveMigration
        - NetworkBindingPlugins
        - HotplugVolumes
        - HostDisk
        - VMExport
        - Snapshot
        - ExpandDisks
        - ExperimentalIgnitionSupport
    smbios:
      sku: "TalosCloud"
      version: "v0.1.0"
      manufacturer: "Talos Virtualization"
      product: "talosvm"
      family: "ccio"
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate # enable if you have deployed either Longhorn or NFS-CSI for shared storage.
