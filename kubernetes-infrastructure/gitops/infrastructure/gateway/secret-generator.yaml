# ksops generator — tells kustomize to invoke the `ksops` binary on each listed
# file, which decrypts it and emits the clean Secret. Without this, kustomize
# treats `*.enc.yaml` as a finished resource and the `sops:` metadata block
# leaks into the cluster apply, which fails schema validation.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: cloudflare-token-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - cloudflare-token.enc.yaml
