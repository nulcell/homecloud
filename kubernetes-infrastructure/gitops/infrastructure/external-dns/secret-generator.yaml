# Reuses the encrypted Cloudflare token from ../gateway/. ksops resolves these
# paths itself (kustomize's load restrictor doesn't see them), so `../` works.
# The decrypted Secret declares `namespace: cert-manager`; the namespace override
# in this folder's kustomization.yaml remaps it to `external-dns`.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: cloudflare-token-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ../gateway/cloudflare-token.enc.yaml
