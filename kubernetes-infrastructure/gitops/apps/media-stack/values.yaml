# Overrides for the media-stack chart at kubernetes-infrastructure/charts/media-stack/.
# Everything not listed here keeps the chart's default value.

common:
  puid: 1000
  pgid: 1000
  timezone: Europe/Amsterdam

persistence:
  storageClassName: longhorn
  accessMode: ReadWriteMany
  config:
    size: 20Gi
  data:
    size: 500Gi

vpn:
  enabled: true
  provider: nordvpn
  # Switch between openvpn / wireguard freely — both sets of credentials live
  # in the same Secret, so flipping type and resyncing is enough.
  type: wireguard
  serverCountries: Netherlands
  credentialsSecret:
    name: media-stack-vpn
    userKey: openvpn-user
    passwordKey: openvpn-password
    wireguardPrivateKeyKey: wireguard-private-key
  # Gluetun's DoT (DNS-over-TLS) upstream wasn't completing through the
  # NordVPN tunnel — every hostname lookup (blocklist downloads, healthcheck)
  # timed out and tripped the VPN restart loop, even though the tunnel itself
  # carries traffic fine. Drop to plain DNS, skip blocklists, and point the
  # healthcheck at a raw IP so DNS isn't on the critical path.
  extraEnv:
    - { name: DOT, value: "off" }
    - { name: BLOCK_MALICIOUS, value: "off" }
    - { name: BLOCK_SURVEILLANCE, value: "off" }
    - { name: BLOCK_ADS, value: "off" }
    - { name: HEALTH_TARGET_ADDRESS, value: "1.1.1.1:443" }
    - { name: HEALTH_VPN_DURATION_INITIAL, value: "30s" }

# Hostnames published via external-dns. Omit any to keep that app internal-only.
jellyfin:
  publishedServerUrl: https://jellyfin.nulcell.com
  gateway:
    hostname: jellyfin.nulcell.com

jellyseerr:
  gateway:
    hostname: jellyseerr.nulcell.com

sonarr:
  gateway:
    hostname: sonarr.nulcell.com

radarr:
  gateway:
    hostname: radarr.nulcell.com

bazarr:
  gateway:
    hostname: bazarr.nulcell.com

prowlarr:
  gateway:
    hostname: prowlarr.nulcell.com

qbittorrent:
  gateway:
    hostname: qbittorrent.nulcell.com
