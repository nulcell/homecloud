# Overrides for the media-stack chart at kubernetes-infrastructure/charts/media-stack/.
# Everything not listed here keeps the chart's default value.

common:
  puid: 1000
  pgid: 1000
  timezone: Europe/Amsterdam

persistence:
  storageClassName: longhorn
  accessMode: ReadWriteMany
  config:
    size: 20Gi
  data:
    size: 500Gi

vpn:
  enabled: true
  image:
    tag: v3.41.1
  provider: nordvpn
  # Switch between openvpn / wireguard freely — both sets of credentials live
  # in the same Secret, so flipping type and resyncing is enough.
  type: wireguard
  serverCountries: Netherlands
  credentialsSecret:
    name: media-stack-vpn
    userKey: openvpn-user
    passwordKey: openvpn-password
    wireguardPrivateKeyKey: wireguard-private-key
  # Disable gluetun's bundled DNS server entirely and let the pod resolve via
  # Kubernetes CoreDNS — reachable because the cluster service CIDR
  # (10.96.0.0/12) is inside the killswitch's allowed 10.0.0.0/8 subnet.
  # Avoids gluetun's DoT-through-the-tunnel issue against NordVPN. Healthcheck
  # also targets an IP, not a hostname, so VPN health no longer depends on DNS.
  extraEnv:
    - { name: DNS_KEEP_NAMESERVER, value: "on" }
    - { name: HEALTH_TARGET_ADDRESSES, value: "1.1.1.1:443" }
    - { name: HEALTH_VPN_DURATION_INITIAL, value: "30s" }

# Hostnames published via external-dns. Omit any to keep that app internal-only.
jellyfin:
  image:
    tag: latest
  publishedServerUrl: https://jellyfin.nulcell.com
  hwAccel:
    enabled: true
    # TEMPORARY — proves VAAPI by bypassing the Kubernetes device cgroup.
    # Revert to `privileged: false` once we wire up a device plugin (e.g.
    # squat/generic-device-plugin) for proper, non-privileged GPU access.
    privileged: true
  gateway:
    hostname: jellyfin.nulcell.com

seerr:
  image:
    tag: v3.2.0
  gateway:
    hostname: seerr.nulcell.com

sonarr:
  gateway:
    hostname: sonarr.nulcell.com

radarr:
  gateway:
    hostname: radarr.nulcell.com

bazarr:
  gateway:
    hostname: bazarr.nulcell.com

prowlarr:
  gateway:
    hostname: prowlarr.nulcell.com

qbittorrent:
  gateway:
    hostname: qbittorrent.nulcell.com

tdarr:
  enabled: false
  # All cluster nodes carry an AMD iGPU exposed at /dev/dri, so no nodeName
  # pin — tdarr can land anywhere and use VAAPI from whichever node hosts it.
  hwAccel:
    enabled: true
  gateway:
    hostname: tdarr.nulcell.com
