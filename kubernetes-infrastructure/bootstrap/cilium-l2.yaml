apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: kube-system
spec:
  blocks:
    - start: 10.10.20.0
      stop: 10.10.20.254
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: kube-system
spec:
  loadBalancerIPs: true
  interfaces:
    - ^enp[0-9]s[0-9].*
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
