# Cilium 1.19.4 values for Talos (kube-proxy replacement + L2 LB + Gateway API).
# See https://docs.cilium.io/en/v1.19/installation/k8s-install-helm/

kubeProxyReplacement: true

# kube-proxy is disabled in Talos, so Cilium needs an explicit API server endpoint.
# This is the Talos VIP — already active on node #1 and shared with future CPs.
k8sServiceHost: 10.10.25.25
k8sServicePort: 6443

ipam:
  mode: kubernetes

routingMode: native
ipv4NativeRoutingCIDR: 10.244.0.0/16
autoDirectNodeRoutes: true

bpf:
  masquerade: true

l2announcements:
  enabled: true
externalIPs:
  enabled: true

# L2 leader election bumps the apiserver client; raise the limits or it flaps.
k8sClientRateLimit:
  qps: 50
  burst: 200

gatewayAPI:
  enabled: true

ingressController:
  enabled: true
  default: true
  loadbalancer:
    annotationPattern: "cilium.io/*"

# Talos-specific: Cilium must not auto-mount its own cgroup root.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

resources:
  requests:
    cpu: 100m
    memory: 512Mi # Increased baseline because Hubble and Gateway API cache rules in memory
  limits:
    cpu: 1000m # Generous core limit to avoid compilation lag when eBPF maps regenerate
    memory: 1024Mi # Safe upper bound to insulate the host from memory leaks

envoy:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi # Baseline memory footprint to parse Envoy configuration filters
    limits:
      cpu: 500m # Capped to half a core to prevent runaway loop request overhead
      memory: 512Mi # Generous limit to accommodate high concurrent streams/TLS buffers

operator:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

hubble:
  enabled: true
  # Hubble Relay collects and aggregates flows from agents
  relay:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # Hubble UI provides the visual network map web application
  ui:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
