# Cilium 1.19.4 values for Talos (kube-proxy replacement + L2 LB + Gateway API).
# See https://docs.cilium.io/en/v1.19/installation/k8s-install-helm/

kubeProxyReplacement: true

# kube-proxy is disabled in Talos, so Cilium needs an explicit API server endpoint.
# Use the node IP for single-node; swap to the VIP when you go HA.
k8sServiceHost: <NODE_IP_OR_VIP>
k8sServicePort: 6443

ipam:
  mode: kubernetes

routingMode: native
ipv4NativeRoutingCIDR: 10.244.0.0/16
autoDirectNodeRoutes: true

bpf:
  masquerade: true

l2announcements:
  enabled: true
externalIPs:
  enabled: true

# L2 leader election bumps the apiserver client; raise the limits or it flaps.
k8sClientRateLimit:
  qps: 50
  burst: 200

gatewayAPI:
  enabled: true

operator:
  replicas: 1

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

# Talos-specific: Cilium must not auto-mount its own cgroup root.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
