# Argo CD 9.5.14 values.
global:
  domain: argocd.nulcell.com

configs:
  params:
    server.insecure: true # TLS is terminated at the Gateway
  cm:
    timeout.reconciliation: 60s
    kustomize.buildOptions: "--enable-helm"
  cmp:
    create: true
    plugins:
      kustomize-sops:
        generate:
          command: [sh, -c]
          args: ["kustomize build --enable-alpha-plugins --enable-exec ."]

server:
  service:
    type: LoadBalancer # Cilium L2 pool issues the IP
  ingress:
    enabled: true # HTTPRoute lives in gitops/
    ingressClassName: cilium
    hostname: argocd.nulcell.com
    paths:
      - /
    pathType: Prefix
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

redis-ha:
  enabled: false # single-node; HA Redis is wasteful here

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

dex:
  enabled: false # add later if you want SSO

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m # High ceiling for rapid manifest generation
      memory: 1024Mi # Extra space for massive Git checkouts
  # SOPS decryption: mount the age key as a Secret named argocd-sops-age.
  # Create it once during bootstrap:
  #   kubectl -n argocd create secret generic argocd-sops-age \
  #     --from-file=key.txt=$HOME/.config/sops/age/keys.txt
  volumes:
    - name: sops-age
      secret:
        secretName: argocd-sops-age
    - name: cmp-tmp
      emptyDir: {}
    - name: kustomize-sops-config
      configMap:
        name: argocd-cmp-cm
        items:
          - key: kustomize-sops.yaml
            path: plugin.yaml
  volumeMounts:
    - name: sops-age
      mountPath: /sops
      readOnly: true
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops/key.txt
  extraContainers:
    - name: kustomize-sops
      image: viaductoss/ksops:v4.3.3
      command: [/var/run/argocd/argocd-cmp-server]
      env:
        - name: SOPS_AGE_KEY_FILE
          value: /sops/key.txt
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: cmp-tmp
          mountPath: /tmp
        - name: sops-age
          mountPath: /sops
          readOnly: true
        - name: kustomize-sops-config
          mountPath: /home/argocd/cmp-server/config
