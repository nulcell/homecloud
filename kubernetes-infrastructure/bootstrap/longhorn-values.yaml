# Longhorn 1.11.2 values.
defaultSettings:
  defaultReplicaCount: 1 # Raise to 3 once you have 3 nodes
  defaultDataPath: /var/lib/longhorn
  storageOverProvisioningPercentage: 100
  storageMinimalAvailablePercentage: 15
  deletingConfirmationFlag: true # disable to prevent accidental deletions after testing

  defaultDataLocality: best-effort
  # Node drain policy
  nodeDrainPolicy: block-for-eviction
  # Guaranteed instance manager CPU
  guaranteedInstanceManagerCPU: 12

persistence:
  defaultClass: true
  defaultClassReplicaCount: 1
  reclaimPolicy: Delete # Retain
  defaultFsType: ext4

# Resource limits
longhornManager:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi # Increased baseline to handle cluster state mapping safely
    limits:
      memory: 1024Mi # Soft limit to shield node against heavy state synchronizations

longhornDriver:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi # Prevents the CSI attacher framework from exploding

longhornUI:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m # Standard safe boundary for the web engine frontend
      memory: 128Mi

ingress:
  enabled: yes # Exposed via Gateway HTTPRoute in gitops/
  ingressClassName: "cilium"
  host: "longhorn.nulcell.com"
  path: "/"
  pathType: Prefix

preUpgradeChecker:
  jobEnabled: false

# # CRITICAL FOR TALOS:
# # Informs the Container Storage Interface (CSI) where to mount active block devices.
# csi:
#   kubeletRootDir: /var/lib/kubelet
