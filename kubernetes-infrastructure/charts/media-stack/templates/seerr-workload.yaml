{{- if .Values.seerr.enabled }}
{{- $kind := .Values.seerr.workloadKind | default "Deployment" }}
apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: seerr
  namespace: {{ include "mediaStack.namespace" . }}
  labels:
    {{- include "mediaStack.labels" (dict "ctx" . "app" "seerr") | nindent 4 }}
spec:
  replicas: 1
  {{- if eq $kind "StatefulSet" }}
  serviceName: seerr
  updateStrategy:
    type: RollingUpdate
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "mediaStack.selectorLabels" (dict "ctx" . "app" "seerr") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mediaStack.selectorLabels" (dict "ctx" . "app" "seerr") | nindent 8 }}
    spec:
      securityContext:
        {{- include "mediaStack.podSecurityContext" . | nindent 8 }}
      containers:
        - name: seerr
          image: "{{ .Values.seerr.image.repository }}:{{ .Values.seerr.image.tag }}"
          imagePullPolicy: {{ .Values.seerr.image.pullPolicy }}
          env:
            {{- include "mediaStack.commonEnv" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.seerr.service.ports.web }}
              name: web
              protocol: TCP
          resources:
            {{- toYaml .Values.seerr.resources | nindent 12 }}
          securityContext:
            {{- include "mediaStack.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - mountPath: /app/config
              name: config
              subPath: seerr
      volumes:
        {{- include "mediaStack.volumes" . | nindent 8 }}
      restartPolicy: Always
{{- end }}
