{{- if .Values.qbittorrent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: {{ include "mediaStack.namespace" . }}
  labels:
    {{- include "mediaStack.labels" (dict "ctx" . "app" "qbittorrent") | nindent 4 }}
spec:
  type: {{ .Values.qbittorrent.service.type }}
  # Targets the servarr pod — qbittorrent runs there inside the gluetun network ns.
  selector:
    {{- include "mediaStack.selectorLabels" (dict "ctx" . "app" "servarr") | nindent 4 }}
  ports:
    - name: web
      port: {{ .Values.qbittorrent.service.ports.web }}
      targetPort: {{ .Values.qbittorrent.service.ports.web }}
      protocol: TCP
    - name: bt
      port: {{ .Values.qbittorrent.service.ports.bt }}
      targetPort: {{ .Values.qbittorrent.service.ports.bt }}
      protocol: TCP
{{- end }}
