{{- if .Values.tdarr.enabled }}
{{- $kind := .Values.tdarr.workloadKind | default "StatefulSet" }}
apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: tdarr
  namespace: {{ include "mediaStack.namespace" . }}
  labels:
    {{- include "mediaStack.labels" (dict "ctx" . "app" "tdarr") | nindent 4 }}
spec:
  replicas: 1
  {{- if eq $kind "StatefulSet" }}
  serviceName: tdarr
  updateStrategy:
    type: RollingUpdate
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "mediaStack.selectorLabels" (dict "ctx" . "app" "tdarr") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mediaStack.selectorLabels" (dict "ctx" . "app" "tdarr") | nindent 8 }}
    spec:
      {{- with .Values.tdarr.nodeName }}
      nodeName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "mediaStack.podSecurityContext" . | nindent 8 }}
        {{- if .Values.tdarr.hwAccel.enabled }}
        supplementalGroups:
          {{- toYaml .Values.tdarr.hwAccel.supplementalGroups | nindent 10 }}
        {{- end }}
      containers:
        - name: tdarr
          image: "{{ .Values.tdarr.image.repository }}:{{ .Values.tdarr.image.tag }}"
          imagePullPolicy: {{ .Values.tdarr.image.pullPolicy }}
          env:
            {{- include "mediaStack.commonEnv" . | nindent 12 }}
            - name: UMASK_SET
              value: "002"
            - name: serverIP
              value: "0.0.0.0"
            - name: serverPort
              value: {{ .Values.tdarr.service.ports.server | quote }}
            - name: webUIPort
              value: {{ .Values.tdarr.service.ports.web | quote }}
            - name: internalNode
              value: "true"
            - name: inContainer
              value: "true"
            - name: ffmpegVersion
              value: {{ .Values.tdarr.ffmpegVersion | quote }}
            - name: nodeName
              value: "InternalNode"
          ports:
            - containerPort: {{ .Values.tdarr.service.ports.web }}
              name: web
              protocol: TCP
            - containerPort: {{ .Values.tdarr.service.ports.server }}
              name: server
              protocol: TCP
          resources:
            {{- toYaml .Values.tdarr.resources | nindent 12 }}
          securityContext:
            {{- include "mediaStack.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # Tdarr-internal state (DB, plugins, configs, logs) — kept on the
            # shared config PVC under subPaths so a `helm uninstall` of just
            # tdarr can be undone cleanly.
            - mountPath: /app/server
              name: config
              subPath: tdarr/server
            - mountPath: /app/configs
              name: config
              subPath: tdarr/configs
            - mountPath: /app/logs
              name: config
              subPath: tdarr/logs
            # Library — Tdarr docs use /media as the convention; jellyfin mounts
            # the same PVC at /data. Configure Tdarr's libraries with /media paths.
            - mountPath: /media
              name: data
            # In-progress transcode scratch. emptyDir is per-pod; size limit is
            # advisory (won't block writes but kubelet will evict if exceeded).
            - mountPath: /temp
              name: cache
            {{- include "mediaStack.hwAccelMount" .Values.tdarr.hwAccel | nindent 12 }}
      volumes:
        {{- include "mediaStack.volumes" . | nindent 8 }}
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.tdarr.cache.sizeLimit }}
        {{- include "mediaStack.hwAccelVolume" .Values.tdarr.hwAccel | nindent 8 }}
      restartPolicy: Always
{{- end }}
