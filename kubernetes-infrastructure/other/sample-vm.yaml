# Sample KubeVirt VM — Ubuntu 24.04 backed by a Longhorn PVC (via CDI),
# with SSH access exposed on a Cilium L2 LoadBalancer.
#
# Apply:
#   kubectl apply -f other/sample-vm.yaml
#
# Watch the disk import + boot:
#   kubectl get dv,pvc,vmi ubuntu-sample-root,ubuntu-sample
#   kubectl describe dv ubuntu-sample-root      # import progress %
#
# Connect:
#   kubectl get svc ubuntu-sample-ssh           # grab the EXTERNAL-IP
#   ssh -i ~/.ssh/id_ed25519 ubuntu@<EXTERNAL-IP>
#   kubectl virt console ubuntu-sample          # serial console (Ctrl+] to exit)
#
# Clean up (also deletes the Longhorn PVC because dataVolumeTemplates owns it):
#   kubectl delete -f other/sample-vm.yaml
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ubuntu-sample
  namespace: default
spec:
  runStrategy: Always # restart on crash; switch to Manual for virtctl start/stop control
  dataVolumeTemplates:
    - metadata:
        name: ubuntu-sample-root
      spec:
        source:
          http:
            url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
        storage:
          resources:
            requests:
              storage: 10Gi
          accessModes: [ReadWriteOnce]
          # storageClassName omitted — Longhorn is the cluster default. Override
          # here only if you want a non-default class for this VM.
  template:
    metadata:
      labels:
        kubevirt.io/vm: ubuntu-sample
      annotations:
        kubevirt.io/allow-pod-bridge-network-live-migration: "true"
    spec:
      evictionStrategy: LiveMigrate
      domain:
        cpu:
          cores: 2
        memory:
          guest: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
          rng: {} # paravirt RNG so the guest doesn't stall waiting for entropy
        machine:
          type: q35
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: ubuntu-sample-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            # networkData: |
            #   network:
            #     version: 1
            #     config:
            #       - type: physical
            #         name: eth0
            #         subnets:
            #           - type: dhcp
            userData: |
              #cloud-config
              users:
                - name: ubuntu
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  groups: [users, sudo, adm]
                  shell: /bin/bash
                  ssh_authorized_keys:
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEn9DdzGbGXbjxkvmA4n8HV1JBCNjo81dtE+Kq+tcupZ
              # qemu-guest-agent enables `virtctl ssh` and clean shutdowns.
              # growpart + resize2fs are part of stock cloud-init and will
              # expand the root partition to fill the 20Gi PVC on first boot.
              package_update: true
              packages:
                - qemu-guest-agent
              runcmd:
                - systemctl enable --now qemu-guest-agent
---
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-sample-ssh
  namespace: default
spec:
  type: LoadBalancer # picks up a Cilium L2 pool IP, just like any other Service
  selector:
    kubevirt.io/vm: ubuntu-sample
  ports:
    - port: 22
      targetPort: 22
