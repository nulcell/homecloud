# Ubuntu 26.04 LTS "VPS" — a KubeVirt VM with a Longhorn-backed root disk
# (imported once by CDI) and SSH exposed via a Cilium L2 LoadBalancer.
#
# The `vps` namespace is labelled `privileged` for Pod Security Admission
# because KubeVirt's virt-launcher pod needs elevated capabilities to run
# the QEMU process; this is required even though the guest is unprivileged.
#
# Apply (the first apply triggers a one-time image download — watch progress
# with `kubectl describe dv ubuntu-vps-root`):
#   kubectl apply -f other/vps.yaml
#
# Connect — SSH over the LoadBalancer (everyday entrypoint):
#   VPS_IP=$(kubectl -n vps get svc vps-ssh -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
#   ssh ubuntu@$VPS_IP
#
# Connect — SSH via virtctl (no LoadBalancer needed; uses the API server proxy):
#   kubectl virt -n vps ssh ubuntu@vm/vps
#
# Serial console (Ctrl+] to exit):
#   kubectl virt -n vps console vps
#
# Inspect / lifecycle:
#   kubectl -n vps get vm,vmi,dv,pvc                  # high-level state
#   kubectl -n vps describe vmi vps                   # live VM details
#   kubectl virt -n vps stop vps                           # graceful shutdown
#   kubectl virt -n vps start vps                          # power on (runStrategy=Always restarts on crash anyway)
#   kubectl virt -n vps restart vps                        # power cycle
#
# Disk persistence: the Longhorn PVC behind `ubuntu-vps-root` owns the full
# rootfs and survives reboots, restarts, and node failures. Cleanup below
# deletes it too because dataVolumeTemplates owns it.
#
# Clean up:
#   kubectl delete -f other/vps.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: vps
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vps
  namespace: vps
spec:
  runStrategy: Always # restart on crash; switch to Manual for virtctl start/stop control
  dataVolumeTemplates:
    - metadata:
        name: ubuntu-vps-root
      spec:
        source:
          http:
            url: https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img
        storage:
          resources:
            requests:
              storage: 20Gi
          accessModes: [ReadWriteOncePod]
          # storageClassName omitted — Longhorn is the cluster default. Override
          # here only if you want a non-default class for this VM.
  template:
    metadata:
      labels:
        kubevirt.io/vm: vps
      annotations:
        kubevirt.io/allow-pod-bridge-network-live-migration: "true"
    spec:
      evictionStrategy: LiveMigrate
      domain:
        cpu:
          cores: 4
        memory:
          guest: 8Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              bridge: {}
          rng: {}
        machine:
          type: q35
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: ubuntu-vps-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: vps
              users:
                - name: ubuntu
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  groups: [users, sudo, adm]
                  shell: /bin/bash
                  ssh_authorized_keys:
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEn9DdzGbGXbjxkvmA4n8HV1JBCNjo81dtE+Kq+tcupZ
              # qemu-guest-agent enables `virtctl ssh` and clean shutdowns.
              # growpart + resize2fs are part of stock cloud-init and will
              # expand the root partition to fill the PVC on first boot.
              package_update: true
              package_upgrade: true
              package_reboot_if_required: true
              packages:
                - qemu-guest-agent
              runcmd:
                - systemctl enable --now qemu-guest-agent
---
apiVersion: v1
kind: Service
metadata:
  name: vps-ssh
  namespace: vps
spec:
  type: LoadBalancer
  selector:
    kubevirt.io/vm: vps
  ports:
    - port: 22
      targetPort: 22
