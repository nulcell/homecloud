# ArgoCD app for the restore drill (cluster/docs/backup-restore.md); same sync policy as the apps ApplicationSet.
# Apply by hand; remove with: kubectl delete -f manifests/restore-test-app.yaml (the finalizer deletes the app's resources).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: restore-test
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/nulcell/homecloud
    targetRevision: main
    path: gitops/experimental/restore-test
  destination:
    server: https://kubernetes.default.svc
    namespace: restore-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
