# Ubuntu 26.04 LTS "VPS" - KubeVirt VM
#
# Apply order (templates first):
#   kubectl apply -f manifests/vps.yaml
#
# Connect - SSH over the LoadBalancer (everyday entrypoint):
#   VPS_IP=$(kubectl -n vps get svc vps-ssh -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
#   ssh ubuntu@$VPS_IP
#
# Connect - SSH via virtctl (no LoadBalancer needed; uses the API server proxy):
#   kubectl virt -n vps ssh ubuntu@vm/vps
#
# Serial console (Ctrl+] to exit):
#   kubectl virt -n vps console vps
#
# Inspect / lifecycle:
#   kubectl -n vps get vm,vmi,dv,pvc                  # high-level state
#   kubectl -n vps describe vmi vps                   # live VM details
#   kubectl virt -n vps stop vps                      # graceful shutdown
#   kubectl virt -n vps start vps                     # power on
#   kubectl virt -n vps restart vps                   # power cycle
#
# Adding more VMs: copy this file, change the metadata.name (vm + dataVolume
# + service), tweak the cloud-init userData, and `kubectl apply -f`. Pick a
# different instancetype (u1.small = 1/2, cx1.large = 2/4, cx1.2xlarge =
# 8/16, etc.) if the VPS shape doesn't fit - the `ubuntu` preference works
# with any of them.
#
# Clean up (delete the VM AND its rootfs PVC, since dataVolumeTemplates owns it):
#   kubectl delete -f manifests/vps.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: vps
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vps
  namespace: vps
spec:
  runStrategy: Always # restart on crash; switch to Manual for virtctl start/stop control
  template:
    metadata: {}
    spec:
      evictionStrategy: LiveMigrate
      domain:
        machine:
          type: q35
        cpu:
          cores: 2
          sockets: 1
          threads: 1
          model: host-model
        memory:
          guest: 2Gi
        resources:
          requests:
            memory: 2Gi
            cpu: 2
          limits:
            memory: 2.5Gi
            cpu: 2
        firmware:
          bootloader:
            efi:
              secureBoot: true
        features:
          smm:
            enabled: true
        devices:
          disks:
            - name: boot-volume
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              model: virtio
              masquerade: {}
          tpm:
            persistent: true
          rng: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: boot-volume
          dataVolume:
            name: boot-volume
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: vps
              users:
                - name: ubuntu
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  groups: [users, sudo, adm]
                  shell: /bin/bash
                  ssh_authorized_keys:
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEn9DdzGbGXbjxkvmA4n8HV1JBCNjo81dtE+Kq+tcupZ
              # qemu-guest-agent enables `virtctl ssh` and clean shutdowns.
              # growpart + resize2fs are part of stock cloud-init and will
              # expand the root partition to fill the PVC on first boot.
              package_update: true
              package_upgrade: true
              package_reboot_if_required: true
              packages:
                - qemu-guest-agent
                - fastfetch
              runcmd:
                - systemctl enable --now qemu-guest-agent
  dataVolumeTemplates:
    - metadata:
        name: boot-volume
      spec:
        source:
          # registry:
          #   url: docker://quay.io/containerdisks/ubuntu:24.04
          http:
            url: https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img
        storage:
          resources:
            requests:
              storage: 15Gi
          accessModes: [ReadWriteMany]
          storageClassName: longhorn
