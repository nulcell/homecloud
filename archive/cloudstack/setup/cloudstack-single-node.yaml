#cloud-config
# CloudStack Single-Node Setup using CloudStack CLI Tool
# Requires: Ubuntu 24.04 LTS with cloudbr0 and cloudbr1 bridges pre-configured

# Update and upgrade packages
package_update: true
package_upgrade: true

# prettier-ignore
users:
  - name: cs-admin
    gecos: CloudStack Admin User
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEn9DdzGbGXbjxkvmA4n8HV1JBCNjo81dtE+Kq+tcupZ

# Download and execute CloudStack CLI tool
runcmd:
  # Download CloudStack CLI
  - curl -sL https://raw.githubusercontent.com/nulcell/homecloud/main/cloudstack/setup/cloudstack -o
    /usr/local/bin/cloudstack
  - chmod +x /usr/local/bin/cloudstack

  # Run all-in-one setup
  - /usr/local/bin/cloudstack all-in-one setup --cloudstack-version 4.22 2>&1 | tee /var/log/cloudstack-setup.log

  # Log completion
  - echo "CloudStack setup completed at $(date)" >> /var/log/cloudstack-setup.log
  - echo "Access CloudStack UI at http://$(hostname -I | awk '{print $1}'):8080/client" >> /var/log/cloudstack-setup.log
  - echo "Default credentials: admin/password" >> /var/log/cloudstack-setup.log

# Write setup instructions
write_files:
  - path: /root/cloudstack-next-steps.txt
    content: |
      CloudStack Single-Node Setup - Next Steps
      ==========================================

      The CloudStack CLI tool has completed the initial setup.

      IMPORTANT: Two bridges are required (cloudbr0 and cloudbr1)

      Next Steps:
      -----------

      1. Access CloudStack UI:
         URL: http://<this-server-ip>:8080/client
         Login: admin / password (CHANGE IMMEDIATELY)

      2. Configure CloudStack via UI:
         - Create Zone → Pod → Cluster
         - Add Host (use this server's IP)
         - Add Primary Storage (NFS: <this-server-ip>:/export/primary)
         - Add Secondary Storage (NFS: <this-server-ip>:/export/secondary)

      3. After adding host, run:
         sudo /usr/local/bin/cloudstack worker post-setup

      4. Reboot the server:
         sudo reboot

      5. After reboot, verify:
         sudo /usr/local/bin/cloudstack system status

      Files:
      ------
      - State: /var/lib/cloudstack/setup.state
      - Config: /etc/cloudstack/cli.conf
      - Logs: /var/log/cloudstack/setup.log
      - Setup Log: /var/log/cloudstack-setup.log

      Troubleshooting:
      ----------------
      - View logs: sudo tail -f /var/log/cloudstack/setup.log
      - Check state: sudo cat /var/lib/cloudstack/setup.state
      - Reset: sudo /usr/local/bin/cloudstack system reset

      SSH Key Server:
      ---------------
      Management server SSH key available at:
      http://<this-server-ip>:8000/id_rsa.pub

      For multi-node setup, worker nodes fetch this automatically.
    owner: root:root
    permissions: "0644"

final_message: |
  CloudStack single-node setup initiated.

  Check status with:
    sudo /usr/local/bin/cloudstack system status

  View setup log:
    tail -f /var/log/cloudstack-setup.log

  Read next steps:
    cat /root/cloudstack-next-steps.txt

  Access UI: http://<this-server-ip>:8080/client
  Default login: admin/password
