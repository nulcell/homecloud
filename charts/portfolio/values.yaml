replicaCount: 3

image:
  repository: nullcell/portfolio
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}

updateStrategy: {}
podAnnotations: {}
podLabels: {}

# nginx-unprivileged runs as uid/gid 101 and binds an unprivileged port.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 101

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # cpu: 200m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

service:
  type: ClusterIP
  name: portfolio
  port: 80
  targetPort: 8080

# Gateway API HTTPRoute config.
# The public hostnames (nulcell.com, www.nulcell.com) live in the cloudflared
# tunnel ingress, which rewrites the Host header to this hostname before it
# reaches the gateway. This is the origin hostname, not the published one.
gateway:
  enabled: false
  hostname: portfolio.example.com
  parentRef:
    name: external
    namespace: gateway
    sectionName: https # HTTPS listener on the parent Gateway
    httpSectionName: http # only used when httpRedirect is true
  # Off by default: the cluster's gateway app owns a catch-all HTTP→HTTPS
  # redirect covering every host. Set true only against a Gateway that has no
  # such route — a hostname-scoped redirect still wins over the catch-all.
  httpRedirect: false

commonAnnotations: {}
priorityClassName: ""
hostNetwork: false
dnsPolicy: ClusterFirst

nodeSelector: {}
tolerations: []
affinity: {}

# Spread replicas across nodes when replicaCount > 1
topologySpreadConstraints: []
