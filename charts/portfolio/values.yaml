replicaCount: 3

image:
  repository: nullcell/portfolio
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}

updateStrategy: {}
podAnnotations: {}
podLabels: {}

# nginx-unprivileged runs as uid/gid 101 and binds an unprivileged port.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 101

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # cpu: 200m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

service:
  type: ClusterIP
  name: portfolio
  port: 80
  targetPort: 8080

# Gateway API HTTPRoute config.
# The public hostnames (nulcell.com, www.nulcell.com) live in the cloudflared
# tunnel ingress, which rewrites the Host header to this hostname before it
# reaches the gateway. This is the origin hostname, not the published one.
gateway:
  enabled: false
  hostname: portfolio.example.com
  parentRef:
    name: external
    namespace: gateway
    sectionName: https # HTTPS listener on the parent Gateway
    httpSectionName: http # only used when httpRedirect is true
  # Off by default: the cluster's gateway app owns a catch-all HTTP→HTTPS
  # redirect covering every host. Set true only against a Gateway that has no
  # such route — a hostname-scoped redirect still wins over the catch-all.
  httpRedirect: false

# CiliumNetworkPolicy for the app pods. Cilium's Gateway API forwards traffic
# with the reserved `ingress` identity, which a plain NetworkPolicy cannot
# select — hence CNP rather than networking.k8s.io.
networkPolicy:
  enabled: true
  ingress:
    # Open ingress entirely, ignoring every rule below. Escape hatch for
    # debugging or gradual rollout — leave false for least privilege.
    allowAll: false
    # Let any pod in this namespace reach the app on any port.
    intraNamespace: false
    # Allow traffic forwarded by the Gateway to the web port.
    gateway: true
    # cilium only: wrap the web-port rules in an allow-all HTTP rule. Routes
    # those flows through the per-node Envoy for Hubble HTTP metrics and
    # future path/method restrictions, at the cost of a second proxy hop.
    l7Http: false
    # Allow cloudflared to reach the pod directly (tunnel origin pointing at
    # a Service instead of the gateway).
    cloudflared:
      enabled: false
      namespace: cloudflared
    # In-cluster consumers allowed to hit the web port via the Service
    # (dashboards, uptime monitors, ...), by namespace name.
    allowedNamespaces: []
    # Extra ingress rules appended verbatim (CiliumNetworkPolicy schema).
    extraRules: []
  egress:
    # Static site: the pod initiates nothing, so every egress rule below is
    # off — not even DNS. Replies to inbound requests are covered by
    # connection tracking. Escape hatch for debugging; leave false.
    allowAll: false
    # Allow DNS to CoreDNS. Under cilium this goes through the DNS proxy,
    # which is what makes `fqdns` below enforceable.
    dns: false
    # Let the app reach any pod in this namespace.
    intraNamespace: false
    # cilium only: hostnames the app may reach on 443, enforced via toFQDNs.
    fqdns: []
    # Explicit allowance to the database pods. Independent of allowAll, so
    # tightening egress later can't cut the app off from its database.
    database:
      enabled: false
      # Label selector for the database pods; empty selects the whole namespace.
      podSelector: {}
      # Port; unset when database.enabled is false.
      port: ""
    # Extra egress rules appended verbatim (CiliumNetworkPolicy schema).
    extraRules: []

commonAnnotations: {}
priorityClassName: ""
hostNetwork: false
dnsPolicy: ClusterFirst

nodeSelector: {}
tolerations: []
affinity: {}

# Spread replicas across nodes when replicaCount > 1
topologySpreadConstraints: []
