apiVersion: v1
kind: Service
metadata:
  name: {{ include "homepage.fullname" . }}
  namespace: {{ include "homepage.namespace" . }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "homepage.selectorLabels" . | nindent 4 }}
