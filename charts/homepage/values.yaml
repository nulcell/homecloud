# =============================================================================
# Chart-level
# =============================================================================
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

# =============================================================================
# Image
# =============================================================================
image:
  repository: ghcr.io/gethomepage/homepage
  tag: ""
  pullPolicy: IfNotPresent

# =============================================================================
# Replicas
# When replicaCount > 1, enable sticky sessions on your ingress/route to avoid
# unnecessary re-renders (sessions land on different pod instances).
# =============================================================================
replicaCount: 1

# =============================================================================
# Security context
# Homepage runs as a non-root user (1000:1000) by default.
# =============================================================================
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# =============================================================================
# RBAC
# Grants Homepage read access to cluster resources for service discovery.
# =============================================================================
rbac:
  create: true

# =============================================================================
# Service
# =============================================================================
service:
  type: ClusterIP
  port: 3000

# =============================================================================
# Ingress (standard Kubernetes Ingress)
# =============================================================================
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: homepage.example.com
  tls: []

# =============================================================================
# Gateway API HTTPRoute
# =============================================================================
gateway:
  enabled: false
  parentRef:
    name: default
    namespace: gateway
    sectionName: https
    httpSectionName: http
  httpRedirect: true
  host: homepage.example.com

# =============================================================================
# Persistence — config PVC for Homepage configuration files.
# When enabled, the ConfigMap below is NOT mounted and you manage config via
# the PVC instead. When disabled, the ConfigMap is used.
# =============================================================================
persistence:
  enabled: false
  storageClassName: longhorn
  accessMode: ReadWriteMany
  size: 1Gi
  annotations: {}

# =============================================================================
# Homepage configuration (mounted as ConfigMap when persistence.enabled=false)
# These are the raw YAML strings passed verbatim into each config file.
# =============================================================================
config:
  kubernetes: |
    mode: cluster
  settings: |
    title: My Home
    background:
      image: https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
      blur: sm
      saturate: 50
      brightness: 50
      opacity: 50
    cardBlur: md
    theme: dark
    headerStyle: boxed
    hideVersion: true
  bookmarks: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
  services: |
    - My First Group:
        - My First Service:
            href: http://localhost/
            description: Homepage is awesome
    - My Second Group:
        - My Second Service:
            href: http://localhost/
            description: Homepage is awesome
  widgets: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
    - search:
        provider: duckduckgo
        target: _blank
  docker: |
    {}
  custom.css: ""
  custom.js: ""

# =============================================================================
# Resource requests/limits
# =============================================================================
resources: {}
#  requests:
#    cpu: 50m
#    memory: 128Mi
#  limits:
#    cpu: 200m
#    memory: 256Mi

# =============================================================================
# Node scheduling
# =============================================================================
nodeSelector: {}
tolerations: []
affinity: {}
