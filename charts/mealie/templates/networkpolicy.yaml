{{- if .Values.networkPolicy.enabled -}}
{{- $np := .Values.networkPolicy }}
{{- $webPort := .Values.service.port }}
{{- $database := and $np.egress.database.enabled (eq .Values.database.type "postgres") }}
{{- $dbPort := $np.egress.database.port | default .Values.database.postgres.port }}
{{- $hasIngress := or $np.ingress.intraNamespace $np.ingress.gateway $np.ingress.cloudflared.enabled $np.ingress.allowedNamespaces $np.ingress.extraRules }}
{{- $hasEgress := or $np.egress.allowAll $np.egress.dns $np.egress.intraNamespace $database $np.egress.fqdns $np.egress.extraRules }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "mealie.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mealie.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "mealie.selectorLabels" . | nindent 6 }}
  # Both directions carry rules, so both are in default-deny and the rules
  # below are the only openings. Kubelet probes come from the host identity,
  # which Cilium always allows, so they are unaffected.
  enableDefaultDeny:
    ingress: true
    egress: true
  {{- if $np.ingress.allowAll }}
  ingress:
    # Open ingress: any peer, any port.
    - fromEntities:
        - all
  {{- else if $hasIngress }}
  ingress:
    {{- if $np.ingress.intraNamespace }}
    # Anything in the namespace may reach the app on any port.
    - fromEndpoints:
        - {}
    {{- end }}
    {{- if $np.ingress.gateway }}
    # Cilium's Gateway API forwards traffic with the reserved `ingress` identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: {{ $webPort | quote }}
              protocol: TCP
          {{- if $np.ingress.l7Http }}
          rules:
            http:
              - {}
          {{- end }}
    {{- end }}
    {{- if $np.ingress.cloudflared.enabled }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $np.ingress.cloudflared.namespace }}
      toPorts:
        - ports:
            - port: {{ $webPort | quote }}
              protocol: TCP
          {{- if $np.ingress.l7Http }}
          rules:
            http:
              - {}
          {{- end }}
    {{- end }}
    {{- range $ns := $np.ingress.allowedNamespaces }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns }}
      toPorts:
        - ports:
            - port: {{ $webPort | quote }}
              protocol: TCP
          {{- if $np.ingress.l7Http }}
          rules:
            http:
              - {}
          {{- end }}
    {{- end }}
    {{- with $np.ingress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  ingress:
    # No ingress allowances configured. An allow-list that matches nothing is
    # what puts the endpoint into ingress default-deny - an absent section
    # would leave the direction unenforced (enableDefaultDeny does not enforce
    # a direction that has no rules). Cilium still trusts the host identity,
    # so kubelet probes keep working.
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: DoesNotExist
  {{- end }}
  {{- if $hasEgress }}
  egress:
    {{- if $np.egress.allowAll }}
    # Open egress: any destination, any port.
    - toEntities:
        - all
    {{- else }}
    {{- if $np.egress.dns }}
    # DNS to CoreDNS, through Cilium's DNS proxy so fqdns rules work and
    # Hubble records queries.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    {{- end }}
    {{- if $np.egress.intraNamespace }}
    # Reach the other pods in the namespace.
    - toEndpoints:
        - {}
    {{- end }}
    {{- with $np.egress.fqdns }}
    # Enumerated external hosts, resolved via the DNS proxy above.
    - toFQDNs:
        {{- range $fqdn := . }}
        - matchName: {{ $fqdn }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
    {{- end }}
    {{- if $database }}
    # Explicit allowance to the database pods, so tightening egress can
    # never cut the app off from its database.
    - toEndpoints:
        {{- if $np.egress.database.podSelector }}
        - matchLabels:
            {{- toYaml $np.egress.database.podSelector | nindent 12 }}
        {{- else }}
        - {}
        {{- end }}
      {{- if $dbPort }}
      toPorts:
        - ports:
            - port: {{ $dbPort | quote }}
              protocol: TCP
      {{- end }}
    {{- end }}
    {{- with $np.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  egress:
    # No egress allowances configured. An allow-list that matches nothing is
    # what puts the endpoint into egress default-deny - an absent section
    # would leave the direction unenforced (enableDefaultDeny does not enforce
    # a direction that has no rules). Replies to inbound connections are
    # conntrack-tracked and unaffected.
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: DoesNotExist
  {{- end }}
{{- end }}
