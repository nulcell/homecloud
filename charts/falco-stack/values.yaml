# Falco runtime security on the Falco Operator. Required CRDs live in
# gitops/infrastructure/falco-operator/.

nameOverride: ""
namespaceOverride: ""

# Syscall Falco — operator renders this as a DaemonSet (modern_ebpf driver).
falco:
  enabled: true
  type: DaemonSet
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  extraContainerPorts: []

# Plugins loaded into the Falco DaemonSet. Each block ships its Plugin CR plus
# any sidecar workload it needs (e.g. k8smeta owns the metacollector). Flip the
# plugin off and its resources go with it.
plugins:
  # Enriches events with container.id / container.image.* fields. Required by
  # the upstream falco-rules.
  container:
    enabled: true
    plugin:
      ociArtifact:
        repository: falcosecurity/plugins/plugin/container
        tag: latest
        registry: ghcr.io

  # Adds k8s.* fields via gRPC to the metacollector (deployed below).
  k8smeta:
    enabled: true
    plugin:
      ociArtifact:
        repository: falcosecurity/plugins/plugin/k8smeta
        tag: latest
        registry: ghcr.io
      collectorHostname: metacollector
      collectorPort: 45000
    metacollector:
      enabled: true
      replicas: 1
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits:   { cpu: 500m, memory: 512Mi }

  # k8saudit — Plugin + Rulesfile only. The plugin loads into the Falco
  # DaemonSet but stays idle until `openParams` is set. Source wiring is out of
  # scope for this chart; pick one of:
  #
  #   "http://:9765/k8s-audit"   webhook receiver (Talos audit-webhook or a
  #                              Fluent Bit forwarder POSTs events here)
  #   "/var/log/audit/kube/*"    file (requires hostPath mount on the Falco
  #                              DaemonSet pointing at the Talos audit dir)
  k8saudit:
    enabled: false
    plugin:
      ociArtifact:
        repository: falcosecurity/plugins/plugin/k8saudit
        tag: latest
        registry: ghcr.io
      openParams: ""
    rules:
      enabled: true
      ociArtifact:
        repository: falcosecurity/rules/k8saudit-rules
        tag: latest
        registry: ghcr.io
      priority: 50

# Stock upstream falco-rules — syscall ruleset enriched by the plugins above.
rules:
  falco:
    enabled: true
    ociArtifact:
      repository: falcosecurity/rules/falco-rules
      tag: latest
      registry: ghcr.io
    priority: 50

# Falco output config (Config CR). Defaults forward events to the in-chart
# falcosidekick over HTTP.
outputs:
  stdout:
    enabled: true
  json: true
  http:
    enabled: true
    url: "" # defaults to falcosidekick.<ns>.svc:2801 when empty
  metrics:
    enabled: true
    interval: 1h
  webserver:
    enabled: true
    listenPort: 8765
    sslEnabled: false

# Falcosidekick — fan-out daemon. Receives events from Falco and forwards to
# every enabled output (UI, Talon, Prometheus, Slack, …).
falcosidekick:
  enabled: true
  replicas: 1
  # Each output is opted in by setting the right env var. WEBUI_URL +
  # WEBHOOK_ADDRESS are auto-wired when the UI / Talon are enabled.
  # https://github.com/falcosecurity/falcosidekick#outputs
  env:
    - name: PROMETHEUS_EXTRALABELS
      value: "cluster:homecloud"
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }

# Falcosidekick UI — web dashboard. Persists history in the Redis below.
falcosidekickUi:
  enabled: true
  replicas: 1
  redisAddr: "" # defaults to the in-chart Redis Service
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }
  # Empty hostname => no HTTPRoute (UI stays internal).
  gateway:
    hostname: falco.nulcell.com
    httpRedirect: true
    parentRef:
      name: default
      namespace: gateway
      sectionName: https
      httpSectionName: http

# Redis backing the UI. Point `falcosidekickUi.redisAddr` at an external Redis
# to use one instead.
redis:
  enabled: true
  serviceName: falcosidekick-ui-redis
  image:
    repository: docker.io/redis/redis-stack
    tag: 7.2.0-v11
  storage:
    className: longhorn
    size: 1Gi
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }

# Falco-Talon — response engine downstream of Falcosidekick. Vendored as the
# upstream Helm subchart; everything under `falco-talon:` flows to it. Full
# value tree: https://github.com/falcosecurity/charts/tree/master/charts/falco-talon
falco-talon:
  enabled: true
  fullnameOverride: falco-talon
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  service:
    port: 2803
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }
  config:
    listenAddress: 0.0.0.0
    listenPort: 2803
    defaultNotifiers: [k8sevents]
    watchRules: true
    deduplication:
      leaderElection: false
      timeWindowSeconds: 5
    printAllEvents: false

# HTTPRoute on top of the falco-talon subchart Service. Empty hostname => no
# HTTPRoute (talon stays internal). Service name matches `fullnameOverride`
# in the subchart values above.
falcoTalon:
  service:
    name: falco-talon
    port: 2803
  gateway:
    hostname: talon.nulcell.com
    httpRedirect: true
    parentRef:
      name: default
      namespace: gateway
      sectionName: https
      httpSectionName: http

# ServiceMonitors for kube-prometheus-stack. Default off until the live Service
# shapes are confirmed:
#
#   kubectl -n falco get svc -o yaml
#   kubectl -n falco get pod --show-labels
#
# Then set the ports + selectors below and flip enabled: true.
monitoring:
  serviceMonitors:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    falco:
      port: metrics
      selector:
        app.kubernetes.io/name: falco
    falcosidekick:
      port: http
      selector:
        app.kubernetes.io/name: falcosidekick
    metacollector:
      port: metrics
      selector:
        app.kubernetes.io/name: metacollector
    # falco-talon exports over OpenTelemetry, not /metrics — no ServiceMonitor.
