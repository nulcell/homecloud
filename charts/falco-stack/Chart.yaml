apiVersion: v2
name: falco-stack
description: |
  Runtime threat detection layered on the Falco Operator. Deploys a Falco
  DaemonSet (modern_ebpf, syscall source) with the container + k8smeta
  plugins, the upstream falco-rules, k8s-metacollector, the Falcosidekick
  fan-out + UI with a longhorn-backed Redis, and the Falco-Talon response
  engine. Requires the operator from gitops/infrastructure/falco-operator/.
type: application
version: "0.1.0"
appVersion: "0.2.2"
sources:
  - https://github.com/nulcell/homecloud
  - https://github.com/falcosecurity/falco-operator
keywords:
  - falco
  - falcosidekick
  - falco-talon
  - runtime-security
  - threat-detection
home: https://nulcell.com
maintainers:
  - name: Salimon Ayanleye
    email: cloud@nulcell.com

# falco-talon is fetched at render time by the ArgoCD CMP (see
# `cluster/bootstrap/argocd-values.yaml`).
dependencies:
  - name: falco-talon
    version: 0.4.0
    repository: https://falcosecurity.github.io/charts
    condition: falco-talon.enabled
