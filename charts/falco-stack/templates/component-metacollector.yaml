{{- if and .Values.plugins.k8smeta.enabled .Values.plugins.k8smeta.metacollector.enabled }}
apiVersion: instance.falcosecurity.dev/v1alpha1
kind: Component
metadata:
  name: metacollector
  namespace: {{ include "falcoStack.namespace" . }}
  labels:
    {{- include "falcoStack.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  component:
    type: metacollector
  replicas: {{ .Values.plugins.k8smeta.metacollector.replicas }}
  podTemplateSpec:
    spec:
      containers:
        - name: k8s-metacollector
          resources:
            {{- toYaml .Values.plugins.k8smeta.metacollector.resources | nindent 12 }}
{{- end }}
