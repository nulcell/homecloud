{{- if .Values.monitoring.serviceMonitors.enabled }}
# IMPORTANT: the selector + port name below are *unverified* against the live
# Services the Falco Operator creates. After the rest of the stack is up, run
# the commands in the values.yaml comment block and adjust to match. Then
# `monitoring.serviceMonitors.enabled: true` in your overlay.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: falco
  namespace: {{ include "falcoStack.namespace" . }}
  labels:
    {{- include "falcoStack.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.monitoring.serviceMonitors.falco.selector | nindent 6 }}
  endpoints:
    - port: {{ .Values.monitoring.serviceMonitors.falco.port }}
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitors.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitors.scrapeTimeout }}
{{- if .Values.falcosidekick.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: falcosidekick
  namespace: {{ include "falcoStack.namespace" . }}
  labels:
    {{- include "falcoStack.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.monitoring.serviceMonitors.falcosidekick.selector | nindent 6 }}
  endpoints:
    - port: {{ .Values.monitoring.serviceMonitors.falcosidekick.port }}
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitors.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitors.scrapeTimeout }}
{{- end }}
{{- if and .Values.plugins.k8smeta.enabled .Values.plugins.k8smeta.metacollector.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: metacollector
  namespace: {{ include "falcoStack.namespace" . }}
  labels:
    {{- include "falcoStack.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.monitoring.serviceMonitors.metacollector.selector | nindent 6 }}
  endpoints:
    - port: {{ .Values.monitoring.serviceMonitors.metacollector.port }}
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitors.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitors.scrapeTimeout }}
{{- end }}
# Note: no ServiceMonitor for falco-talon — Talon exports metrics over
# OpenTelemetry, not a Prometheus /metrics endpoint. See the falco-talon
# subchart's config.otel block to wire an otel-collector if you want metrics
# in Prometheus.
{{- end }}
