{{- if .Values.plugins.k8smeta.enabled }}
# k8smeta plugin — adds k8s.* fields via gRPC to the metacollector below.
# Disable the parent `plugins.k8smeta` entry to drop both the plugin and the
# metacollector.
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Plugin
metadata:
  name: k8smeta
  namespace: {{ include "falcoStack.namespace" . }}
  labels:
    {{- include "falcoStack.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  ociArtifact:
    image:
      repository: {{ .Values.plugins.k8smeta.plugin.ociArtifact.repository }}
      tag: {{ .Values.plugins.k8smeta.plugin.ociArtifact.tag }}
    registry:
      name: {{ .Values.plugins.k8smeta.plugin.ociArtifact.registry }}
  config:
    initConfig:
      collectorPort: {{ .Values.plugins.k8smeta.plugin.collectorPort }}
      collectorHostname: {{ .Values.plugins.k8smeta.plugin.collectorHostname }}.{{ include "falcoStack.namespace" . }}.svc
      nodeName: "${FALCO_K8S_NODE_NAME}"
{{- end }}
