{{- $talon := index .Values "falco-talon" -}}
{{- if and $talon $talon.enabled .Values.falcoTalon.gateway.hostname }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.falcoTalon.service.name }}
  namespace: {{ include "falcoStack.namespace" . }}
  labels:
    {{- include "falcoStack.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.falcoTalon.gateway.parentRef.name }}
      namespace: {{ .Values.falcoTalon.gateway.parentRef.namespace }}
      sectionName: {{ .Values.falcoTalon.gateway.parentRef.sectionName }}
  hostnames:
    - {{ .Values.falcoTalon.gateway.hostname }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.falcoTalon.service.name }}
          port: {{ .Values.falcoTalon.service.port }}
          weight: 1
{{- if .Values.falcoTalon.gateway.httpRedirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.falcoTalon.service.name }}-http-redirect
  namespace: {{ include "falcoStack.namespace" . }}
  labels:
    {{- include "falcoStack.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.falcoTalon.gateway.parentRef.name }}
      namespace: {{ .Values.falcoTalon.gateway.parentRef.namespace }}
      sectionName: {{ .Values.falcoTalon.gateway.parentRef.httpSectionName }}
  hostnames:
    - {{ .Values.falcoTalon.gateway.hostname }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
