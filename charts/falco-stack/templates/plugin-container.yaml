{{- if .Values.plugins.container.enabled }}
# container plugin — enriches events with container.id / container.image.*
# fields. Required by the official falco-rules. The artifact-operator pulls
# the OCI image into the Falco Pod at startup.
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Plugin
metadata:
  name: container
  namespace: {{ include "falcoStack.namespace" . }}
  labels:
    {{- include "falcoStack.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  ociArtifact:
    image:
      repository: {{ .Values.plugins.container.plugin.ociArtifact.repository }}
      tag: {{ .Values.plugins.container.plugin.ociArtifact.tag }}
    registry:
      name: {{ .Values.plugins.container.plugin.ociArtifact.registry }}
{{- end }}
