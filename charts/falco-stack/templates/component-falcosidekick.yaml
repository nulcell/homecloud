{{- if .Values.falcosidekick.enabled }}
{{- $ns := include "falcoStack.namespace" . -}}
{{- $env := .Values.falcosidekick.env | default list -}}
{{- /* Auto-wire WEBUI_URL when the in-chart UI is on and not user-supplied. */ -}}
{{- if .Values.falcosidekickUi.enabled -}}
  {{- $hasWebui := false -}}
  {{- range $env }}{{- if eq .name "WEBUI_URL" }}{{- $hasWebui = true }}{{- end }}{{- end -}}
  {{- if not $hasWebui -}}
    {{- $env = append $env (dict "name" "WEBUI_URL" "value" (printf "http://falcosidekick-ui.%s.svc:2802" $ns)) -}}
  {{- end -}}
{{- end -}}
{{- /* Auto-wire WEBHOOK_ADDRESS to the falco-talon subchart Service when on. */ -}}
{{- $talon := index .Values "falco-talon" -}}
{{- if and $talon $talon.enabled -}}
  {{- $hasTalon := false -}}
  {{- range $env }}{{- if eq .name "WEBHOOK_ADDRESS" }}{{- $hasTalon = true }}{{- end }}{{- end -}}
  {{- if not $hasTalon -}}
    {{- $talonPort := 2803 -}}
    {{- if $talon.service -}}{{- if $talon.service.port -}}{{- $talonPort = int $talon.service.port -}}{{- end -}}{{- end -}}
    {{- $env = append $env (dict "name" "WEBHOOK_ADDRESS" "value" (printf "http://falco-talon.%s.svc:%d/events" $ns $talonPort)) -}}
  {{- end -}}
{{- end }}
apiVersion: instance.falcosecurity.dev/v1alpha1
kind: Component
metadata:
  name: falcosidekick
  namespace: {{ $ns }}
  labels:
    {{- include "falcoStack.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  component:
    type: falcosidekick
  replicas: {{ .Values.falcosidekick.replicas }}
  podTemplateSpec:
    spec:
      containers:
        - name: falcosidekick
          {{- with $env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.falcosidekick.resources | nindent 12 }}
{{- end }}
