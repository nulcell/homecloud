apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: {{ include "n8n.namespace" . }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.n8n.replicaCount }}
  selector:
    matchLabels:
      {{- include "n8n.selectorLabels" . | nindent 6 }}
  {{- if .Values.n8n.updateStrategy }}
  strategy:
    {{- toYaml .Values.n8n.updateStrategy | nindent 4 }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.n8n.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "n8n.selectorLabels" . | nindent 8 }}
        {{- with .Values.n8n.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: {{ .Values.hostNetwork }}
      {{- end }}
      {{- if .Values.dnsPolicy }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- end }}
      enableServiceLinks: false
      serviceAccountName: {{ include "n8n.serviceAccountName" . }}
      containers:
        - name: n8n
          image: "{{ .Values.n8n.image.repository }}:{{ .Values.n8n.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.n8n.image.pullPolicy }}
          env:
            - name: DB_TYPE
              {{- if .Values.scaling.enabled }}
              value: postgresdb
              {{- else }}
              value: sqlite
              {{- end }}
            {{- if .Values.scaling.enabled }}
            - name: DB_POSTGRESDB_HOST
              value: {{ .Values.scaling.database.host | quote }}
            - name: DB_POSTGRESDB_PORT
              value: {{ .Values.scaling.database.port | quote }}
            - name: DB_POSTGRESDB_DATABASE
              value: {{ .Values.scaling.database.name | quote }}
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.scaling.database.existingSecret }}
                  key: {{ .Values.scaling.database.secretUsernameKey }}
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.scaling.database.existingSecret }}
                  key: {{ .Values.scaling.database.secretPasswordKey }}
            - name: EXECUTIONS_MODE
              value: queue
            - name: QUEUE_BULL_REDIS_HOST
              value: {{ .Values.scaling.redis.host | quote }}
            - name: QUEUE_BULL_REDIS_PORT
              value: {{ .Values.scaling.redis.port | quote }}
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.scaling.encryptionKey.existingSecret }}
                  key: {{ .Values.scaling.encryptionKey.secretKey }}
            - name: OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS
              value: "true"
            {{- end }}
            - name: GENERIC_TIMEZONE
              value: {{ .Values.n8n.timezone | quote }}
            - name: TZ
              value: {{ .Values.n8n.timezone | quote }}
            - name: NODE_ENV
              value: production
            {{- if and (not .Values.scaling.enabled) .Values.persistence.enabled }}
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            {{- end }}
            - name: N8N_HOST
              value: {{ .Values.gateway.hostname | quote }}
            - name: N8N_PORT
              value: {{ .Values.service.webPort | quote }}
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: N8N_LOG_LEVEL
              value: {{ .Values.n8n.logLevel | default "info" | quote }}
            - name: WEBHOOK_URL
              value: https://{{ .Values.gateway.hostname }}/
            - name: N8N_NATIVE_PYTHON_RUNNER
              value: "true"
            - name: N8N_RUNNERS_MODE
              value: external
            - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
              value: 0.0.0.0
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.taskRunner.authToken.secretName }}
                  key: {{ .Values.taskRunner.authToken.secretKey }}
            - name: N8N_RUNNERS_EXTERNAL_ALLOW
              value: '*'
            - name: N8N_RUNNERS_STDLIB_ALLOW
              value: '*'
            - name: NODE_FUNCTION_ALLOW_BUILTIN
              value: '*'
            - name: NODE_FUNCTION_ALLOW_EXTERNAL
              value: '*'
          ports:
            - containerPort: 5678
              name: web-port
              protocol: TCP
            - containerPort: 5679
              name: broker-port
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.n8n.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.n8n.containerSecurityContext | nindent 12 }}
          {{- if and (not .Values.scaling.enabled) .Values.persistence.enabled }}
          volumeMounts:
            - mountPath: /home/node/.n8n
              name: n8n-data
            - mountPath: /files
              name: n8n-files
          {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.n8n.podSecurityContext | nindent 8 }}
      {{- if and (not .Values.scaling.enabled) .Values.persistence.enabled }}
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
        - name: n8n-files
          persistentVolumeClaim:
            claimName: n8n-files
      {{- end }}
