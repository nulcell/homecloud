apiVersion: v2
name: media-stack
description: |
  Self-hosted media platform: Jellyfin, Jellyseerr, Sonarr, Radarr, Bazarr,
  Prowlarr, qBittorrent (the last two behind a Gluetun VPN sidecar).
  Per-app enable flags, Gateway API HTTPRoutes, RWX storage, no Ingress.
