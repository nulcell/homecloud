{{- if .Values.jellyfin.enabled }}
{{- $kind := .Values.jellyfin.workloadKind | default "Deployment" }}
apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: jellyfin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mediaStack.labels" (dict "ctx" . "app" "jellyfin") | nindent 4 }}
spec:
  replicas: {{ .Values.jellyfin.replicas }}
  {{- if eq $kind "StatefulSet" }}
  serviceName: jellyfin
  updateStrategy:
    type: RollingUpdate
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "mediaStack.selectorLabels" (dict "ctx" . "app" "jellyfin") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mediaStack.selectorLabels" (dict "ctx" . "app" "jellyfin") | nindent 8 }}
    spec:
      {{- with .Values.jellyfin.nodeName }}
      nodeName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "mediaStack.podSecurityContext" . | nindent 8 }}
        {{- if and .Values.jellyfin.hwAccel.enabled .Values.jellyfin.hwAccel.supplementalGroups }}
        supplementalGroups:
          {{- toYaml .Values.jellyfin.hwAccel.supplementalGroups | nindent 10 }}
        {{- end }}
      containers:
        - name: jellyfin
          image: "{{ .Values.jellyfin.image.repository }}:{{ .Values.jellyfin.image.tag }}"
          imagePullPolicy: {{ .Values.jellyfin.image.pullPolicy }}
          env:
            {{- include "mediaStack.commonEnv" . | nindent 12 }}
            {{- if .Values.jellyfin.publishedServerUrl }}
            - name: JELLYFIN_PublishedServerUrl
              value: {{ .Values.jellyfin.publishedServerUrl | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.jellyfin.service.ports.web }}
              name: web
              protocol: TCP
            - containerPort: {{ .Values.jellyfin.service.ports.discovery }}
              name: discovery
              protocol: UDP
            - containerPort: {{ .Values.jellyfin.service.ports.dlna }}
              name: dlna
              protocol: UDP
          # /health blocks on the config volume, so it cannot gate liveness -
          # a slow-but-healthy Jellyfin was being SIGKILLed mid-stream.
          # Readiness keeps the HTTP check but with a ~6 min grace window, so a
          # transient stall no longer pulls the pod from the Service and drops
          # every active stream.
          startupProbe:
            tcpSocket:
              port: web
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: web
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: web
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 12
          resources:
            {{- toYaml .Values.jellyfin.resources | nindent 12 }}
          securityContext:
            {{- if .Values.jellyfin.hwAccel.privileged }}
            privileged: true
            {{- else }}
            {{- include "mediaStack.containerSecurityContext" . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - mountPath: /config
              name: config
              subPath: jellyfin
            - mountPath: /data
              name: data
            {{- if .Values.jellyfin.scratch.enabled }}
            - mountPath: /config/data/transcodes
              name: scratch
              subPath: transcodes
            - mountPath: /config/cache
              name: scratch
              subPath: cache
            {{- end }}
            {{- include "mediaStack.hwAccelMount" .Values.jellyfin.hwAccel | nindent 12 }}
      volumes:
        {{- include "mediaStack.volumes" . | nindent 8 }}
        {{- include "mediaStack.hwAccelVolume" .Values.jellyfin.hwAccel | nindent 8 }}
        {{- if .Values.jellyfin.scratch.enabled }}
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.jellyfin.scratch.sizeLimit }}
        {{- end }}
      restartPolicy: Always
{{- end }}
