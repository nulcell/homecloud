{{- if .Values.gateway.enabled -}}
{{- $ctx := . }}
{{- $g := .Values.gateway }}
{{/*
One HTTPRoute per app that sets a gateway.hostname; apps without one stay
internal-only. The backend Service is named after the app in every case.
*/}}
{{- $routes := list }}
{{- range $name := list "jellyfin" "seerr" "sonarr" "radarr" "bazarr" "prowlarr" "qbittorrent" }}
{{- $app := index $ctx.Values $name }}
{{- if and $app.enabled $app.gateway.hostname }}
{{- $routes = append $routes (dict "name" $name "hostname" $app.gateway.hostname "port" $app.service.ports.web) }}
{{- end }}
{{- end }}
{{- range $r := $routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $r.name }}
  namespace: {{ $ctx.Release.Namespace }}
  labels:
    {{- include "mediaStack.labels" (dict "ctx" $ctx "app" $r.name) | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $g.parentRef.name }}
      namespace: {{ $g.parentRef.namespace }}
      sectionName: {{ $g.parentRef.sectionName | default "https" }}
  hostnames:
    - {{ $r.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $r.name }}
          port: {{ $r.port }}
          weight: 1
{{- if $g.httpRedirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $r.name }}-http-redirect
  namespace: {{ $ctx.Release.Namespace }}
  labels:
    {{- include "mediaStack.labels" (dict "ctx" $ctx "app" $r.name) | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $g.parentRef.name }}
      namespace: {{ $g.parentRef.namespace }}
      sectionName: {{ $g.parentRef.httpSectionName | default "http" }}
  hostnames:
    - {{ $r.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
{{- end }}
