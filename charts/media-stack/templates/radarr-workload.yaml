{{- if .Values.radarr.enabled }}
{{- $kind := .Values.radarr.workloadKind | default "Deployment" }}
apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: radarr
  namespace: {{ include "mediaStack.namespace" . }}
  labels:
    {{- include "mediaStack.labels" (dict "ctx" . "app" "radarr") | nindent 4 }}
spec:
  replicas: {{ .Values.radarr.replicas }}
  {{- if eq $kind "StatefulSet" }}
  serviceName: radarr
  updateStrategy:
    type: RollingUpdate
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "mediaStack.selectorLabels" (dict "ctx" . "app" "radarr") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mediaStack.selectorLabels" (dict "ctx" . "app" "radarr") | nindent 8 }}
    spec:
      securityContext:
        {{- include "mediaStack.podSecurityContext" . | nindent 8 }}
      containers:
        - name: radarr
          image: "{{ .Values.radarr.image.repository }}:{{ .Values.radarr.image.tag }}"
          imagePullPolicy: {{ .Values.radarr.image.pullPolicy }}
          env:
            {{- include "mediaStack.commonEnv" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.radarr.service.ports.web }}
              name: web
              protocol: TCP
          # Liveness is a plain TCP check: /ping hits the sqlite DB, which can
          # stall past any sane timeout during heavy I/O on Longhorn RWX and
          # turn a slow-but-healthy app into a restart storm. Readiness keeps
          # the HTTP check so a stalled app is pulled from the Service instead.
          livenessProbe:
            tcpSocket:
              port: web
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: web
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.radarr.resources | nindent 12 }}
          securityContext:
            {{- include "mediaStack.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - mountPath: /config
              name: config
              subPath: radarr
            - mountPath: /data
              name: data
      volumes:
        {{- include "mediaStack.volumes" . | nindent 8 }}
      restartPolicy: Always
{{- end }}
