{{- if and .Values.seerr.enabled .Values.gateway.enabled .Values.seerr.gateway.hostname }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mediaStack.labels" (dict "ctx" . "app" "seerr") | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.parentRef.name }}
      namespace: {{ .Values.gateway.parentRef.namespace }}
      sectionName: {{ .Values.gateway.parentRef.sectionName | default "https" }}
  hostnames:
    - {{ .Values.seerr.gateway.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: seerr
          port: {{ .Values.seerr.service.ports.web }}
          weight: 1
{{- if .Values.gateway.httpRedirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr-http-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mediaStack.labels" (dict "ctx" . "app" "seerr") | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.parentRef.name }}
      namespace: {{ .Values.gateway.parentRef.namespace }}
      sectionName: {{ .Values.gateway.parentRef.httpSectionName | default "http" }}
  hostnames:
    - {{ .Values.seerr.gateway.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
