{{- if .Values.networkPolicy.enabled -}}
{{- $ctx := . }}
{{- $global := .Values.networkPolicy }}
{{/*
One policy per app. Prowlarr and qBittorrent share the servarr pod (and its
gluetun network namespace), so they are covered by the single servarr policy.
Each app's `networkPolicy` block is a partial override deep-merged onto the
chart-level one, so both use the same schema.
*/}}
{{- $apps := list }}
{{- if .Values.jellyfin.enabled }}
{{- $apps = append $apps (dict "name" "jellyfin" "values" .Values.jellyfin "webPorts" (list .Values.jellyfin.service.ports.web)) }}
{{- end }}
{{- if .Values.seerr.enabled }}
{{- $apps = append $apps (dict "name" "seerr" "values" .Values.seerr "webPorts" (list .Values.seerr.service.ports.web)) }}
{{- end }}
{{- if .Values.sonarr.enabled }}
{{- $apps = append $apps (dict "name" "sonarr" "values" .Values.sonarr "webPorts" (list .Values.sonarr.service.ports.web)) }}
{{- end }}
{{- if .Values.radarr.enabled }}
{{- $apps = append $apps (dict "name" "radarr" "values" .Values.radarr "webPorts" (list .Values.radarr.service.ports.web)) }}
{{- end }}
{{- if .Values.bazarr.enabled }}
{{- $apps = append $apps (dict "name" "bazarr" "values" .Values.bazarr "webPorts" (list .Values.bazarr.service.ports.web)) }}
{{- end }}
{{- if .Values.servarr.enabled }}
{{- $servarrPorts := list }}
{{- if .Values.prowlarr.enabled }}{{- $servarrPorts = append $servarrPorts .Values.prowlarr.service.ports.web }}{{- end }}
{{- if .Values.qbittorrent.enabled }}{{- $servarrPorts = append $servarrPorts .Values.qbittorrent.service.ports.web }}{{- end }}
{{- $apps = append $apps (dict "name" "servarr" "values" .Values.servarr "webPorts" $servarrPorts) }}
{{- end }}
{{- range $app := $apps }}
{{- $np := mergeOverwrite (deepCopy $global) ($app.values.networkPolicy | default dict) }}
{{- $webPorts := $app.webPorts }}
{{- $hasIngress := or $np.ingress.intraNamespace (and $np.ingress.gateway $webPorts) $np.ingress.cloudflared.enabled $np.ingress.allowedNamespaces $np.ingress.extraRules }}
{{- $hasEgress := or $np.egress.allowAll $np.egress.extraRules }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $app.name }}
  namespace: {{ $ctx.Release.Namespace }}
  labels:
    {{- include "mediaStack.labels" (dict "ctx" $ctx "app" $app.name) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "mediaStack.selectorLabels" (dict "ctx" $ctx "app" $app.name) | nindent 6 }}
  # Both directions carry rules, so both are in default-deny and the rules
  # below are the only openings. Kubelet probes come from the host identity,
  # which Cilium always allows, so they are unaffected.
  enableDefaultDeny:
    ingress: true
    egress: true
  {{- if $np.ingress.allowAll }}
  ingress:
    # Open ingress: any peer, any port.
    - fromEntities:
        - all
  {{- else if $hasIngress }}
  ingress:
    {{- if $np.ingress.intraNamespace }}
    # Anything in the namespace may reach the app on any port (sonarr →
    # prowlarr/qbittorrent, bazarr → sonarr/radarr, seerr → everything,
    # jellyfin discovery/DLNA, ...).
    - fromEndpoints:
        - {}
    {{- end }}
    {{- if and $np.ingress.gateway $webPorts }}
    # Cilium's Gateway API forwards traffic with the reserved `ingress` identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            {{- range $p := $webPorts }}
            - port: {{ $p | quote }}
              protocol: TCP
            {{- end }}
          {{- if $np.ingress.l7Http }}
          rules:
            http:
              - {}
          {{- end }}
    {{- end }}
    {{- if and $np.ingress.cloudflared.enabled $webPorts }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $np.ingress.cloudflared.namespace }}
      toPorts:
        - ports:
            {{- range $p := $webPorts }}
            - port: {{ $p | quote }}
              protocol: TCP
            {{- end }}
          {{- if $np.ingress.l7Http }}
          rules:
            http:
              - {}
          {{- end }}
    {{- end }}
    {{- range $ns := $np.ingress.allowedNamespaces }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns }}
      {{- if $webPorts }}
      toPorts:
        - ports:
            {{- range $p := $webPorts }}
            - port: {{ $p | quote }}
              protocol: TCP
            {{- end }}
          {{- if $np.ingress.l7Http }}
          rules:
            http:
              - {}
          {{- end }}
      {{- end }}
    {{- end }}
    {{- with $np.ingress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  ingress:
    # No ingress allowances configured. An allow-list that matches nothing is
    # what puts the endpoint into ingress default-deny - an absent section
    # would leave the direction unenforced (enableDefaultDeny does not enforce
    # a direction that has no rules). Cilium still trusts the host identity,
    # so kubelet probes keep working.
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: DoesNotExist
  {{- end }}
  {{- if $hasEgress }}
  egress:
    {{- if $np.egress.allowAll }}
    # Open egress: any destination, any port.
    - toEntities:
        - all
    {{- end }}
    {{- with $np.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  egress:
    # No egress allowances configured. An allow-list that matches nothing is
    # what puts the endpoint into egress default-deny - an absent section
    # would leave the direction unenforced (enableDefaultDeny does not enforce
    # a direction that has no rules). Replies to inbound connections are
    # conntrack-tracked and unaffected.
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: DoesNotExist
  {{- end }}
{{- end }}
{{- end }}
