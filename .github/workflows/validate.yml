name: Validate

on:
  pull_request:
    paths:
      - gitops/**
      - scripts/validate.sh
      - .mise.toml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install tools
        uses: jdx/mise-action@v4.3.0
        with:
          install_args: helm kustomize kubeconform

      - name: Render and schema-check changed dirs
        run: |
          dirs=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -oE '^gitops/(infrastructure|operators|security|services|apps)/[^/]+' | sort -u \
            | while read -r d; do [ -d "$d" ] && echo "$d"; done || true)
          # Tooling changes re-check everything.
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(scripts/validate\.sh|\.mise\.toml)$'; then
            dirs=""
          elif [ -z "$dirs" ]; then
            echo "No live gitops dirs changed."; exit 0
          fi
          scripts/validate.sh $dirs
