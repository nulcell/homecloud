name: Renovate

on:
  schedule:
    # Every 6 hours. Renovate's own `schedule` setting in renovate.json5
    # still decides when PRs are actually created; this just controls how
    # often the bot wakes up to check.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.1.21
        with:
          configurationFile: .github/renovate-global.json5
          token: "${{ secrets.RENOVATE_TOKEN }}"
        env:
          LOG_LEVEL: debug
