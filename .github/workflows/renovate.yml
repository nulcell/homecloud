name: Renovate

on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          configurationFile: .github/renovate-global.json5
          token: "${{ secrets.RENOVATE_TOKEN }}"
        env:
          LOG_LEVEL: debug
          # Docker Hub credentials for the private nullcell/portfolio image,
          # whose tag Renovate reads from charts/portfolio/Chart.yaml appVersion.
          # DOCKERHUB_TOKEN must be a Personal Access Token (read-only is enough)
          # - Docker rejects account passwords for API logins, and Renovate
          # surfaces that only as "Failed to look up docker package".
          # matchHost has no scheme, so it suffix-matches index.docker.io too.
          # RENOVATE_-prefixed vars reach the container via the action's default
          # env allowlist; anything else would need an `env-regex` override.
          RENOVATE_HOST_RULES: >-
            [{"hostType":"docker","matchHost":"docker.io","username":"${{ secrets.DOCKERHUB_USERNAME }}","password":"${{
            secrets.DOCKERHUB_TOKEN }}"}]
