apiVersion: v1
kind: Namespace
metadata:
  name: knative-eventing
---
apiVersion: operator.knative.dev/v1beta1
kind: KnativeEventing
metadata:
  name: knative-eventing
  namespace: knative-eventing
spec:
  version: "1.20.0"
  source:
    ceph:
      enabled: false
    github:
      enabled: false
    gitlab:
      enabled: false
    kafka:
      enabled: false
    rabbitmq:
      enabled: false
    redis:
      enabled: false
