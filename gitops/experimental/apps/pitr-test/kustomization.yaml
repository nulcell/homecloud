apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pitr-test

helmCharts:
  - name: app-template
    repo: oci://ghcr.io/nulcell/charts
    version: 0.3.5
    releaseName: pitr-test
    namespace: pitr-test
    valuesFile: values.yaml
    includeCRDs: false

resources:
  - objectstore.yaml
  # restore.yaml is applied only during the drill (see cluster/docs/backup-restore.md).
