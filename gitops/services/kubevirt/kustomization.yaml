apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level `namespace:` - KubeVirt resources stay in `kubevirt`, CDI in
# `cdi`. Each upstream operator manifest already creates and namespaces its
# own resources. Both operators ship with `pod-security.kubernetes.io/enforce:
# privileged` on their namespaces, so no namespace patching is needed.

resources:
  - kubevirt.yaml
  - cdi.yaml
  # - httproute.yaml
