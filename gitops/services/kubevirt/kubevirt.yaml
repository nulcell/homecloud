# KubeVirt operator config. The operator reconciles this CR to install /
# upgrade the actual KubeVirt components (virt-api, virt-controller, virt-handler,
# virt-operator). Sync wave 5 keeps it ordered after the CRD lands in wave 0.
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  configuration:
    developerConfiguration:
      # 1 guest vCPU == 1 pod CPU request. Default is 10 (10x overcommit).
      # With `1`, the virt-launcher pod's CPU request equals the VMI's vCPU
      # count, so VMs land in at least Burstable QoS (memory is already 1:1
      # by default → Guaranteed memory). For *truly* Guaranteed pod QoS
      # (CPU request == limit), the instancetype must set
      # `cpu.dedicatedCPUPlacement: true`, which requires the kubelet's CPU
      # Manager static policy to be enabled on every node.
      # The field lives under developerConfiguration in v1.8.x.
      cpuAllocationRatio: 1
      featureGates:
        - LiveMigration
        - NetworkBindingPlugins
        - HotplugVolumes
        - HostDisk
        - VMExport
        - Snapshot
        - ExpandDisks
        - ExperimentalIgnitionSupport
    smbios:
      sku: "TalosCloud"
      version: "v0.1.0"
      manufacturer: "Talos Virtualization"
      product: "talosvm"
      family: "ccio"
    # cpuModel: "host-passthrough"
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate # enable if you have deployed either Longhorn or NFS-CSI for shared storage.
