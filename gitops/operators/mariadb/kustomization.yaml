apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mariadb-system

# CRDs must be installed before the operator.
# Listing the CRDs chart first ensures kustomize outputs them first;
# ArgoCD's ServerSideApply then applies CRDs before other resources.
helmCharts:
  - name: mariadb-operator-crds
    repo: oci://ghcr.io/mariadb-operator/charts
    version: 26.6.0
    releaseName: mariadb-operator-crds
    namespace: mariadb-system
    includeCRDs: true

  - name: mariadb-operator
    repo: oci://ghcr.io/mariadb-operator/charts
    version: 26.6.0
    releaseName: mariadb-operator
    namespace: mariadb-system
    valuesFile: values.yaml
    includeCRDs: false

resources:
  - namespace.yaml
