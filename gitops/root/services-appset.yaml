apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/nulcell/homecloud
        revision: main
        directories:
          - path: gitops/services/*
  template:
    metadata:
      name: "services-{{.path.basename}}"
      annotations:
        argocd.argoproj.io/sync-wave: "15"
    spec:
      project: default
      source:
        repoURL: https://github.com/nulcell/homecloud
        targetRevision: main
        path: "{{.path.path}}"
        plugin:
          name: kustomize-sops
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
