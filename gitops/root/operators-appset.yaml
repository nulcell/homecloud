apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: operators
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/nulcell/homecloud
        revision: main
        directories:
          - path: gitops/operators/*
  template:
    metadata:
      name: "operators-{{.path.basename}}"
      annotations:
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: default
      source:
        repoURL: https://github.com/nulcell/homecloud
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      # cdi-operator strips v1alpha1 from this CRD; without this ArgoCD puts it
      # back every reconcile, and each flip leaks etcd connections in the apiserver.
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: cdis.cdi.kubevirt.io
          jsonPointers:
            - /spec/versions
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # Without this, ignoreDifferences only affects diffing - sync still applies the field.
          - RespectIgnoreDifferences=true
