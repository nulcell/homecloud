apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/nulcell/homecloud
        revision: main
        directories:
          - path: gitops/apps/*
  template:
    metadata:
      name: "app-{{.path.basename}}"
      annotations:
        argocd.argoproj.io/sync-wave: "100"
        # Diff via server-side dry-run apply, so CRD schema defaults the API server
        # injects (e.g. relabelings `action: replace`) don't read as permanent drift.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: default
      source:
        repoURL: https://github.com/nulcell/homecloud
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
