# Applied once during bootstrap:
#   kubectl apply -f gitops/root/root-app.yaml
#
# Edit `repoURL` before applying.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nulcell/homecloud
    targetRevision: main
    path: gitops/root
    # Note: directory.recurse defaults to false, so we only pick up the
    # ApplicationSets sitting directly in gitops/root/ — not anything they
    # generate. Setting recurse: false explicitly causes a phantom OutOfSync
    # because ArgoCD strips the default from the live object on apply.
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
