apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: falco

helmCharts:
  - name: falco
    repo: https://falcosecurity.github.io/charts
    version: 9.1.0
    releaseName: falco
    namespace: falco
    valuesFile: values.yaml
    additionalValuesFiles:
      - custom-rules.yaml
  - name: fluent-bit
    repo: https://fluent.github.io/helm-charts
    version: 0.58.0
    releaseName: fluent-bit
    namespace: falco
    valuesFile: fluentbit-values.yaml

resources:
  - namespaces.yaml
  - falcosidekick-ui-http-routes.yaml
