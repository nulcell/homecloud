apiVersion: v1
kind: ServiceAccount
metadata:
  name: profile-cleanup
  namespace: kubescape
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubescape-profile-cleanup
rules:
  - apiGroups: ["spdx.softwarecomposition.kubescape.io"]
    resources: ["applicationprofiles", "networkneighborhoods"]
    verbs: ["list", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "daemonsets", "statefulsets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubescape-profile-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubescape-profile-cleanup
subjects:
  - kind: ServiceAccount
    name: profile-cleanup
    namespace: kubescape
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: profile-cleanup
  namespace: kubescape
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: profile-cleanup
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: alpine:3.22
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  apk add --no-cache kubectl \
                    --repository=https://dl-cdn.alpinelinux.org/alpine/edge/community/ >/dev/null

                  COLS="NS:.metadata.namespace,NAME:.metadata.name"

                  # Pre-fetch all owning resource lists upfront — avoids one kubectl call per profile.
                  # RS names include the pod-template hash (e.g. headlamp-5db4d88db6) so the profile
                  # name maps directly to the RS. DS/SS names do not — Kubescape appends the hash
                  # itself, so it must be stripped before the lookup (see case statement below).
                  replicasets=$(kubectl get replicasets.apps    -A --no-headers -o custom-columns="$COLS")
                  daemonsets=$(kubectl  get daemonsets.apps     -A --no-headers -o custom-columns="$COLS")
                  statefulsets=$(kubectl get statefulsets.apps  -A --no-headers -o custom-columns="$COLS")
                  pods=$(kubectl        get pods                -A --no-headers -o custom-columns="$COLS")
                  clusters=$(kubectl    get clusters.postgresql.cnpg.io           -A --no-headers -o custom-columns="$COLS" 2>/dev/null || true)
                  vmis=$(kubectl        get virtualmachineinstances.kubevirt.io   -A --no-headers -o custom-columns="$COLS" 2>/dev/null || true)

                  exists_in() {
                    echo "$1" | awk -v ns="$2" -v n="$3" '$1==ns && $2==n { found=1 } END { exit !found }'
                  }

                  cleanup() {
                    local fq_crd short tmpfile ns name owner_kind owner_name check_name list
                    local deleted=0 kept=0 skipped=0

                    fq_crd="$1"
                    short="${fq_crd%%.*}"
                    tmpfile=$(mktemp)

                    kubectl get "$fq_crd" -A --no-headers -o custom-columns="$COLS" > "$tmpfile"

                    while IFS= read -r line; do
                      ns=$(echo "$line" | awk '{print $1}')
                      name=$(echo "$line" | awk '{print $2}')
                      owner_kind="${name%%-*}"
                      owner_name="${name#*-}"

                      case "$owner_kind" in
                        replicaset)             list="$replicasets";  check_name="$owner_name" ;;
                        daemonset)              list="$daemonsets";   check_name="${owner_name%-*}" ;;
                        statefulset)            list="$statefulsets"; check_name="${owner_name%-*}" ;;
                        pod)                    list="$pods";         check_name="$owner_name" ;;
                        cluster)                list="$clusters";     check_name="$owner_name" ;;
                        virtualmachineinstance) list="$vmis";         check_name="$owner_name" ;;
                        *) skipped=$((skipped + 1)); continue ;;
                      esac

                      if ! exists_in "$list" "$ns" "$check_name"; then
                        echo "  delete $ns/$name"
                        kubectl delete "$fq_crd" -n "$ns" "$name"
                        deleted=$((deleted + 1))
                      else
                        kept=$((kept + 1))
                      fi

                    done < "$tmpfile"
                    rm -f "$tmpfile"

                    echo "$short: kept=$kept deleted=$deleted skipped=$skipped"
                  }

                  cleanup applicationprofiles.spdx.softwarecomposition.kubescape.io
                  cleanup networkneighborhoods.spdx.softwarecomposition.kubescape.io
