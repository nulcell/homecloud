---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: falco
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  labels:
    app.kubernetes.io/name: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    # 1. Read the Kubernetes Audit Logs from the Talos Filesystem
    [INPUT]
        Name           tail
        Tag            audit.k8s
        Path           /var/log/audit/kube/*.log
        Parser         json
        Read_from_Head true
        Refresh_Interval 5

    # 2. Forward them to Falco's k8saudit plugin endpoint
    [OUTPUT]
        Name           http
        Match          audit.k8s
        Host           falco.falco.svc.cluster.local
        Port           8765
        URI            /k8s-audit
        Format         json

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      # Allow Fluent Bit to run on control plane nodes where audit logs live
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:3.0.4
          imagePullPolicy: Always
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
            - name: talos-audit-logs
              mountPath: /var/log/audit
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        # Mount the Talos audit directory
        - name: talos-audit-logs
          hostPath:
            path: /var/log/audit
            type: DirectoryOrCreate
