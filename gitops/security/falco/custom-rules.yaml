# Local overrides for upstream rules. Priority 90 so they load after every upstream ruleset.
# inlineRules must be structured YAML (a list), not a string - the operator re-serializes it.
#
# Layout: one section per component, syscall rules first, then k8s audit rules. Each exception is scoped
# to namespace + container (+ binary) and appends `and not (...)` to the upstream rule. Every rule named
# here must exist upstream, or Falco rejects the whole file. Validate before pushing:
#   kubectl exec -n falco <falco-pod> -c falco -- falco -V <each rules.d file> -V <this file's inlineRules>
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: custom-overrides
spec:
  priority: 90
  inlineRules:
    # falco-operator blocks rulesfiles that declare no requirements.
    - required_engine_version: 0.57.0

    # ── Disabled ───────────────────────────────────────────────────────────────

    # Fires on too many normal operations across workloads.
    - rule: "Unexpected UDP Traffic"
      enabled: false
      override:
        enabled: replace

    # ── Talos runtime ──────────────────────────────────────────────────────────

    # Workload isolation (sandboxd): Talos' own processes live outside the pods' PID namespace, so Falco
    # sees their events as container "host" with no resolvable process. Pods can't produce this shape.
    - macro: outside_workload_sandbox
      condition: container.id = "host" and proc.exepath = ""
    # Container runtime processes: "runtime" without workload isolation, "shim" with it.
    - macro: is_container_runtime
      condition: container.id in ("runtime", "shim")

    - rule: "BPF Program Not Profiled"
      override:
        condition: append
      condition: and not outside_workload_sandbox and not (is_container_runtime and proc.exepath = "/usr/bin/runc")
    - rule: "Change thread namespace"
      override:
        condition: append
      condition: and not outside_workload_sandbox and not (is_container_runtime and proc.exepath = "/opt/cni/bin/loopback")
    # containerd unpacks image layers, preserving setuid bits.
    - rule: "Set Setuid or Setgid bit"
      override:
        condition: append
      condition: and not outside_workload_sandbox and not (is_container_runtime and proc.exepath = "/usr/bin/containerd")
    - rule: "Contact K8S API Server From Container"
      override:
        condition: append
      condition: and not (is_container_runtime and proc.exepath = "/usr/bin/containerd-shim-runc-v2")

    # ── Cilium (kube-system) ───────────────────────────────────────────────────

    - rule: "BPF Program Not Profiled"
      override:
        condition: append
      condition: and not (k8s.ns.name = "kube-system" and container.name = "cilium-agent" and proc.exepath = "/usr/bin/cilium-agent")
    - rule: "Change thread namespace"
      override:
        condition: append
      condition: and not (k8s.ns.name = "kube-system" and container.name = "cilium-agent" and proc.exepath = "/usr/bin/cilium-agent")
    - rule: "Launch Excessively Capable Container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "kube-system" and container.image.repository = "quay.io/cilium/cilium")
    - rule: "Drop and execute new binary in container"
      override:
        condition: append
      condition: >-
        and not ((is_container_runtime and proc.exepath = "/opt/cni/bin/cilium-cni")
        or (k8s.ns.name = "kube-system" and container.name = "apply-sysctl-overwrites" and proc.exepath = "/opt/cni/bin/cilium-sysctlfix"))
    # cilium-envoy drops privileges and unshares at start.
    - rule: "Set Setuid or Setgid bit"
      override:
        condition: append
      condition: and not (k8s.ns.name = "kube-system" and container.name = "cilium-envoy" and proc.exepath = "/usr/bin/cilium-envoy")
    - rule: "Change namespace privileges via unshare"
      override:
        condition: append
      condition: and not (is_container_runtime and proc.exepath = "/usr/bin/cilium-envoy")

    # ── Longhorn (longhorn-system) ─────────────────────────────────────────────

    - rule: "Change thread namespace"
      override:
        condition: append
      condition: >-
        and not (k8s.ns.name = "longhorn-system"
        and container.name in ("longhorn-manager", "instance-manager", "longhorn-csi-plugin"))
    - rule: "Change namespace privileges via unshare"
      override:
        condition: append
      condition: and not (k8s.ns.name = "longhorn-system" and container.name = "longhorn-manager")
    - rule: "Mount Launched in Privileged Container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "longhorn-system" and container.name = "longhorn-csi-plugin" and proc.exepath = "/usr/bin/mount")
    - rule: "Launch Suspicious Network Tool in Container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "longhorn-system" and container.name = "instance-manager" and proc.name = "nc")
    - rule: "Redirect STDOUT/STDIN to Network Connection in Container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "longhorn-system" and container.name = "instance-manager" and proc.name = "longhorn-instan")
    - rule: "Launch Package Management Process in Container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "longhorn-system" and container.name = "longhorn-manager" and proc.name = "dpkg")
    - rule: "System procs network activity"
      override:
        condition: append
      condition: and not (k8s.ns.name = "longhorn-system" and container.name startswith "engine-image-")

    # ── CloudNativePG (every namespace with a Postgres cluster) ────────────────

    # The instance manager archives WAL through a shell and talks to the API server.
    - rule: "Run shell untrusted"
      override:
        condition: append
      condition: >-
        and not (container.name = "postgres" and proc.pname = "postgres"
        and proc.cmdline startswith "sh -c -- /controller/manager wal-archive")
    - rule: "DB program spawned process"
      override:
        condition: append
      condition: and not (container.name = "postgres" and proc.exepath = "/bin/dash" and proc.pname = "postgres")

    # ── Kubernetes API clients ─────────────────────────────────────────────────

    # Operators and controllers that talk to the API server by design.
    - rule: "Contact K8S API Server From Container"
      override:
        condition: append
      condition: >-
        and not ((k8s.ns.name = "argocd" and proc.exepath = "/usr/local/bin/argocd")
        or (container.name = "postgres" and proc.exepath = "/controller/manager")
        or (container.name = "plugin-barman-cloud" and proc.exepath = "/manager")
        or (k8s.ns.name = "longhorn-system" and container.name = "longhorn-manager")
        or (k8s.ns.name = "trivy" and proc.exepath = "/usr/local/bin/trivy-operator"))

    # ── Apps ───────────────────────────────────────────────────────────────────

    # argocd: redis' busybox drops privileges.
    - rule: "Non sudo setuid"
      override:
        condition: append
      condition: and not (k8s.ns.name = "argocd" and container.name = "redis" and proc.exepath = "/bin/busybox")

    # cloudflared loads socket BPF programs.
    - rule: "BPF Program Not Profiled"
      override:
        condition: append
      condition: and not (k8s.ns.name = "cloudflared" and proc.exepath = "/usr/local/bin/cloudflared")

    # fitness: nginx's entrypoint queries apk for its version.
    # media: seerr starts with `npm start`.
    # n8n: installs community nodes at start.
    - rule: "Launch Package Management Process in Container"
      override:
        condition: append
      condition: >-
        and not ((k8s.ns.name = "fitness" and container.name = "web" and proc.cmdline startswith "apk manifest --no-network nginx")
        or (k8s.ns.name = "media" and container.name = "seerr" and proc.cmdline startswith "npm node /usr/local/bin/npm start")
        or (k8s.ns.name = "n8n" and container.name = "npm-install" and proc.name = "npm"))

    # media: linuxserver images' s6 init sets setuid bits and installs crontabs at start; healthchecks
    # use nc and ping; the sshd sidecar redirects stdio.
    - rule: "Set Setuid or Setgid bit"
      override:
        condition: append
      condition: and not (k8s.ns.name = "media" and proc.name = "s6-rc-init")
    - rule: "Schedule Cron Jobs"
      override:
        condition: append
      condition: and not (k8s.ns.name = "media" and proc.name = "crontab")
    - rule: "Launch Suspicious Network Tool in Container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "media" and container.name in ("bazarr", "qbittorrent") and proc.name = "nc")
    - rule: "Redirect STDOUT/STDIN to Network Connection in Container"
      override:
        condition: append
      condition: >-
        and not (k8s.ns.name = "media" and ((container.name = "sshd" and proc.name = "sshd.pam")
        or (container.name in ("gluetun", "qbittorrent") and proc.name = "ping")))

    # ── K8s audit: ArgoCD ──────────────────────────────────────────────────────

    # The application controller manages RBAC and service accounts as part of GitOps sync.
    - macro: is_argocd_app_controller
      condition: ka.user.name = "system:serviceaccount:argocd:argocd-application-controller"
    - rule: "K8s ClusterRole Created"
      override:
        condition: append
      condition: and not is_argocd_app_controller
    - rule: "K8s ClusterRole Deleted"
      override:
        condition: append
      condition: and not is_argocd_app_controller
    - rule: "System ClusterRole Modified/Deleted"
      override:
        condition: append
      condition: and not is_argocd_app_controller
    - rule: "K8s ClusterRoleBinding Created"
      override:
        condition: append
      condition: and not is_argocd_app_controller
    - rule: "K8s ClusterRoleBinding Deleted"
      override:
        condition: append
      condition: and not is_argocd_app_controller
    - rule: "K8s Role Created"
      override:
        condition: append
      condition: and not is_argocd_app_controller
    - rule: "K8s Role Deleted"
      override:
        condition: append
      condition: and not is_argocd_app_controller
    - rule: "K8s RoleBinding Created"
      override:
        condition: append
      condition: and not is_argocd_app_controller
    - rule: "K8s RoleBinding Deleted"
      override:
        condition: append
      condition: and not is_argocd_app_controller
    - rule: "K8s Serviceaccount Deleted"
      override:
        condition: append
      condition: and not is_argocd_app_controller

    # ── K8s audit: Kubernetes control plane ────────────────────────────────────

    - macro: is_system_kube_user
      condition: ka.user.name = "system:kube-controller-manager" or ka.user.name startswith "system:node:"
    - rule: "K8s Serviceaccount Created"
      override:
        condition: append
      condition: and not is_system_kube_user
    - rule: "Service Account Created in Kube Namespace"
      override:
        condition: append
      condition: and not is_system_kube_user
    - rule: "Pod Created in Kube Namespace"
      override:
        condition: append
      condition: >-
        and not ka.user.name in ("system:serviceaccount:kube-system:replicaset-controller",
        "system:serviceaccount:kube-system:daemon-set-controller")
    - rule: "Disallowed K8s User"
      override:
        condition: append
      condition: and not (ka.user.name = "talos:admin" and ka.target.resource = "endpointslices")

    # ── K8s audit: secret readers ──────────────────────────────────────────────

    # Service accounts that read secrets by design (operators, CNPG clusters). Sorted by namespace.
    - rule: "K8s Secret Get Successfully"
      override:
        condition: append
      condition: >-
        and not ka.user.name in (
          "system:serviceaccount:argocd:argocd-application-controller",
          "system:serviceaccount:authentik:authentik",
          "system:serviceaccount:authentik:authentik-postgres",
          "system:serviceaccount:cert-manager:cert-manager",
          "system:serviceaccount:cert-manager:cert-manager-cainjector",
          "system:serviceaccount:cnpg-system:cnpg-cloudnative-pg",
          "system:serviceaccount:external-secrets:external-secrets",
          "system:serviceaccount:external-secrets:external-secrets-cert-controller",
          "system:serviceaccount:gatus:gatus-postgres",
          "system:serviceaccount:keda:keda-operator",
          "system:serviceaccount:kube-system:generic-garbage-collector",
          "system:serviceaccount:longhorn-system:longhorn-service-account",
          "system:serviceaccount:mealie:mealie-postgres",
          "system:serviceaccount:monitoring:kps-admission",
          "system:serviceaccount:monitoring:kps-operator",
          "system:serviceaccount:n8n:n8n-postgres",
          "system:serviceaccount:tailscale:operator",
          "system:serviceaccount:trivy:trivy-operator"
        )
