customRules:
  core-supressions.yaml: |
    - rule: "BPF Program Not Profiled"
      override:
        condition: append
      condition:
        and (container.id = "runtime" and evt.type = "bpf" and proc.exepath = "/usr/bin/runc" and proc.pname = "containerd-shim")
  ignore-cilium-cni.yaml: |
    - rule: "Drop and execute new binary in container"
      override:
        condition: append
      condition: and not (container.id = "runtime" and proc.exe = "/opt/cni/bin/cilium-cni")
    - rule: "BPF Program Not Profiled"
      override:
        condition: append
      condition: and not (k8s.ns.name = "kube-system" and container.name = "cilium-agent" and proc.exepath = "/usr/bin/cilium-agent")
  # disable-udp-rule.yaml: |
  #   - rule: "Unexpected UDP Traffic"
  #     override:
  #       condition: append
  #     condition: and (never_true)
  ignore-longhorn.yaml: |
    - rule: "Launch Suspicious Network Tool in Container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "longhorn-system" and container.name = "instance-manager" and proc.name = "nc")
    - rule: "Redirect STDOUT/STDIN to Network Connection in Container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "longhorn-system" and container.name = "instance-manager" and proc.name = "longhorn-instan")
    - rule: "Change thread namespace"
      override:
        condition: append
      condition: and not (k8s.ns.name = "longhorn-system" and container.name = "longhorn-manager" and proc.pname in ("longhorn-manage","containerd-shim"))
    - rule: "Launch Package Management Process in Container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "longhorn-system" and container.name = "longhorn-manager" and proc.name = "dpkg")
  ignore-gluetun-ping.yaml: |
    - rule: "Redirect STDOUT/STDIN to Network Connection in Container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "media" and container.name = "gluetun" and proc.name = "ping")
  ignore-qbittorrent-ping.yaml: |
    - rule: "Redirect STDOUT/STDIN to Network Connection in Container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "media" and container.name = "qbittorrent" and proc.name = "ping")
  ignore-kubescape.yaml: |
    - rule: "BPF Program Not Profiled"
      override:
        condition: append
      condition: and not (k8s.ns.name = "kubescape" and container.name = "node-agent" and proc.exepath = "/usr/bin/node-agent")
    - rule: "Contact EC2 Instance Metadata Service From Container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "kubescape" and container.name = "node-agent" and proc.exepath = "/usr/bin/node-agent")
    - rule: "Packet socket created in container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "kubescape" and container.name = "node-agent" and proc.exepath = "/usr/bin/node-agent")
    - rule: "Contact cloud metadata service from container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "kubescape" and container.name = "node-agent" and proc.exepath = "/usr/bin/node-agent")
    - rule: "Drop and execute new binary in container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "kubescape" and container.name = "cleanup" and proc.name = "kubectl")
    - rule: "Launch Package Management Process in Container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "kubescape" and container.name = "cleanup" and proc.name = "apk")
  ignore-speedtest-tracker.yaml: |
    - rule: "Non sudo setuid"
      override:
        condition: append
      condition: and not (k8s.ns.name = "speedtest-tracker" and container.name = "speedtest-tracker" and proc.exepath = "/bin/busybox")
  ignore-postgres-spawn.yaml: |
    - rule: "DB program spawned process"
      override:
        condition: append
      condition: and not (container.name = "postgres" and proc.exepath = "/bin/dash" and proc.pname = "postgres")
  ignore-media-sshd.yaml: |
    - rule: "Redirect STDOUT/STDIN to Network Connection in Container"
      override:
        condition: append
      condition: and not (k8s.ns.name = "media" and container.name = "sshd" and proc.name = "sshd.pam")
  ignore-talos-admin.yaml: |
    - rule: "Disallowed K8s User"
      override:
        condition: append
      condition: and not (ka.user.name = "talos:admin" and ka.target.resource = "endpointslices")
  ignore-argocd-rbac.yaml: |
    - rule: "K8s ClusterRole Created"
      override:
        condition: append
      condition: and not ka.user.name = "system:serviceaccount:argocd:argocd-application-controller"
    - rule: "K8s ClusterRole Deleted"
      override:
        condition: append
      condition: and not ka.user.name = "system:serviceaccount:argocd:argocd-application-controller"
    - rule: "K8s ClusterRoleBinding Created"
      override:
        condition: append
      condition: and not ka.user.name = "system:serviceaccount:argocd:argocd-application-controller"
    - rule: "K8s ClusterRoleBinding Deleted"
      override:
        condition: append
      condition: and not ka.user.name = "system:serviceaccount:argocd:argocd-application-controller"
    - rule: "K8s Role Created"
      override:
        condition: append
      condition: and not ka.user.name = "system:serviceaccount:argocd:argocd-application-controller"
    - rule: "K8s Role Deleted"
      override:
        condition: append
      condition: and not ka.user.name = "system:serviceaccount:argocd:argocd-application-controller"
    - rule: "K8s RoleBinding Created"
      override:
        condition: append
      condition: and not ka.user.name = "system:serviceaccount:argocd:argocd-application-controller"
    - rule: "K8s RoleBinding Deleted"
      override:
        condition: append
      condition: and not ka.user.name = "system:serviceaccount:argocd:argocd-application-controller"
    - rule: "K8s Serviceaccount Deleted"
      override:
        condition: append
      condition: and not ka.user.name = "system:serviceaccount:argocd:argocd-application-controller"
  ignore-secret-access.yaml: |
    - rule: "K8s Secret Get Successfully"
      override:
        condition: append
      condition: >-
        and not ka.user.name in (
          "system:serviceaccount:argocd:argocd-application-controller",
          "system:serviceaccount:cdi:cdi-operator",
          "system:serviceaccount:cnpg-system:cnpg-cloudnative-pg",
          "system:serviceaccount:external-secrets:external-secrets",
          "system:serviceaccount:external-secrets:external-secrets-cert-controller",
          "system:serviceaccount:homarr:homarr-postgres",
          "system:serviceaccount:longhorn-system:longhorn-service-account",
          "system:serviceaccount:monitoring:kps-admission",
          "system:serviceaccount:speedtest-tracker:speedtest-tracker-postgres"
        )
  ignore-system-sa-creation.yaml: |
    - rule: "K8s Serviceaccount Created"
      override:
        condition: append
      condition: and not (ka.user.name = "system:kube-controller-manager" or ka.user.name startswith "system:node:")
    - rule: "Service Account Created in Kube Namespace"
      override:
        condition: append
      condition: and not (ka.user.name = "system:kube-controller-manager" or ka.user.name startswith "system:node:")
