apiVersion: instance.falcosecurity.dev/v1alpha1
kind: Component
metadata:
  name: sidekick
  labels:
    app.kubernetes.io/managed-by: falco-operator
spec:
  component:
    type: falcosidekick
    version: "2.32.0"
  replicas: 2
---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Config
metadata:
  name: sidekick-output
spec:
  config:
    json_output: true
    http_output:
      enabled: true
      url: "http://sidekick:2801"
