apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: falco

# Chart at charts/falco-stack/ — referenced via chartHome.
# Requires the CMP plugin to use --load-restrictor=LoadRestrictionsNone (set in
# cluster/bootstrap/argocd-values.yaml) so kustomize can read files above this
# directory.
helmGlobals:
  chartHome: ../../../charts

helmCharts:
  - name: falco-stack
    releaseName: falco
    namespace: falco
    valuesFile: values.yaml
    includeCRDs: false # CRDs ship with gitops/infrastructure/falco-operator/

resources:
  - namespace.yaml
