apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: falco

helmCharts:
  # Not managed by falco-operator: response actions engine.
  - name: falco-talon
    repo: https://falcosecurity.github.io/charts
    version: 0.4.1
    releaseName: falco-talon
    namespace: falco
    valuesFile: talon-values.yaml
  # Not managed by falco-operator: ships Talos kube-apiserver audit logs to the k8saudit plugin.
  - name: fluent-bit
    repo: https://fluent.github.io/helm-charts
    version: 0.58.0
    releaseName: fluent-bit
    namespace: falco
    valuesFile: fluentbit-values.yaml

resources:
  - falco.yaml
  - rules.yaml
  - custom-rules.yaml
  - plugins.yaml
  - components.yaml
  - monitoring.yaml
  - httproutes.yaml
