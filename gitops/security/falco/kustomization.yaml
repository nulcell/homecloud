apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: falco

helmCharts:
  - name: falco
    repo: https://falcosecurity.github.io/charts
    version: 9.0.0
    releaseName: falco
    namespace: falco
    valuesFile: values.yaml
  - name: fluent-bit
    repo: https://fluent.github.io/helm-charts
    version: v0.57.6
    releaseName: fluent-bit
    namespace: falco
    valuesFile: fluentbit-values.yaml

resources:
  - namespaces.yaml
  - falcosidekick-ui-http-routes.yaml
