apiVersion: v1
kind: Namespace
metadata:
  name: falco
  labels:
    # Falco DaemonSet needs hostPID, hostNetwork, BPF capabilities, and the
    # modern_ebpf driver mounts /proc and /sys from the host. PSA is per-
    # namespace, so the whole namespace gets bumped — the Components
    # (falcosidekick, falcosidekick-ui, metacollector) and the Redis
    # StatefulSet all live here too and run fine under privileged.
    #
    # If Talos's cluster-wide PodSecurity admission still rejects pods (visible
    # as a "violates PodSecurity" error on the Falco DaemonSet), add this
    # exemption to cluster/talos/patches/controlplane.yaml under
    # `cluster.apiServer.admissionControl` and re-apply the machineconfig:
    #
    #   - name: PodSecurity
    #     configuration:
    #       apiVersion: pod-security.admission.config.k8s.io/v1
    #       kind: PodSecurityConfiguration
    #       defaults: { enforce: baseline, audit: restricted, warn: restricted }
    #       exemptions: { namespaces: [kube-system, falco] }
    #
    # (Source: https://falco.org/blog/deploy-falco-talos-cluster/)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
