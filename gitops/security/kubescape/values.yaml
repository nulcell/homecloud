clusterName: homecloud

capabilities:
  # ====== Configuration scanning — disabled: Trivy configAuditScannerEnabled covers this ======
  configurationScan: disable
  continuousScan: disable
  nodeScan: disable

  # ====== Image vulnerabilities — disabled: Trivy vulnerability + SBOM scanning covers this ======
  vulnerabilityScan: disable
  relevancy: disable
  vexGeneration: disable

  # ====== Runtime — unique to Kubescape, not covered by Trivy or Falco ======
  runtimeObservability: enable
  networkPolicyService: enable
  seccompProfileService: enable
  runtimeDetection: disable
  malwareDetection: disable
  nodeProfileService: disable

  # ====== Other ======
  autoUpgrading: disable
  prometheusExporter: enable
  admissionController: disable

serviceScanConfig:
  enabled: false
  interval: 1h

kubescape:
  serviceMonitor:
    enabled: true

nodeAgent:
  serviceMonitor:
    enabled: true
