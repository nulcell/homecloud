clusterName: homecloud

excludeNamespaces: "kubescape,kube-system,kube-public,kube-node-lease,kubeconfig,trivy"
includeNamespaces: ""

# DockerHub pull-through credentials — the secret is created by the
# infra-registry-credentials ArgoCD app in this namespace.
# Chart expects a single string (secret name), not a list.
imagePullSecrets: "dockerhub-credentials"

global:
  enableClusterWideSecretAccess: true

capabilities:
  # ====== Base operator ======
  operator: enable

  # ====== configuration scanning related capabilities ======
  #
  # Default configuration scanning setup
  configurationScan: enable
  # Watch-mode scanning: re-evaluates posture on every resource change (creates/updates).
  # Combined with configurationScan, this keeps the posture dashboard live rather than
  # only refreshing on a schedule.
  continuousScan: disable
  nodeScan: enable

  # ====== Image vulnerabilities ======
  # Scan all workload images for CVEs — core feature for kubescape vs trivy comparison.
  vulnerabilityScan: enable
  # Syft-based SBOM extraction from node-level image layers. Requires vulnerabilityScan.
  nodeSbomGeneration: enable
  scanEmbeddedSBOMs: enable
  # Filter CVEs to only those in libraries actually loaded at runtime (eBPF trace).
  # This is kubescape's key differentiator vs trivy: noise reduction based on
  # observed execution rather than static package lists.
  relevancy: enable
  vexGeneration: disable

  # ====== Runtime related capabilities ======
  #
  runtimeObservability: enable
  networkPolicyService: enable
  networkEventsStreaming: enable # testing
  # Runtime threat detection (Falco-style rules over eBPF events). Note: Falco is
  # also deployed in this cluster — there will be overlap. Enabling here for the
  # full kubescape feature comparison.
  runtimeDetection: enable # testing
  malwareDetection: disable
  # Build per-node application profiles used by relevancy and network policy gen.
  nodeProfileService: enable
  admissionController: enable
  httpDetection: enable
  seccompProfileService: enable
  seccompProfileBackend: crd
  manageWorkloads: enable # testing
  # Sync generated SBOMs to the backing storage so the UI/API can surface them.
  syncSBOM: enable

  # ====== Risk acceptance ======
  riskAcceptance: disable

  # ====== Other capabilities ======
  #
  # This is an experimental capability with an elevated security risk. Read the
  # matching docs before enabling.
  autoUpgrading: disable
  kubescapeOffline: disable
  prometheusExporter: disable
  # seccompGenerator: disable

# installation of the alertCRD chart
alertCRD:
  installDefault: false # install the default CRD
  scopeClustered: true # it is better to have the CRDs in the cluster scope
  scopeNamespaced: false # enable scopeNamespaced when there are no permissions for creating cluster scoped CRDs

serviceScanConfig:
  enabled: true
  interval: 1h

persistence:
  storageClass: "longhorn"
  accessMode: ReadWriteOnce
  size:
    backingStorage: 5Gi
    kubevuln: 5Gi

# kubescape scanner - https://github.com/kubescape/kubescape
kubescape:
  name: kubescape
  resources:
    requests:
      cpu: 250m
      memory: 400Mi
    limits:
      cpu: 600m
      memory: 1Gi
  serviceMonitor:
    enabled: true

# +++++++++++++++++++++++++++++++ Operator ++++++++++++++++++++++++++++++++++++++++++++++++

# Operator will trigger kubescape and kubevuln scanning
operator:
  name: operator
  resources:
    requests:
      cpu: 500m
      memory: 2048Mi
    limits:
      cpu: 2000m
      memory: 8192Mi

# kubevuln - image vulnerability scanning microservice
kubevuln:
  name: kubevuln
  replicaCount: 1
  resources:
    requests:
      cpu: 300m
      memory: 1000Mi
      # Consider to increase ephemeral-storage requests in order to avoid pod eviction due to huge images
      #               https://github.com/kubescape/kubescape/issues/389
      ephemeral-storage: 5Gi
    limits:
      cpu: 1500m
      memory: 5000Mi
      ephemeral-storage: 10Gi

  # PVC-backed temp directory for image layer extraction.
  # Prevents the "large image → emptyDir fills RAM → OOMKill" failure mode.
  tmpDirPersistence:
    enabled: false
    storageClassName: "longhorn"
    accessModes:
      - ReadWriteOnce
    size: 50Gi
    annotations: {}

  # SBOM scanner sidecar — isolates Syft memory usage in a separate container
  sbomScanner:
    enabled: false

storage:
  name: "storage"
  resources:
    requests:
      cpu: 100m
      memory: 400Mi
    limits:
      cpu: 1500m
      memory: 1500Mi

nodeAgent:
  name: node-agent

  config:
    maxLearningPeriod: 24h # duration string
    learningPeriod: 2m # duration string
    updatePeriod: 10m # duration string
    nodeProfileInterval: 10m # duration string
    networkStreamingInterval: 2m # duration string
    prometheusExporter: disable
    alertManagerExporterUrls:
      - http://kps-alertmanager.monitoring:9093
    skipKernelVersionCheck: false
    malwareScanAllFiles: false
    hostMalwareSensor: disable
    hostNetworkSensor: enable # testing
    hostSensor:
      enabled: true
      interval: 5m # duration string

  serviceMonitor:
    enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 180Mi
    limits:
      cpu: 500m
      memory: 2000Mi

  sbomScanner:
    enabled: false
    name: sbom-scanner
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 4Gi
