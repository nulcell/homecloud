# Tetragon (cilium/tetragon 1.7.0) — eBPF runtime observability.
# https://github.com/cilium/tetragon/tree/main/install/kubernetes/tetragon
#
# Default events (process_exec, process_exit) ship out of the box. Custom
# detection rules go in TracingPolicy CRs (deploy here as additional manifests
# once the baseline is stable).

tetragon:
  enableProcessCred: true
  enableProcessNs: true
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }
  # JSON event stream goes to stdout; tail with `kubectl -n tetragon logs ds/tetragon -c export-stdout`.
  exportFilename: ""
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

extraHostPathMounts:
  - name: sys-kernel-tracing
    mountPath: /sys/kernel/tracing

tetragonOperator:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

export:
  stdout:
    enabled: true
