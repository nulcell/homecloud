serviceMonitor:
  enabled: true
  honorLabels: true

operator:
  replicas: 1
  vulnerabilityScannerEnabled: true
  sbomGenerationEnabled: true
  clusterSbomCacheEnabled: true
  exposedSecretScannerEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  infraAssessmentScannerEnabled: true
  clusterComplianceEnabled: true
  scanJobsConcurrentLimit: 2

trivyOperator:
  # Per-CVE-ID metrics cause high Prometheus cardinality — intentionally off.
  metricsVulnIdEnabled: false

# Talos Linux has an immutable root filesystem — containerd cannot mkdir /etc/systemd
# on the host to set up the bind mount. Replace with emptyDir so the pod starts;
# the scanner will simply find no systemd units (accurate for Talos).
nodeCollector:
  volumes:
    - name: var-lib-etcd
      hostPath:
        path: /var/lib/etcd
    - name: var-lib-kubelet
      hostPath:
        path: /var/lib/kubelet
    - name: var-lib-kube-scheduler
      hostPath:
        path: /var/lib/kube-scheduler
    - name: var-lib-kube-controller-manager
      hostPath:
        path: /var/lib/kube-controller-manager
    - name: etc-systemd
      emptyDir: {}
    - name: lib-systemd
      hostPath:
        path: /lib/systemd
    - name: etc-kubernetes
      hostPath:
        path: /etc/kubernetes
    - name: etc-cni-netd
      hostPath:
        path: /etc/cni/net.d/
