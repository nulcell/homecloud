apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: speedtest-tracker

resources:
  - namespace.yaml
  - postgres-cluster.yaml
  - pvc.yaml
  - speedtest-external-secrets.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - servicemonitor.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: speedtest-tracker
        namespace: speedtest-tracker
      spec:
        template:
          spec:
            containers:
              - name: speedtest-tracker
                image: lscr.io/linuxserver/speedtest-tracker:1.14.3
    target:
      kind: Deployment
      name: speedtest-tracker
      namespace: speedtest-tracker
