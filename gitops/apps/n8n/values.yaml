# Overrides for the n8n chart at charts/n8n/.
# Everything not listed here keeps the chart's default value.

# imagePullSecrets:
#   - name: dockerhub-credentials

n8n:
  replicaCount: 1
  timezone: Europe/Amsterdam

gateway:
  enabled: false # managed separately by cloudflared chart
  parentRef:
    name: external
    namespace: gateway
  hostname: n8n.nulcell.com

# Reference to the SOPS-encrypted Secret in this folder (n8n-runner-auth.enc.yaml).
taskRunner:
  authToken:
    secretName: n8n-runner-auth
    secretKey: auth-token

scaling:
  enabled: true
  database:
    host: n8n-postgres-rw # CNPG read-write service
    port: 5432
    name: n8n
    existingSecret: n8n-postgres-app # auto-created by CNPG
    secretUsernameKey: username
    secretPasswordKey: password
  redis:
    host: n8n-redis
    port: 6379
  # Encryption key is SOPS-encrypted at n8n-encryption-key.enc.yaml
  # and wired into secret-generator.yaml.
  encryptionKey:
    existingSecret: n8n-encryption-key
    secretKey: N8N_ENCRYPTION_KEY
  worker:
    concurrency: 10
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi
    autoscaling:
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
