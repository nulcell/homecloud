# n8n in queue mode: `n8n` (UI, API, webhooks) enqueues to Redis, `worker` executes with a task-runner
# sidecar. All state is in Postgres; every volume here is an emptyDir. Release name `n8n` keeps the old
# object names (Service n8n, Deployments n8n / n8n-worker, Cluster n8n-postgres, StatefulSet n8n-redis).
#
# Image tags: bump `n8nio/n8n` and `n8nio/runners` together (Renovate groups them).

defaults:
  externalSecret:
    store: {kind: ClusterSecretStore, name: onepassword}

configMaps:
  env:
    data:
      NODE_ENV: production
      N8N_PORT: "5678"
      N8N_DEFAULT_LOCALE: en
      GENERIC_TIMEZONE: Europe/Amsterdam
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: "30"
      N8N_HOST: workflow.nulcell.com
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://workflow.nulcell.com/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_METRICS: "true"
      N8N_WORKFLOW_HISTORY_PRUNE_TIME: "336"
      # The heap is pinned rather than trusting cgroup auto-sizing, which left the UI process with too
      # little headroom and crashed it with "JavaScript heap out of memory".
      NODE_OPTIONS: --max-old-space-size=768
      # The npm-install init container puts community nodes under /home/node/.n8n; without this,
      # Code-node require() cannot find them.
      NODE_PATH: /home/node/.n8n/node_modules
      N8N_RUNNERS_INSECURE_MODE: "true"
      # Postgres: the CNPG cluster below; the password comes from its generated secret.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: "{{ .Release.Name }}-postgres-rw"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      # Queue mode.
      EXECUTIONS_MODE: queue
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      QUEUE_BULL_REDIS_HOST: "{{ .Release.Name }}-redis"
      QUEUE_BULL_REDIS_PORT: "6379"
      # Code nodes run in the worker's task-runner sidecar over localhost.
      N8N_RUNNERS_MODE: external
      N8N_NATIVE_PYTHON_RUNNER: "true"
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 127.0.0.1
      N8N_RUNNERS_BROKER_PORT: "5679"
      N8N_RUNNERS_EXTERNAL_ALLOW: "*"
      N8N_RUNNERS_STDLIB_ALLOW: "*"
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_RUNNERS_HEARTBEAT_INTERVAL: "30"
  runners:
    data:
      GENERIC_TIMEZONE: Europe/Amsterdam
      N8N_RUNNERS_TASK_BROKER_URI: http://127.0.0.1:5679
      N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT: "5680"
      N8N_RUNNERS_LAUNCHER_LOG_LEVEL: info
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
      N8N_RUNNERS_EXTERNAL_ALLOW: "*"
      N8N_RUNNERS_STDLIB_ALLOW: "*"
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      NODE_OPTIONS: --max-semi-space-size=16 --max-old-space-size=300

workloads:
  # Named like the release, so its Service is `n8n`.
  n8n:
    imagePullSecrets: &pull [dockerhub-credentials]
    podSecurityContext: &psc
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    replicas: 1
    pdb: {enabled: true, maxUnavailable: 1}
    initContainers:
      npm-install: &npm-install
        image: {repository: node, tag: 20-alpine}
        command: [/bin/sh, -c]
        # Community nodes to install; emptyDirs start empty, so this runs on every pod start.
        args: ['npm install --loglevel info --no-save --ignore-scripts $COMMUNITY_PACKAGES --prefix /nodesdata/nodes']
        env:
          COMMUNITY_PACKAGES: "@emilfrom/n8n-nodes-actual-budget@2.4.0"
          NPM_CONFIG_CACHE: /npmdata/.npm-cache
        securityContext:
          readOnlyRootFilesystem: false
    containers:
      n8n:
        image: {repository: n8nio/n8n, tag: 2.40.5}
        envFrom:
          - configMap: env
          - secret: encryption-key
        env:
          N8N_EDITOR_BASE_URL: https://workflow.nulcell.com/
          NPM_CONFIG_CACHE: /home/node/.cache/npm
          DB_POSTGRESDB_PASSWORD:
            valueFrom:
              secretKeyRef: {name: "{{ .Release.Name }}-postgres-app", key: password}
          N8N_RUNNERS_AUTH_TOKEN:
            valueFrom:
              secretKeyRef: {name: "{{ .Release.Name }}-runner-auth", key: auth-token}
        ports:
          http: 5678
        probes:
          liveness:
            httpGet: {path: /healthz, port: http}
          readiness:
            httpGet: {path: /healthz/readiness, port: http}
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {memory: 1Gi}
        securityContext:
          readOnlyRootFilesystem: false
    services:
      n8n:
        ports:
          http: 5678
        serviceMonitor:
          enabled: true
          endpoints:
            - port: http
              path: /metrics
              interval: 30s
              scrapeTimeout: 10s
              relabelings:
                - {action: replace, sourceLabels: [__meta_kubernetes_pod_name], targetLabel: pod_name}
                - {action: replace, replacement: main, targetLabel: role}
    networkPolicy:
      ingress:
        - gateway
        - prometheus
      egress:
        - {datastore: postgres}
        - {datastore: redis}
        - world

  worker:
    imagePullSecrets: *pull
    podSecurityContext: *psc
    pdb: {enabled: true, maxUnavailable: 1}
    autoscaling:
      enabled: true
      type: hpa
      minReplicas: 1
      maxReplicas: 10
      metrics:
        - {type: Resource, resource: {name: memory, target: {type: Utilization, averageUtilization: 80}}}
        - {type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}}
    initContainers:
      npm-install: *npm-install
    containers:
      worker:
        image: {repository: n8nio/n8n, tag: 2.40.5}
        command: [n8n]
        args: [worker, --concurrency=10]
        envFrom:
          - configMap: env
          - secret: encryption-key
        env:
          N8N_DISABLE_UI: "true"
          QUEUE_HEALTH_CHECK_ACTIVE: "true"
          N8N_CONCURRENCY_PRODUCTION_LIMIT: "10"
          DB_POSTGRESDB_PASSWORD:
            valueFrom:
              secretKeyRef: {name: "{{ .Release.Name }}-postgres-app", key: password}
          N8N_RUNNERS_AUTH_TOKEN:
            valueFrom:
              secretKeyRef: {name: "{{ .Release.Name }}-runner-auth", key: auth-token}
        ports:
          http: 5678
        probes:
          liveness:
            httpGet: {path: /healthz, port: http}
          readiness:
            httpGet: {path: /healthz/readiness, port: http}
        resources:
          requests: {cpu: 500m, memory: 512Mi}
          limits: {cpu: 2000m, memory: 1Gi}
        securityContext:
          readOnlyRootFilesystem: false
      # Executes Code nodes for this worker; shares its packages and talks to its broker on localhost.
      runners:
        image: {repository: n8nio/runners, tag: 2.40.5}
        command: [/usr/local/bin/task-runner-launcher]
        args: [javascript, python]
        envFrom:
          - configMap: runners
        env:
          NODE_FUNCTION_ALLOW_BUILTIN: "*"
          NODE_FUNCTION_ALLOW_EXTERNAL: "*"
          N8N_REINSTALL_MISSING_PACKAGES: "true"
          N8N_RUNNERS_AUTH_TOKEN:
            valueFrom:
              secretKeyRef: {name: "{{ .Release.Name }}-runner-auth", key: auth-token}
        ports:
          runner-health: 5680
        probes:
          liveness:
            httpGet: {path: /healthz, port: runner-health}
          readiness:
            httpGet: {path: /healthz, port: runner-health}
        resources:
          requests: {cpu: 100m, memory: 32Mi}
          limits: {cpu: 2000m, memory: 512Mi}
        securityContext:
          readOnlyRootFilesystem: false
    networkPolicy:
      ingress:
        - prometheus
      egress:
        - {datastore: postgres}
        - {datastore: redis}
        - world

# One emptyDir per role, mounted where the old chart mounted it.
persistence:
  tmp:
    type: emptyDir
    advancedMounts:
      n8n: {npm-install: [{path: /tmp}], n8n: [{path: /tmp}]}
      worker: {npm-install: [{path: /tmp}], worker: [{path: /tmp}], runners: [{path: /tmp}]}
  cache:
    type: emptyDir
    advancedMounts:
      n8n: {n8n: [{path: /home/node/.cache}]}
      worker: {worker: [{path: /home/node/.cache}], runners: [{path: /home/node/.cache}]}
  npm-home:
    type: emptyDir
    advancedMounts:
      n8n: {npm-install: [{path: /home/node/.npm}], n8n: [{path: /home/node/.npm}]}
      worker: {npm-install: [{path: /home/node/.npm}]}
  python-packages:
    type: emptyDir
    advancedMounts:
      worker: {runners: [{path: /home/node/.python-packages}]}
  node-modules:
    type: emptyDir
    advancedMounts:
      n8n: {npm-install: [{path: /npmdata}], n8n: [{path: /home/node/.n8n}]}
      worker: {npm-install: [{path: /npmdata}], worker: [{path: /home/node/.n8n}], runners: [{path: /home/node/.n8n}]}
  community-node-modules:
    type: emptyDir
    advancedMounts:
      n8n: {npm-install: [{path: /nodesdata/nodes}], n8n: [{path: /home/node/.n8n/nodes}]}
      worker: {npm-install: [{path: /nodesdata/nodes}], worker: [{path: /home/node/.n8n/nodes}], runners: [{path: /home/node/.n8n/nodes}]}

datastores:
  # CNPG cluster `n8n-postgres`, adopted as it is (same database, owner, image and size).
  postgres:
    engine: postgres
    type: cnpg
    database: n8n
    owner: n8n
    image: {repository: ghcr.io/cloudnative-pg/postgresql, tag: "18.4"}
    storage: {size: 10Gi}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
    monitoring: true
    # The barman sidecar uploads to S3; datastore policies are default-deny.
    networkPolicy:
      egress:
        - {fqdn: s3.eu-central-1.amazonaws.com, port: 443}
        - {fqdn: "*.s3.eu-central-1.amazonaws.com", port: 443}
        - {fqdn: s3.amazonaws.com, port: 443}
        - {fqdn: "*.s3.amazonaws.com", port: 443}
    cluster:
      inheritedMetadata:
        labels:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/backup: enabled
      plugins:
        - name: barman-cloud.cloudnative-pg.io
          isWALArchiver: true
          parameters: {barmanObjectName: n8n-postgres}
  # Queue only; nothing here needs to survive a restart. Real Redis, not the chart's Valkey default:
  # the existing volume holds an RDB written by Redis 7.4 (format 12), which Valkey 8 cannot load.
  redis:
    engine: redis
    type: standalone
    image: {repository: redis, tag: 7-alpine}
    args: [redis-server, --save, "60 1", --loglevel, warning]
    storage: {size: 1Gi, storageClass: longhorn}
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 200m, memory: 256Mi}

routes:
  n8n:
    name: n8n
    # cloudflared reaches n8n (and its public webhooks) through the internal gateway.
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: internal
        namespace: gateway
        sectionName: https-internal
    hostnames: [workflow.internal.nulcell.com]
    rules: [{matches: [{path: {type: PathPrefix, value: /}}], backends: [{workload: n8n, service: n8n, port: http}]}]

# Secrets `n8n-encryption-key` and `n8n-runner-auth`, from 1Password homecloud-k8s/n8n-secrets.
externalSecrets:
  encryption-key:
    data:
      N8N_ENCRYPTION_KEY: fpwjapmya4pjywvazjmehxh57e/n8n-encryption-key
  runner-auth:
    data:
      auth-token: fpwjapmya4pjywvazjmehxh57e/n8n-runner-auth
