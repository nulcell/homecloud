# Overrides for the community-charts n8n chart.
# https://github.com/community-charts/helm-charts/tree/main/charts/n8n
# https://community-charts.github.io/docs/charts/n8n/usage
# Everything not listed here keeps the chart's default value.

imagePullSecrets:
  - name: dockerhub-credentials

timezone: Europe/Amsterdam

main:
  count: 1
  editorBaseUrl: "https://workflow.nulcell.com/"
  # 256Mi/512Mi (carried over from the old chart's stated defaults) crashed in
  # practice: "JavaScript heap out of memory" right around ~256MB. Modern
  # Node auto-sizes its default V8 old-space heap to roughly half the
  # container's cgroup memory limit when not told otherwise, which left main
  # (UI + API + DB + webhooks) with far too little headroom. Sized up and
  # pinned NODE_OPTIONS explicitly below instead of relying on that
  # auto-detection.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  # N8N_HOST/N8N_PROTOCOL aren't first-class chart values (only editorBaseUrl
  # and webhook.url are) - set explicitly so generated links match the old
  # custom chart's behavior instead of falling back to localhost/http.
  # NODE_OPTIONS caps the V8 heap at 768Mi, leaving ~256Mi of the 1Gi limit
  # for non-heap/native memory instead of trusting cgroup auto-detection.
  # NODE_PATH: the npm-install init container installs `nodes.external.packages`
  # with `--prefix /npmdata`, and that volume mounts at /home/node/.n8n - which
  # is not on Node's resolution path from the /home/node workdir. Without this,
  # Code-node `require()` fails with "module not available" even though the
  # package is present and allowlisted.
  extraEnvVars:
    N8N_HOST: workflow.nulcell.com
    N8N_PROTOCOL: https
    NODE_OPTIONS: "--max-old-space-size=768"
    NODE_PATH: /home/node/.n8n/node_modules
    N8N_RUNNERS_INSECURE_MODE: true
    NODE_FUNCTION_ALLOW_BUILTIN: "*"
    NODE_FUNCTION_ALLOW_EXTERNAL: "*"
    N8N_REINSTALL_MISSING_PACKAGES: true
    N8N_RUNNERS_JS_ENV_NODE_FUNCTION_ALLOW_EXTERNAL: "*"
    N8N_RUNNERS_JS_EXTERNAL_ALLOW: "*"

webhook:
  url: "https://workflow.nulcell.com/"

# -- Node configurations for built-in and external npm packages
nodes:
  # -- Enable built-in node functions (e.g., HTTP Request, Code Node, etc.)
  builtin:
    # -- Enable built-in modules for the Code node
    enabled: true
    # -- List of built-in Node.js modules to allow in the Code node (e.g., crypto, fs).
    # Empty means allow all: the chart renders a quoted "*" for the empty case.
    # Listing "*" here instead breaks the render - the chart joins this list
    # unquoted, so a bare `value: *` is parsed as a YAML alias.
    modules: []
  # -- External npm packages to install and allow in the Code node
  external:
    # -- Allow all external npm packages.
    # Must stay false. The task runner pre-requires each allowlisted package
    # *before* freezing Error/Object prototypes, but only when the allowlist is
    # an explicit list - `*` skips that step, so any package that subclasses
    # Error at load time (@actual-app/api) dies with "Cannot assign to read
    # only property 'constructor' of object 'Error'".
    allowAll: true
    # -- Whether to reinstall missing packages. For more information, see https://docs.n8n.io/integrations/community-nodes/troubleshooting/#error-missing-packages
    reinstallMissingPackages: true
    # -- List of npm package names and versions (e.g., "package-name@1.0.0")
    packages: #[]
      - "@actual-app/api@26.8.1"
      # - "moment@2.29.4"
      # - "lodash@4.17.21"
  # -- Python Code node configuration. Requires n8n 1.111.0+ and taskRunners.mode: external.
  python:
    # -- Enable Python code execution in the Code node via external task runners.
    enabled: true
    # -- Built-in Python module access for the Code node.
    builtin:
      # -- Python standard library modules allowed in Code nodes. Use ['*'] to allow all.
      modules: #[]
        - "*"
    # -- External Python package access for the Code node.
    external:
      # -- Allow all external Python packages in Code nodes. When true, sets N8N_RUNNERS_EXTERNAL_ALLOW=* regardless of packages list.
      allowAll: true
      # -- Python packages to install via uv before starting the runner (e.g. ["pandas", "numpy"]). Each listed package is also automatically allowed as an external package in Code nodes.
      packages: []
        # - pandas
        # - numpy

db:
  type: postgresdb

# External PostgreSQL - CNPG cluster `n8n-postgres` (postgres-cluster.yaml).
# CNPG auto-creates a secret named <cluster>-app with keys: username, password.
externalPostgresql:
  host: n8n-postgres-rw # CNPG read-write service
  port: 5432
  username: n8n # matches spec.bootstrap.initdb.owner in postgres-cluster.yaml
  database: n8n
  existingSecret: n8n-postgres-app
  existingSecretPasswordKey: password

# External Redis (unauthenticated) - see redis.yaml.
externalRedis:
  host: n8n-redis
  port: 6379

# 1Password-backed ExternalSecret (n8n-external-secrets.yaml), unchanged from
# before the migration.
existingEncryptionKeySecret: n8n-encryption-key

worker:
  # options: regular (main node executes), queue (separate worker pods)
  mode: queue
  concurrency: 10
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
  # Same NODE_OPTIONS reasoning as main: pin the V8 heap explicitly (768Mi of
  # the 1Gi limit) rather than relying on cgroup-based auto-sizing.
  extraEnvVars:
    N8N_HOST: workflow.nulcell.com
    N8N_PROTOCOL: https
    NODE_OPTIONS: "--max-old-space-size=768"
    NODE_PATH: /home/node/.n8n/node_modules
    N8N_RUNNERS_INSECURE_MODE: true
    NODE_FUNCTION_ALLOW_BUILTIN: "*"
    NODE_FUNCTION_ALLOW_EXTERNAL: "*"
    N8N_REINSTALL_MISSING_PACKAGES: true
    N8N_RUNNERS_JS_ENV_NODE_FUNCTION_ALLOW_EXTERNAL: "*"
    N8N_RUNNERS_JS_EXTERNAL_ALLOW: "*"
  # │     Environment:                                                                                                                                                                                            │
  # │       N8N_HIRING_BANNER_ENABLED:              false                                                                                                                                                         │
  # │       NODE_ENV:                               production                                                                                                                                                    │
  # │       N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:  true                                                                                                                                                          │
  # │       N8N_PORT:                               5678                                                                                                                                                          │
  # │       N8N_DEFAULT_LOCALE:                     en                                                                                                                                                            │
  # │       GENERIC_TIMEZONE:                       Europe/Amsterdam                                                                                                                                              │
  # │       N8N_GRACEFUL_SHUTDOWN_TIMEOUT:          30                                                                                                                                                            │
  # │       NPM_CONFIG_CACHE:                       /home/node/.cache/npm                                                                                                                                         │
  # │       N8N_EDITOR_BASE_URL:                    https://workflow.nulcell.com/                                                                                                                                 │
  # │       DB_POSTGRESDB_USER:                     n8n                                                                                                                                                           │
  # │       DB_POSTGRESDB_PASSWORD:                 <set to the key 'password' in secret 'n8n-postgres-app'>  Optional: true                                                                                      │
  # │       WEBHOOK_URL:                            https://workflow.nulcell.com/                                                                                                                                 │
  # │       NODE_FUNCTION_ALLOW_BUILTIN:            *                                                                                                                                                             │
  # │       NODE_FUNCTION_ALLOW_EXTERNAL:           @actual-app/api                                                                                                                                               │
  # │       N8N_REINSTALL_MISSING_PACKAGES:         true                                                                                                                                                          │
  # │       N8N_HOST:                               workflow.nulcell.com                                                                                                                                          │
  # │       N8N_PROTOCOL:                           https                                                                                                                                                         │
  # │       N8N_RUNNERS_INSECURE_MODE:              true                                                                                                                                                          │
  # │       NODE_OPTIONS:                           --max-old-space-size=768                                                                                                                                      │
  # │       NODE_PATH:                              /home/node/.n8n/node_modules

  # The chart's npm-install init container hardcodes `--ignore-scripts` (no
  # value overrides it), so better-sqlite3 - @actual-app/api's only native
  # dep - never gets its binding and Code-node require() dies with "Could not
  # locate the bindings file". Rebuild it afterwards; chart init containers
  # render before this list, so ordering holds.
  # node:24-alpine is not arbitrary: the binding is ABI- and libc-specific and
  # must match the n8n runtime (n8nio/n8n:2.34.6 = Node 24 / Alpine musl).
  # Bump this alongside any n8n major that changes Node. No compiler here -
  # prebuild-install pulls the published node-v137-linuxmusl-x64 prebuild.
  initContainers:
    - name: rebuild-native
      image: node:24-alpine
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      env:
        - name: NPM_CONFIG_CACHE
          value: /npmdata/.npm-cache
      command: ["/bin/sh", "-c"]
      args:
        - |
          [ -f /npmdata/node_modules/better-sqlite3/build/Release/better_sqlite3.node ] ||
            npm rebuild better-sqlite3 --prefix /npmdata --foreground-scripts
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: npm-home
          mountPath: /home/node/.npm
        - name: node-modules
          mountPath: /npmdata
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi

# Isolate Code-node execution in a task-runner sidecar, matching the previous
# custom chart's architecture. In worker.mode=queue this sidecar attaches only
# to worker pods (not main, which never executes workflow code directly -
# OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS is on by default in queue mode). Note
# this does change the scaling shape versus before: previously task-runner was
# one standalone deployment; now one sidecar comes and goes with every worker
# replica (1-10, per autoscaling above) instead of a fixed single instance.
taskRunners:
  mode: external # internal or external
  external:
    # Shared token between n8n and its own task-runner sidecar - purely
    # internal, same-pod/localhost auth, never exposed externally, so it
    # doesn't need real secret management. Fixed here (rather than left
    # unset) because the chart has no `lookup`-based persistence for its
    # auto-generated default: with no fixed value, it re-randomizes on every
    # render, which would churn the Secret (and roll pods) on every ArgoCD
    # sync for no reason.
    mainNodeAuthToken: "n8n-task-runner-shared-secret"
    workerNodeAuthToken: "n8n-task-runner-shared-secret"

# -- The service monitor configuration. Please refer to the following link for more information: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md
serviceMonitor:
  # -- When set true then use a ServiceMonitor to configure scraping
  enabled: true
