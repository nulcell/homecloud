apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n8n

# Roll workloads when their ExternalSecret-backed Secrets change.
commonAnnotations:
  reloader.stakater.com/auto: "true"

helmCharts:
  - name: app-template
    repo: oci://ghcr.io/nulcell/charts
    version: 0.3.4
    releaseName: n8n
    namespace: n8n
    valuesFile: values.yaml
    includeCRDs: false

resources:
  - namespace.yaml
  - postgres-backup.yaml
  - podmonitor.yaml
