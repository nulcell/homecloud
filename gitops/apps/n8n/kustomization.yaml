apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n8n

# Chart lives at charts/n8n/, referenced via chartHome.
# Requires the CMP plugin to be invoked with --load-restrictor=LoadRestrictionsNone
# (set in cluster/bootstrap/argocd-values.yaml) so kustomize can read files above this dir.
helmGlobals:
  chartHome: ../../../charts

helmCharts:
  - name: n8n
    releaseName: n8n
    namespace: n8n
    valuesFile: values.yaml
    includeCRDs: false

resources:
  - namespace.yaml

generators:
  - secret-generator.yaml
