workloads:
  mealie:
    replicas: 1
    spec:
      strategy:
        type: Recreate
    imagePullSecrets: [dockerhub-credentials]
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    containers:
      mealie:
        image:
          repository: ghcr.io/mealie-recipes/mealie
          tag: v3.28.0
        # The image drops root itself; started non-root it keeps the uid it got,
        # and /app/data (below) is writable through fsGroup.
        securityContext:
          readOnlyRootFilesystem: false
        ports:
          http: 9000
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Amsterdam
          # Mealie builds notification links and the OIDC callback from this.
          BASE_URL: https://recipes.nulcell.com
          API_PORT: "9000"
          API_DOCS: "false"
          LOG_LEVEL: info
          DEFAULT_GROUP: Home
          DEFAULT_HOUSEHOLD: Family
          DAILY_SCHEDULE_TIME: "23:45"
          # Accounts come from Authentik via OIDC, or from an admin invite.
          ALLOW_SIGNUP: "false"
          ALLOW_PASSWORD_LOGIN: "false"
          TOKEN_TIME: "48"
          UVICORN_WORKERS: "1"
          SECURITY_MAX_LOGIN_ATTEMPTS: "5"
          SECURITY_USER_LOCKOUT_TIME: "24"
          ALLOWED_IFRAME_HOSTS: ""
          DB_ENGINE: postgres
          POSTGRES_SERVER: "{{ .Release.Name }}-postgres-rw"
          POSTGRES_PORT: "5432"
          POSTGRES_DB: mealie
          POSTGRES_USER:
            valueFrom:
              secretKeyRef: {name: "{{ .Release.Name }}-postgres-app", key: username}
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef: {name: "{{ .Release.Name }}-postgres-app", key: password}
          # Authentik OAuth2 provider "mealie", application slug "mealie", with the
          # "Application Entitlements" scope mapping and redirect URIs
          # https://recipes.nulcell.com/login and /login?direct=1.
          # https://integrations.goauthentik.io/documentation/mealie/
          OIDC_AUTH_ENABLED: "true"
          OIDC_PROVIDER_NAME: Authentik
          OIDC_CONFIGURATION_URL: https://auth.nulcell.com/application/o/mealie/.well-known/openid-configuration
          OIDC_CLIENT_ID: Wfg1gOEoYaDbFr6CgaQjSwODeQe5t53ZZkzcWP4P
          OIDC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef: {name: mealie-secrets, key: oidc-client-secret}
          OIDC_SIGNUP_ENABLED: "true"
          # Authentik doesn't assert email_verified.
          OIDC_REQUIRES_EMAIL_VERIFICATION: "false"
          # Authentik exposes group membership as application entitlements.
          OIDC_GROUPS_CLAIM: entitlements
          OIDC_USER_GROUP: mealie-users
          OIDC_ADMIN_GROUP: mealie-admins
          OIDC_AUTO_REDIRECT: "true"
          OIDC_REMEMBER_ME: "true"
          OIDC_USER_CLAIM: email
          OIDC_NAME_CLAIM: name
        probes:
          startup:
            httpGet: {path: /api/app/about, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          liveness:
            httpGet: {path: /api/app/about, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readiness:
            httpGet: {path: /api/app/about, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: 1000m, memory: 1Gi}
    services:
      mealie:
        ports:
          http: 9000
    networkPolicy:
      ingress:
        # No HTTPRoute: cloudflared forwards straight to the Service.
        - {namespace: cloudflared, port: http}
        # Unverified whether homarr widgets use the internal Service URL -
        # allowed for now, tighten once confirmed unused.
        - {namespace: homarr, port: http}
      egress:
        - {datastore: postgres}
        # Recipe scraping and OIDC discovery reach arbitrary hosts.
        - world

# RWX so a Recreate/rollout never waits on a volume detach.
persistence:
  data:
    size: 1Gi
    storageClass: longhorn
    accessMode: ReadWriteMany
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/backup: enabled
    advancedMounts:
      mealie:
        mealie: [{path: /app/data}]

datastores:
  postgres:
    engine: postgres
    type: cnpg
    image: {repository: ghcr.io/cloudnative-pg/postgresql, tag: "18.6"}
    storage: {size: 10Gi}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
    monitoring: true
    # The barman sidecar uploads to S3; datastore policies are default-deny.
    networkPolicy:
      egress:
        - {fqdn: s3.eu-central-1.amazonaws.com, port: 443}
        - {fqdn: "*.s3.eu-central-1.amazonaws.com", port: 443}
        - {fqdn: s3.amazonaws.com, port: 443}
        - {fqdn: "*.s3.amazonaws.com", port: 443}
    cluster:
      inheritedMetadata:
        labels:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/backup: enabled
      plugins:
        - name: barman-cloud.cloudnative-pg.io
          isWALArchiver: true
          parameters: { barmanObjectName: mealie-postgres }

externalSecrets:
  secrets:
    store: {kind: ClusterSecretStore, name: onepassword}
    data:
      # homecloud-k8s/mealie-secrets/oidc-client-secret - client secret from
      # Authentik's mealie OAuth2 provider.
      oidc-client-secret: h44pyfwssyswg6l2ngg7yj5v3m/oidc-client-secret
