apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: mealie-postgres
spec:
  retentionPolicy: 30d
  instanceSidecarConfiguration:
    env:
      - {name: AWS_DEFAULT_REGION, value: eu-central-1} # boto3 ignores AWS_REGION; without it requests go to the global endpoint
  configuration:
    destinationPath: s3://nulcell-homecloud-backup/cnpg/mealie-postgres
    s3Credentials:
      accessKeyId: {name: backup-s3, key: AWS_ACCESS_KEY_ID}
      secretAccessKey: {name: backup-s3, key: AWS_SECRET_ACCESS_KEY}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mealie-postgres
spec:
  schedule: "0 15 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  cluster:
    name: mealie-postgres
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
