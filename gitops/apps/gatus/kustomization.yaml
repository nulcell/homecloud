apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gatus

helmCharts:
  - name: app-template
    repo: oci://ghcr.io/nulcell/charts
    version: 0.3.3
    releaseName: gatus
    namespace: gatus
    valuesFile: values.yaml
    includeCRDs: false

resources:
  - namespace.yaml
  - postgres-backup.yaml

configMapGenerator:
  - name: gatus-config
    files:
      - config.yaml
  # Upstream dashboard (TwiN/gatus .examples/docker-compose-grafana-prometheus),
  # picked up by Grafana's sidecar via the label.
  - name: gatus-grafana-dashboard
    files:
      - gatus.json=grafana-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
