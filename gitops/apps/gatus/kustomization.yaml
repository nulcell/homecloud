apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gatus

helmCharts:
  - name: app-template
    repo: oci://ghcr.io/nulcell/charts
    version: 0.3.3
    releaseName: gatus
    namespace: gatus
    valuesFile: values.yaml
    includeCRDs: false

resources:
  - namespace.yaml
  - postgres-backup.yaml

# The chart's datastore policy is default-deny with no way out; the barman sidecar needs S3.
patches:
  - target: {kind: CiliumNetworkPolicy, name: gatus-postgres}
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          toFQDNs:
            - matchName: s3.eu-central-1.amazonaws.com
            - matchPattern: "*.s3.eu-central-1.amazonaws.com"
            - matchName: s3.amazonaws.com
            - matchPattern: "*.s3.amazonaws.com"
          toPorts:
            - ports: [{port: "443", protocol: TCP}]

configMapGenerator:
  - name: gatus-config
    files:
      - config.yaml
  # Upstream dashboard (TwiN/gatus .examples/docker-compose-grafana-prometheus),
  # picked up by Grafana's sidecar via the label.
  - name: gatus-grafana-dashboard
    files:
      - gatus.json=grafana-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
