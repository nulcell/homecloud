workloads:
  gatus:
    # Single replica: Gatus has no leader election, so extra replicas would
    # duplicate every check and alert. History lives in Postgres.
    replicas: 1
    containers:
      gatus:
        image:
          repository: ghcr.io/twin/gatus
          tag: v5.37.0
        ports:
          http: 8080
        env:
          GATUS_CONFIG_PATH: /config/config.yaml
          POSTGRES_URI:
            valueFrom:
              secretKeyRef: {name: gatus-postgres-app, key: uri}
        probes:
          liveness:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
          readiness:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 256Mi}
    services:
      gatus:
        ports:
          http: 80
    networkPolicy:
      ingress:
        - gateway
      egress:
        - {datastore: postgres}
        # Checks hit public hostnames (Cloudflare or gateway LB IPs).
        - world

datastores:
  postgres:
    engine: postgres
    type: cnpg
    image: {repository: ghcr.io/cloudnative-pg/postgresql, tag: "18.4"}
    storage: {size: 2Gi}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    monitoring: true

persistence:
  config:
    type: configMap
    name: config
    globalMounts:
      - path: /config
        readOnly: true

# Mirrors the Uptime Kuma monitors (paused ones omitted); interval defaults to 1m.
# Pods roll on change.
configMaps:
  config:
    data:
      config.yaml: |
        storage:
          type: postgres
          path: ${POSTGRES_URI}
        ui:
          title: Hosted Services
          header: Hosted Services
        endpoints:
          - {group: Internal, name: ArgoCD, url: https://argocd.nulcell.com/healthz, conditions: ["[STATUS] < 300"]}
          - {group: Internal, name: Grafana, url: https://grafana.nulcell.com/api/health, conditions: ["[STATUS] < 300"]}
          - {group: Internal, name: Headlamp, url: https://headlamp.nulcell.com/c/main/, conditions: ["[STATUS] < 300"]}
          - {group: Internal, name: Longhorn, url: https://longhorn.nulcell.com/, conditions: ["[STATUS] < 300"]}
          - {group: Apps, name: Portfolio Site, url: https://nulcell.com/health, conditions: ["[STATUS] < 300"]}
          - {group: Apps, name: Meridian Demo, url: https://meridian-demo.nulcell.com/api/v1/info, interval: 3m, conditions: ["[STATUS] < 300"]}
          - {group: Apps, name: Authentik, url: https://auth.nulcell.com/, conditions: ["[STATUS] < 300"]}
          - {group: Apps, name: Actual Budget, url: https://budget.nulcell.com, conditions: ["[STATUS] < 300"]}
          - {group: Apps, name: n8n, url: https://workflow.nulcell.com/healthz/readiness, conditions: ["[STATUS] < 300"]}
          - {group: Apps, name: Mealie, url: https://recipes.nulcell.com/api/app/about, conditions: ["[STATUS] < 300"]}
          - {group: Media, name: Jellyfin, url: https://jellyfin.nulcell.com/health, conditions: ["[STATUS] < 300"]}
          - {group: Media, name: Seerr, url: https://seerr.nulcell.com/, conditions: ["[STATUS] < 300"]}
          - {group: Media, name: Radarr, url: https://radarr.nulcell.com/ping, conditions: ["[STATUS] < 300"]}
          - {group: Media, name: Sonarr, url: https://sonarr.nulcell.com/ping, conditions: ["[STATUS] < 300"]}
          - {group: Media, name: Prowlarr, url: https://prowlarr.nulcell.com/ping, conditions: ["[STATUS] < 300"]}
          - {group: Media, name: qBittorrent, url: https://qbittorrent.nulcell.com/, conditions: ["[STATUS] < 300"]}

# Origin route; status.nulcell.com is published by cloudflared with this Host header.
routes:
  gatus:
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: internal
        namespace: gateway
        sectionName: https-internal
    hostnames: [status.internal.nulcell.com]
    rules:
      - matches: [{path: {type: PathPrefix, value: /}}]
        backends: [{workload: gatus, service: gatus, port: http}]
