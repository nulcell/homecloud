workloads:
  gatus:
    # Single replica: Gatus has no leader election, so extra replicas would
    # duplicate every check and alert. History lives in Postgres.
    replicas: 1
    containers:
      gatus:
        image:
          repository: ghcr.io/twin/gatus
          tag: v5.37.0
        ports:
          http: 8080
        env:
          GATUS_CONFIG_PATH: /config/config.yaml
          POSTGRES_URI:
            valueFrom:
              secretKeyRef: { name: gatus-postgres-app, key: uri }
        probes:
          liveness:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          readiness:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 256Mi }
    services:
      gatus:
        ports:
          http: 80
        serviceMonitor:
          enabled: true
    networkPolicy:
      ingress:
        - gateway
        - prometheus
      egress:
        - { datastore: postgres }
        # Checks hit public hostnames (Cloudflare or gateway LB IPs).
        - world

datastores:
  postgres:
    engine: postgres
    type: cnpg
    image: { repository: ghcr.io/cloudnative-pg/postgresql, tag: "18.6" }
    storage: { size: 2Gi }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    monitoring: true

# Generated from config.yaml by kustomization.yaml; the name gets a content hash.
persistence:
  config:
    type: configMap
    name: gatus-config
    globalMounts:
      - path: /config
        readOnly: true

# Origin route; status.nulcell.com is published by cloudflared with this Host header.
routes:
  gatus:
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: internal
        namespace: gateway
        sectionName: https-internal
    hostnames: [status.internal.nulcell.com]
    rules:
      - matches: [{ path: { type: PathPrefix, value: / } }]
        backends: [{ workload: gatus, service: gatus, port: http }]
