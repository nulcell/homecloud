apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-http-api
  namespace: actual-budget
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 2h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: actual-http-api
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: nbod7fc6moceeitnaaiz4sgpky/api-key # homecloud-k8s/actual-http-api/api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: actual-server-password
      remoteRef:
        key: nbod7fc6moceeitnaaiz4sgpky/actual-server-password # homecloud-k8s/actual-http-api/actual-server-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
