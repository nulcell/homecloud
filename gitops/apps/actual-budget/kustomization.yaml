apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: actual-budget

helmCharts:
  - name: actualbudget
    repo: https://community-charts.github.io/helm-charts
    releaseName: actualbudget
    version: 1.9.4
    namespace: actual-budget
    valuesFile: values.yaml
    includeCRDs: false

resources:
  - namespace.yaml
  - httproute.yaml
  - actual-http-api-external-secret.yaml
  - actual-http-api.yaml

images:
  - name: jhonderson/actual-http-api
    newTag: 26.8.1
