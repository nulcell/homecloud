apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: actual-budget

# Roll workloads when their ExternalSecret-backed Secrets change.
commonAnnotations:
  reloader.stakater.com/auto: "true"

helmCharts:
  - name: app-template
    repo: oci://ghcr.io/nulcell/charts
    version: 0.3.4
    releaseName: actualbudget
    namespace: actual-budget
    valuesFile: values.yaml
    includeCRDs: false

resources:
  - namespace.yaml
