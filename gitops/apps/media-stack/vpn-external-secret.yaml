apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-stack-vpn
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: media-stack-vpn
    creationPolicy: Owner
  data:
    - secretKey: openvpn-user
      remoteRef:
        key: nordvpn/openvpn-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: openvpn-password
      remoteRef:
        key: nordvpn/openvpn-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: wireguard-private-key
      remoteRef:
        key: nordvpn/wireguard-private-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
