# -- This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replica:
  # -- This will use DaemonSet to deploy cloudflared to all nodes
  allNodes: false
  # -- If previous flag disabled, this will use Deployment to deploy cloudflared only number of following count
  count: 2

tunnelConfig:
  # Must match the tunnel name you created with: cloudflared tunnel create <name>
  name: homecloud-k8s
  logLevel: info
  protocol: auto

tunnelSecrets:
  existingPemFileSecret:
    name: cloudflared-cert-pem
    key: cert.pem
  existingConfigJsonFileSecret:
    name: cloudflared-credentials-json
    key: credentials.json

ingress:
  - hostname: workflow.nulcell.com
    service: https://cilium-gateway-internal.gateway.svc.cluster.local
    originRequest:
      httpHostHeader: workflow.internal.nulcell.com
      noTLSVerify: true
  - hostname: auth.nulcell.com
    service: https://cilium-gateway-internal.gateway.svc.cluster.local
    originRequest:
      httpHostHeader: auth.internal.nulcell.com
      noTLSVerify: true
  - hostname: budget.nulcell.com
    service: https://cilium-gateway-internal.gateway.svc.cluster.local
    originRequest:
      httpHostHeader: budget.internal.nulcell.com
      noTLSVerify: true
  - hostname: wiki.nulcell.com
    service: https://cilium-gateway-internal.gateway.svc.cluster.local
    originRequest:
      httpHostHeader: wiki.internal.nulcell.com
      noTLSVerify: true
  - hostname: home.nulcell.com
    service: https://cilium-gateway-internal.gateway.svc.cluster.local
    originRequest:
      httpHostHeader: home.internal.nulcell.com
      noTLSVerify: true
  - hostname: status.nulcell.com
    service: https://cilium-gateway-internal.gateway.svc.cluster.local
    originRequest:
      httpHostHeader: status.internal.nulcell.com
      noTLSVerify: true
  # Public portfolio site. Both the apex and www serve the same origin.
  - hostname: nulcell.com
    service: https://cilium-gateway-internal.gateway.svc.cluster.local
    originRequest:
      httpHostHeader: portfolio.internal.nulcell.com
      noTLSVerify: true
  - hostname: www.nulcell.com
    service: https://cilium-gateway-internal.gateway.svc.cluster.local
    originRequest:
      httpHostHeader: portfolio.internal.nulcell.com
      noTLSVerify: true
  - hostname: recipes.nulcell.com
    service: http://mealie.mealie.svc.cluster.local:9000
  - service: http_status:404

imagePullSecrets:
  - name: dockerhub-credentials

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    # cpu: 200m
    memory: 128Mi
