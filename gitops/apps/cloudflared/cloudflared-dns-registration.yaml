apiVersion: batch/v1
kind: Job
metadata:
  name: cloudflared-dns-registration
  namespace: cloudflared
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      # cloudflare/cloudflared is distroless — call the binary directly, no shell.
      # Add a new initContainer for each additional hostname.
      initContainers:
        - name: register-n8n
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          command: ["cloudflared"]
          args:
            - tunnel
            - --origincert
            - /etc/cloudflared/cert.pem
            - route
            - dns
            - homecloud-k8s
            - n8n.nulcell.com
          volumeMounts:
            - name: cert-pem
              mountPath: /etc/cloudflared
              readOnly: true
      containers:
        - name: done
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          command: ["cloudflared"]
          args: ["--version"]
      volumes:
        - name: cert-pem
          secret:
            secretName: cloudflared-cert-pem
            items:
              - key: cert.pem
                path: cert.pem
