{{- $tunnel := .Values.tunnelConfig.name -}}
{{- $certSecret := .Values.tunnelSecrets.existingPemFileSecret.name -}}
{{- $certKey := .Values.tunnelSecrets.existingPemFileSecret.key -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: cloudflared-dns-registration
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- range .Values.ingress }}
        {{- if .hostname }}
        - name: {{ printf "register-%s" (.hostname | replace "." "-") | trunc 63 | trimSuffix "-" }}
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          command: ["cloudflared"]
          args:
            - tunnel
            - --origincert
            - /etc/cloudflared/cert.pem
            - route
            - dns
            - {{ $tunnel }}
            - {{ .hostname }}
          volumeMounts:
            - name: cert-pem
              mountPath: /etc/cloudflared
              readOnly: true
        {{- end }}
        {{- end }}
      containers:
        - name: done
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          command: ["cloudflared"]
          args: ["--version"]
      volumes:
        - name: cert-pem
          secret:
            secretName: {{ $certSecret }}
            items:
              - key: {{ $certKey }}
                path: cert.pem
