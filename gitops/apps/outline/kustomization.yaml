apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outline

helmCharts:
  - name: outline
    repo: https://community-charts.github.io/helm-charts
    releaseName: outline
    version: 0.9.3
    namespace: outline
    valuesFile: values.yaml
    includeCRDs: false

resources:
  - namespace.yaml
  - postgres-cluster.yaml
  - redis.yaml
  - outline-external-secrets.yaml
  - httproute.yaml
