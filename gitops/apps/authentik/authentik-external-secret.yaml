apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret-key
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 2h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-secret-key
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: oaxzdx5mix4nghyg7pi3v5teom/secret-key # homecloud-k8s/authentik-secret-key/secret-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
