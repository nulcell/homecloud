apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik

helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    releaseName: authentik
    version: 2026.5.2
    namespace: authentik
    valuesFile: values.yaml
    includeCRDs: false

resources:
  - namespace.yaml
  - postgres-cluster.yaml
  - httproute.yaml

generators:
  - secret-generator.yaml
