replicaCount: 1

# image:
#   repository: dhi.io/uptime-kuma

imagePullSecrets:
  - name: dockerhub-credentials
  - name: dhi-credentials

gateway:
  enabled: true
  hostname: status.internal.nulcell.com
  parentRef:
    name: internal
    namespace: gateway
    sectionName: https-internal

persistence:
  enabled: false

database:
  type: mariadb
  mariadb:
    hostname: mariadb-cluster
    port: 3306
    name: uptime-kuma
    username: uptime-kuma
    existingSecret: mariadb-uptime-kuma-password
    secretPasswordKey: password

# The MariaDB pods get their own policy in mariadb-netpol.yaml.
networkPolicy:
  ingress:
    # Unverified whether homarr widgets use the internal Service URL -
    # allowed for now, tighten once confirmed unused.
    allowedNamespaces:
      - homarr
  egress:
    database:
      # Pods created by mariadb-operator for the mariadb-cluster resource.
      podSelector:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/instance: mariadb-cluster
