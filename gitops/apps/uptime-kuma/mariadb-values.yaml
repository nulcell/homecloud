mariadb:
  rootPasswordSecretKeyRef:
    name: mariadb-root
    key: password
    generate: true

  replicas: 1

  storage:
    storageClassName: longhorn
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    max_allowed_packet=256M
    innodb_buffer_pool_size=512M

databases:
  - name: uptime-kuma
    characterSet: utf8mb4
    collate: utf8mb4_unicode_ci
    cleanupPolicy: Delete

users:
  - name: uptime-kuma
    passwordSecretKeyRef:
      name: mariadb-uptime-kuma-password
      key: password
      generate: true
    host: "%"
    cleanupPolicy: Delete

grants:
  - name: uptime-kuma
    privileges:
      - SELECT
      - INSERT
      - UPDATE
      - DELETE
      - CREATE
      - DROP
      - ALTER
      - INDEX
      - REFERENCES
    database: uptime-kuma
    table: "*"
    username: uptime-kuma
    host: "%"
    grantOption: false
    cleanupPolicy: Delete
