apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# kube-system is bootstrapped by Talos and already hosts Cilium; we don't
# manage the Namespace object from here, only the chart's resources within it.
namespace: kube-system

helmCharts:
  - name: metrics-server
    repo: https://kubernetes-sigs.github.io/metrics-server
    version: 3.13.1
    releaseName: metrics-server
    namespace: kube-system
    valuesFile: values.yaml
    includeCRDs: true
