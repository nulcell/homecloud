# metrics-server 3.13.0 values.
# `--kubelet-insecure-tls` is the homelab shortcut; tighten once kubelet
# server-cert rotation is trusted by the cluster CA.
args:
  - --kubelet-insecure-tls
  - --kubelet-preferred-address-types=InternalIP,Hostname,InternalDNS,ExternalDNS,ExternalIP

resources:
  requests:
    cpu: 20m
    memory: 40Mi
  limits:
    cpu: 100m # Prevents CPU starvation during intensive api-server scrapes
    memory: 200Mi # Headroom to comfortably cache metrics for ~100+ active pods
