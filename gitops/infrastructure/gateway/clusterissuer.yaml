# Production Let's Encrypt. Switched from staging after DNS-01 flow was verified.
# Rate limits to keep in mind: 50 certs per registered domain per week,
# 5 duplicate certs per week, 300 new orders per account per 3 hours.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-nulcell-com
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: cloud@nulcell.com
    privateKeySecretRef:
      name: letsencrypt-nulcell-com-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones: [nulcell.com]
