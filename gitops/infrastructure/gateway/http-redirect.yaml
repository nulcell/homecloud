# Catch-all HTTP -> HTTPS redirect for both Gateways.
#
# No `hostnames:` means this route matches every Host on the `http` listener
# (which itself sets no hostname), so any app reachable on port 80 gets a 301
# to https without needing its own redirect route.
#
# Per-app redirect routes with an explicit hostname still take precedence over
# this one (Gateway API ranks exact hostname > wildcard > no hostname), so the
# existing ones can be removed app by app rather than in one cutover. That same
# rule is the escape hatch if something ever needs to stay on plain HTTP: give
# it a hostname-scoped route on the `http` listener and it wins over this.
#
# Certs are DNS-01 (see clusterissuer.yaml), so there is no ACME HTTP-01
# challenge path on port 80 that this would swallow.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: gateway
      sectionName: http
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: gateway
      sectionName: http
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
