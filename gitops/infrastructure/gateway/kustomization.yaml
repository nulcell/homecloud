apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level `namespace:` — this folder spans two namespaces:
#   * gateway          (Namespace, Gateway, Certificate)
#   * cert-manager     (ClusterIssuer's referenced api-token Secret)
# Cluster-scoped resources (GatewayClass, ClusterIssuer) ignore namespace.
# Every namespaced resource sets its own `metadata.namespace`.
resources:
  - namespace.yaml
  - gatewayclass.yaml
  - clusterissuer.yaml
  - wildcard-certificate.yaml
  - gateway-external.yaml
  - gateway-internal.yaml
generators:
  - secret-generator.yaml
