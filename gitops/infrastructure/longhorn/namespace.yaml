apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    # Longhorn's instance-manager, CSI plugin, and node components run privileged
    # (hostPath, hostNetwork, raw block access). PSA is per-namespace, so the whole
    # namespace gets bumped to privileged.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
