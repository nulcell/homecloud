# cert-manager 1.20.2 values.
crds:
  enabled: true
prometheus:
  enabled: true
  servicemonitor:
    enabled: true

# Lease defaults to `kube-system`, but the kustomize helmCharts wrapper rewrites
# every namespaced resource to `cert-manager` — including the leader-election
# Role / RoleBinding the chart ships for kube-system. Keeping the lease in the
# cert-manager namespace means the controller can actually acquire it. Without
# this override the controller crashloops on `leases ... forbidden in kube-system`.
global:
  leaderElection:
    namespace: cert-manager

# DNS-01 self-check uses these recursors instead of the pod's resolv.conf.
# Bypasses the home DNS at 10.10.31.254, which may shadow the nulcell.com zone
# and mask the TXT records cert-manager just created in Cloudflare.
extraArgs:
  - --dns01-recursive-nameservers-only
  - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m # Extra headroom for crypto operations / key parsing
    memory: 128Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi # Higher baseline due to memory-heavy internal API caching
    limits:
      cpu: 100m
      memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
