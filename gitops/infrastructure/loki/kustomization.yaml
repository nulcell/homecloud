apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: loki

helmCharts:
  - name: loki
    repo: https://grafana-community.github.io/helm-charts
    version: 17.1.7
    releaseName: loki
    namespace: loki
    valuesFile: loki-values.yaml
  - name: fluent-bit
    repo: https://fluent.github.io/helm-charts
    version: 0.57.6
    releaseName: fluent-bit
    namespace: loki
    valuesFile: fluentbit-values.yaml

resources:
  - namespace.yaml
