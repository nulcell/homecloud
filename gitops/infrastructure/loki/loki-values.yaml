deploymentMode: Monolithic

loki:
  auth_enabled: false
  # Single-instance deployment: use in-memory ring KV store so stale ring entries
  # from pod restarts can never accumulate and cause "too many unhealthy instances".
  commonConfig:
    replication_factor: 1
  ingester:
    lifecycler:
      ring:
        kvstore:
          store: inmemory
        replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
    storageClass: longhorn

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false

minio:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
  selfMonitoring:
    enabled: false
lokiCanary:
  enabled: false

test:
  enabled: false
