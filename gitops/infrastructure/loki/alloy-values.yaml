controller:
  type: deployment

alloy:
  configMap:
    content: |
      // Discover pods across all namespaces; infra/system namespaces are
      // dropped below instead of hand-maintaining an allow-list of every
      // app namespace here.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Relabel: drop completed pods and infra/system namespaces, set Loki labels
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Succeeded|Failed"
          action        = "drop"
        }

        // Kubernetes built-ins, plus this repo's gitops/infrastructure,
        // gitops/operators, and gitops/security namespaces.
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "kube-system|kube-public|kube-node-lease|monitoring|loki|longhorn-system|cnpg-system|kubevirt|falco|kubescape"
          action        = "drop"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      // Stream logs from the Kubernetes API (no host volume mounts required)
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.loki.receiver]
      }

      // Push to Loki
      loki.write "loki" {
        endpoint {
          url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

serviceMonitor:
  enabled: true
