# Trimmed for a single-node homelab. Adjust storage sizes and retention to taste.
fullnameOverride: kps

# Talos exposes kube-controller-manager / scheduler / proxy differently -
# we disable proxy entirely (Cilium replaces it) and let the others stay on host.
kubeProxy:
  enabled: false
kubeControllerManager:
  endpoints: []
kubeScheduler:
  endpoints: []
kubeEtcd:
  enabled: true
  service:
    enabled: true
    port: 2381

prometheus:
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 50Gi
    # Pick up ServiceMonitors / PodMonitors / Rules from any namespace, regardless
    # of their helm-release labels - needed for app teams to ship their own.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    retention: 168h # 7d
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi

grafana:
  enabled: true
  # Deterministic Service name so the HTTPRoute can target `grafana` directly.
  fullnameOverride: grafana

  # Admin creds come from grafana-external-secret.yaml in this folder.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  deploymentStrategy:
    type: Recreate

  persistence:
    enabled: true
    storageClassName: longhorn
    accessModes: [ReadWriteOnce] # [ReadWriteMany]
    size: 5Gi

  defaultDashboardsTimezone: browser

  service:
    type: ClusterIP # exposed via HTTPRoute, not LoadBalancer

  # Disable the chart's Ingress - Gateway API HTTPRoute handles ingress for us.
  ingress:
    enabled: false

  # Tell Grafana its own public URL so absolute links, OAuth callbacks, and
  # rendered dashboard share URLs all work correctly.
  grafana.ini:
    server:
      root_url: https://grafana.nulcell.com
      domain: grafana.nulcell.com
      serve_from_sub_path: false

  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.loki.svc.cluster.local:3100
      access: proxy
      isDefault: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
