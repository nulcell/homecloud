---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubevirt-manager
  namespace: kubevirt-manager
spec:
  parentRefs:
    - name: default
      namespace: gateway
      sectionName: https
  hostnames:
    - kubevirt.nulcell.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: kubevirt-manager
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubevirt-manager-http-redirect
  namespace: kubevirt-manager
spec:
  parentRefs:
    - name: default
      namespace: gateway
      sectionName: http
  hostnames:
    - kubevirt.nulcell.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
