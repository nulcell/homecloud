  #       tar -xzf /tmp/gk-plugin.tar.gz -C /build/plugins/
  #   volumeMounts:
  #     - mountPath: /build/plugins
  #       name: headlamp-plugins

volumeMounts:
  - name: headlamp-plugins
    mountPath: /build/plugins

volumes:
  - name: headlamp-plugins
    emptyDir: {}

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: null
