apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: headlamp

helmCharts:
  - name: headlamp
    repo: https://kubernetes-sigs.github.io/headlamp/
    version: 0.45.0
    releaseName: headlamp
    namespace: headlamp
    valuesFile: values.yaml

resources:
  - namespace.yaml
  - httproute.yaml

# Generate a short-lived token for the UI with the following command:
# # kubectl create token headlamp -n headlamp --duration=1h
