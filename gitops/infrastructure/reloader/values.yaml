# Rolls workloads annotated `reloader.stakater.com/auto: "true"` when a
# Secret/ConfigMap they mount changes (e.g. an ExternalSecret refresh).
reloader:
  deployment:
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
