# Plaintext placeholder — fill in your DockerHub credentials then encrypt:
#   sops --encrypt --in-place gitops/infrastructure/registry-credentials/trivy-dockerhub-auth.enc.yaml
#
# trivy.valuesFromSecret in the trivy-operator helm values points to this
# secret. The operator injects TRIVY_USERNAME and TRIVY_PASSWORD as environment
# variables into every scan job pod, so trivy can authenticate to Docker Hub
# when fetching image manifests in remote mode — regardless of which namespace
# the workload lives in.
#
# Use the same DockerHub username and access token as dockerhub-trivy.enc.yaml.
# The token only needs "Public Repo Read-only" scope.
