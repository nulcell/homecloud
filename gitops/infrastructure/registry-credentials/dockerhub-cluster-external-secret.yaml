apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: dockerhub-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: n8n
    - matchLabels:
        kubernetes.io/metadata.name: authentik
    - matchLabels:
        kubernetes.io/metadata.name: media
    - matchLabels:
        kubernetes.io/metadata.name: actual-budget
    - matchLabels:
        kubernetes.io/metadata.name: kubescape
    - matchLabels:
        kubernetes.io/metadata.name: tailscale
    - matchLabels:
        kubernetes.io/metadata.name: cloudflared
  externalSecretSpec:
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword
    target:
      name: dockerhub-credentials
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
    data:
      - secretKey: .dockerconfigjson
        remoteRef:
          key: aet7l7ijgrww3i24xlquysv4o4/config # homecloud-k8s/dockerhub-credentials/config
          conversionStrategy: Default
          decodingStrategy: None
          metadataPolicy: None
          nullBytePolicy: Ignore
    refreshInterval: 3h
