# .mise.toml — Tool version management for homecloud
# Run `mise install` to install all pinned tools.
# Run `mise use <tool>@<version>` to update a pinned version.
# See https://mise.jdx.dev

[tools]

# ── Infrastructure as Code ────────────────────────────────────────────────────
terraform   = "1.11.4"
terragrunt  = "0.93.3"

# ── Kubernetes ───────────────────────────────────────────────────────────────
kubectl  = "1.32.5"
helm     = "3.17.3"
argocd   = "2.14.9"

# ── Talos Linux ──────────────────────────────────────────────────────────────
# talosctl manages Talos Linux nodes and clusters.
# talhelper is a helper for generating Talos configs (optional, used in catalog).
talosctl  = "1.9.5"
talhelper = "3.0.20"

# ── Tailscale ────────────────────────────────────────────────────────────────
# CLI for interacting with the Tailscale control plane during debugging.
tailscale = "latest"

# ── CloudStack ───────────────────────────────────────────────────────────────
# cloudmonkey: Python-based CloudStack CLI (installed via pipx backend).
"pipx:cloudmonkey" = "latest"

# ── Cloud / Secrets ──────────────────────────────────────────────────────────
# 1Password CLI: used by Terraform 1Password provider at plan/apply time.
# Install via: brew install 1password-cli  (not managed by mise — system-level)

# ── Networking / DNS ──────────────────────────────────────────────────────────
cilium-cli  = "0.18.4"

# ── Data processing ──────────────────────────────────────────────────────────
yq  = "4.45.2"
jq  = "1.7.1"

# ── Language runtimes ─────────────────────────────────────────────────────────
python = "3.11.7"

# ── Local testing ─────────────────────────────────────────────────────────────
kind = "0.27.0"

[settings]
# Automatically activate tool versions when entering directories.
experimental = true
