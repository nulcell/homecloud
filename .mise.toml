# .mise.toml — Tool version management for homecloud
# Run `mise install` to install all pinned tools.
# Run `mise use <tool>@<version>` to update a pinned version.
# See https://mise.jdx.dev

[tools]

# ── Infrastructure as Code ────────────────────────────────────────────────────
terraform   = "1.14.7"
terragrunt  = "0.99.4"

# ── Kubernetes ───────────────────────────────────────────────────────────────
kubectl  = "1.33.10"
helm     = "3.20.1"
argocd   = "3.3.4"

# ── Talos Linux ──────────────────────────────────────────────────────────────
# talosctl manages Talos Linux nodes and clusters.
# talhelper is a helper for generating Talos configs.
talosctl  = "1.12.6"
talhelper = "3.1.7"

# ── Tailscale ────────────────────────────────────────────────────────────────
# CLI for interacting with the Tailscale control plane during debugging.
"aqua:tailscale/tailscale" = "1.96.2"

# ── CloudStack ───────────────────────────────────────────────────────────────
# cloudmonkey: CloudStack CLI.
"github:apache/cloudstack-cloudmonkey" = "6.5.0"

# ── Cloud / Secrets ──────────────────────────────────────────────────────────
# 1Password CLI: used by Terraform 1Password provider at plan/apply time.
# Install via: brew install 1password-cli  (not managed by mise — system-level)

# ── Networking / DNS ──────────────────────────────────────────────────────────
cilium-cli  = "0.19.2"

# ── Data processing ──────────────────────────────────────────────────────────
yq  = "4.52.4"
jq  = "1.7.1"

# ── Language runtimes ─────────────────────────────────────────────────────────
python = "3.13.12"

# ── Local testing ─────────────────────────────────────────────────────────────
kind = "0.23.0"

[settings]
# Automatically activate tool versions when entering directories.
experimental = true
