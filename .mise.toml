# .mise.toml - Tool version management for homecloud
# Run `mise install` to install all pinned tools.
# Run `mise use <tool>@<version>` to update a pinned version.
# See https://mise.jdx.dev

[tools]

# ── Kubernetes ───────────────────────────────────────────────────────────────
kubectl     = "1.36.1"
helm        = "4.2.0"
helmfile    = "1.8.0"
kustomize   = "5.8.1"
kubeconform = "0.8.0"
argocd      = "3.4.5"

# ── Talos Linux ──────────────────────────────────────────────────────────────
talosctl = "1.13.2"

# ── Networking ───────────────────────────────────────────────────────────────
# cilium-cli: debug Cilium / Gateway API / L2 announcements.
# tailscale CLI: interact with the tailnet during operator work.
cilium-cli                 = "0.19.7"
"aqua:tailscale/tailscale" = "1.96.2"

# ── Data processing ──────────────────────────────────────────────────────────
yq   = "4.53.2"
jq   = "1.8.1"

# ── Secrets ──────────────────────────────────────────────────────────────────
# SOPS + age encrypt the bootstrap 1Password credential (cluster/bootstrap/).
# 1Password CLI is installed system-wide via Homebrew (not managed by mise).
sops = "3.13.0"
age  = "1.3.1"

[env]
# Talos image + node addresses; bump with each upgrade.
SCHEMATIC_ID = "d78c7cda9fda387e6420896d82d50d5cc97d004feeece7812703c5e1582b82f7"
TALOS_VERSION = "v1.13.2"
KUBERNETES_VERSION = "v1.36.1"
CONTROLPLANE_IP = "10.10.17.5"
WORKER_IP = "10.10.27.254"
# sops looks in ~/Library/Application Support on macOS; the key lives here.
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/keys.txt"

[tasks.render]
description = "Render a gitops dir (kustomize + helm)"
usage = 'arg "<dir>"'
run = 'kustomize build --enable-helm "$usage_dir"; git clean -fdXq -- "$usage_dir/charts"'

[tasks.validate]
description = "Render + schema-check gitops dirs (all, or the ones given)"
usage = 'arg "[dirs]" var=#true'
run = "scripts/validate.sh $usage_dirs"

[tasks.bootstrap]
description = "Install Cilium + ArgoCD and hand off to GitOps"
run = "helmfile -f cluster/bootstrap/helmfile.yaml sync" # sync: no helm-diff plugin needed

[tasks."talos:upgrade"]
description = "Upgrade Talos on one node (IP) to $TALOS_VERSION; run per node, workers first. Longhorn (2 replicas) blocks the drain until it is safe"
usage = 'arg "<node>"'
run = 'talosctl upgrade -n "$usage_node" --image "factory.talos.dev/metal-installer/$SCHEMATIC_ID:$TALOS_VERSION" --drain-timeout 45m --timeout 90m'

[tasks."talos:upgrade-k8s"]
description = "Upgrade Kubernetes to $KUBERNETES_VERSION (add --dry-run to preview)"
run = 'talosctl upgrade-k8s -n "$CONTROLPLANE_IP" --to "$KUBERNETES_VERSION"'

[tasks.restore]
description = "Replace a PVC with a Longhorn backup; lists them and asks which (Enter = newest)"
usage = '''
arg "<pvc>" help="namespace/pvc"
arg "[number]" help="skip the prompt: position in the printed list (1 = newest)"
'''
run = 'scripts/cluster.sh restore "$usage_pvc" $usage_number'

[tasks."cluster:shutdown"]
description = "Hibernate databases, detach all volumes, power off the nodes"
run = "scripts/cluster.sh shutdown"

[tasks."cluster:start"]
description = "After powering nodes on: uncordon and un-hibernate"
run = "scripts/cluster.sh start"

[tasks."argo:sync"]
description = "Sync an ArgoCD Application"
usage = 'arg "<app>"'
run = 'argocd app sync "$usage_app"'

[settings]
# Automatically activate tool versions when entering directories.
experimental = true
