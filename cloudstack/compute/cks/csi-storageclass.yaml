# Example template from `https://github.com/cloudstack/cloudstack-csi-driver/raw/refs/heads/main/examples/k8s/0-storageclass.yaml`
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cloudstack-custom-disk-offering
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: csi.cloudstack.apache.org
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  csi.cloudstack.apache.org/disk-offering-id: b26fdc5f-1ca4-47b9-aaa4-80b610e5b652 # ID of `shared.custom` disk offering
